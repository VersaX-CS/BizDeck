  </defs>
  
  <!-- Rounded rectangle background -->
  <rect x="20" y="20" width="152" height="152" rx="32" fill="url(#grad192)"/>
  
  <!-- Main "B" shape -->
  <path d="M 56 42 L 102 42 Q 122 42 122 58 L 122 78 Q 122 92 108 98 Q 130 108 130 130 L 130 155 Q 130 168 112 168 L 56 168 Z" fill="#0052CC" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  
