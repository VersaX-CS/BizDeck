// Unified, chronological ledger of every accounting document the
// business has issued — invoices, receipts, and credit/debit notes —
// each one linked back to the invoice it belongs to. Standard
// bookkeeping practice: every document is numbered, nothing is ever
// silently edited or deleted, and voided documents stay visible for
// the audit trail.
function renderBooksDocumentsView(){
  const business = state.business;
  const filter = state.booksDocFilter || "all";
  const entries = [];
  state.orders.filter(isRealOrder).forEach(o=>{
    if(invoiceIsDraft(o)) return; // drafts aren't real accounting documents yet
    const client = findClient(o.clientId);
    entries.push({
      kind:"invoice", date:(o.issuedAt||o.createdAt||"").slice(0,10), sortAt:o.issuedAt||o.createdAt||"",
      docNo:o.invoiceNo, status:o.docStatus, amount:orderTotal(o),
      clientName:client?client.name:"—", orderId:o.id, title:o.title
    });
    (o.payments||[]).forEach(p=>{
      entries.push({
        kind:"receipt", date:p.date, sortAt:p.issuedAt||p.date||"",
        docNo:p.receiptNo, status:p.status||"issued", amount:p.amount,
        clientName:client?client.name:"—", orderId:o.id, title:o.title
      });
    });
  });
  (state.creditNotes||[]).forEach(n=>{
    const order = findOrder(n.orderId);
    const client = order ? findClient(order.clientId) : null;
    entries.push({
      kind:n.type==="debit"?"debit":"credit", date:n.date, sortAt:n.createdAt||n.date||"",
      docNo:n.docNo, status:n.status, amount:n.amount,
      clientName:client?client.name:"—", orderId:n.orderId, title:order?order.title:""
    });
  });
  const filtered = filter==="all" ? entries : entries.filter(e=>e.kind===filter);
  filtered.sort((a,b)=> (b.sortAt||"").localeCompare(a.sortAt||""));

  const kindLabel = { invoice:"Invoice", receipt:"Receipt", credit:"Credit note", debit:"Debit note" };
  const kindIcon = { invoice:"ledger", receipt:"cash", credit:"arrowDown", debit:"arrowUp" };
  const totals = { invoice:0, receipt:0, credit:0, debit:0 };
  entries.forEach(e=>{ if(e.status!=="void") totals[e.kind] = (totals[e.kind]||0) + Number(e.amount||0); });

  return (
    '<div class="grid-stats" style="margin-bottom:14px;">'+
      '<div class="card"><div style="font-size:11.5px;color:var(--ink-soft);">Invoiced</div><div class="mono" style="font-weight:700;font-size:16px;">'+money(totals.invoice,business.currency)+'</div></div>'+

      '<div class="card"><div style="font-size:11.5px;color:var(--ink-soft);">Credit notes</div><div class="mono" style="font-weight:700;font-size:16px;color:var(--rust);">-'+money(totals.credit,business.currency)+'</div></div>'+
      '<div class="card"><div style="font-size:11.5px;color:var(--ink-soft);">Debit notes</div><div class="mono" style="font-weight:700;font-size:16px;">+'+money(totals.debit,business.currency)+'</div></div>'+
    '</div>'+
    '<div class="chipbar" style="margin-bottom:14px;">'+
      ["all","invoice","receipt","credit","debit"].map(f=>
        '<button class="btn '+(filter===f?"gold":"ghost")+' sm" data-action="select-books-doc-filter" data-filter="'+f+'">'+(f==="all"?"All":kindLabel[f]+"s")+'</button>'
      ).join("")+
    '</div>'+
    (filtered.length===0 ?
      '<div class="empty" style="display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 16px;">'+
        '<div>No documents yet — invoices, receipts, credit and debit notes appear here as you issue them.</div>'+
      '</div>' :
      '<div style="display:flex;flex-direction:column;gap:8px;">'+
        filtered.map(e=>{
          const isVoidE = e.status==="void";
          const statusLabel = isVoidE ? "Void" : (e.kind==="invoice" ? (e.status==="issued"?"Issued":"Draft") : "Issued");
          return '<div class="card" style="cursor:pointer;" data-action="open-order-modal" data-id="'+e.orderId+'">'+
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">'+

function renderBooksInsights(){
  const business = state.business;
  const period = state.booksPeriod || "month";
  const range = booksPeriodRange(period);
  const periodLabels = {month:"This month", lastmonth:"Last month", all:"All time"};
  const realOrders = state.orders.filter(isRealOrder);

  const ordersInPeriod = realOrders.filter(o => o.status!=="Cancelled" && inBooksPeriod((o.createdAt||"").slice(0,10), range));
  const revenueInPeriod = ordersInPeriod.reduce((s,o)=>s+orderTotal(o),0);
  const avgOrderValue = ordersInPeriod.length ? revenueInPeriod/ordersInPeriod.length : 0;

  // Best sellers within the period, by line-item description.
  const salesCount = {}, salesRevenue = {};
  ordersInPeriod.forEach(o=>(o.items||[]).forEach(it=>{
    if(!it.desc) return;
    salesCount[it.desc] = (salesCount[it.desc]||0)+1;
    salesRevenue[it.desc] = (salesRevenue[it.desc]||0)+Number(it.price||0);
  }));
  const bestSellers = Object.keys(salesCount).map(desc=>({desc, count:salesCount[desc], revenue:salesRevenue[desc]}))
    .sort((a,b)=>b.count-a.count).slice(0,8);

  // Repeat-client rate — a lifetime metric across all real orders, not period-scoped.
  const ordersByClient = {};
  realOrders.forEach(o=>{ if(!o.clientId) return; (ordersByClient[o.clientId]=ordersByClient[o.clientId]||[]).push(o); });
  const clientIdsWithOrders = Object.keys(ordersByClient);
  const repeatClientIds = clientIdsWithOrders.filter(id=>ordersByClient[id].length>1);
  const repeatRate = clientIdsWithOrders.length ? Math.round((repeatClientIds.length/clientIdsWithOrders.length)*100) : 0;

  // New vs returning, scoped to the selected period: a client counts as "new"
  // if their earliest-ever order falls inside the period.
  const firstOrderDate = {};
  clientIdsWithOrders.forEach(id=>{
    const dates = ordersByClient[id].map(o=>(o.createdAt||"")).filter(Boolean).sort();
    firstOrderDate[id] = dates[0]||"";
  });
  const periodClientIds = Array.from(new Set(ordersInPeriod.map(o=>o.clientId).filter(Boolean)));
  const newClientIds = periodClientIds.filter(id => inBooksPeriod((firstOrderDate[id]||"").slice(0,10), range));
  const returningCount = periodClientIds.length - newClientIds.length;

  const kpi = (label, value, sub) =>
    '<div style="flex:1;min-width:120px;"><div style="font-size:11.5px;color:var(--ink-soft);">'+esc(label)+'</div>'+
    '<div class="mono" style="font-weight:700;font-size:16px;">'+value+'</div>'+
    (sub?'<div style="font-size:10.5px;color:var(--ink-soft);">'+esc(sub)+'</div>':'')+'</div>';

  return (
    '<div class="chipbar" style="margin-bottom:14px;">'+
      Object.keys(periodLabels).map(p=>
        '<button class="btn '+(period===p?"gold":"ghost")+' sm" data-action="select-books-period" data-period="'+p+'">'+periodLabels[p]+'</button>'
      ).join("")+
    '</div>'+
    '<div class="card" style="margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;">'+
      kpi(nounFor("recordPlural")+" placed", ordersInPeriod.length, periodLabels[period])+
      kpi("Avg order value", money(avgOrderValue,business.currency))+
      kpi("New clients", newClientIds.length, periodLabels[period])+
      kpi("Returning clients", Math.max(0,returningCount), periodLabels[period])+
    '</div>'+
    '<div class="card" style="margin-bottom:16px;">'+
      '<div class="disp" style="font-weight:600;margin-bottom:4px;">Repeat-client rate</div>'+
      '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Share of all-time '+nounFor("clientPlural").toLowerCase()+' with more than one '+nounFor("record").toLowerCase()+' — a lifetime figure, not limited to the period above.</div>'+
      '<div style="display:flex;align-items:center;gap:12px;">'+
        '<div class="mono" style="font-size:26px;font-weight:800;color:'+(repeatRate>=30?"var(--green)":"var(--ink)")+';">'+repeatRate+'%</div>'+
        '<div style="font-size:12px;color:var(--ink-soft);">'+repeatClientIds.length+' of '+clientIdsWithOrders.length+' '+nounFor("clientPlural").toLowerCase()+' have come back for more than one '+nounFor("record").toLowerCase()+'.</div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="disp" style="font-weight:600;margin-bottom:10px;">Best sellers — '+periodLabels[period]+'</div>'+
      (bestSellers.length===0 ? '<div class="empty">No sales recorded in this period yet.</div>' :
        bestSellers.map((b,i)=>
          '<div class="rowline"><span>'+(i+1)+'. '+esc(b.desc)+'</span>'+
          '<span style="display:flex;gap:10px;align-items:center;">'+
            '<span style="font-size:11.5px;color:var(--ink-soft);">×'+b.count+'</span>'+
            '<span class="mono" style="font-weight:600;">'+money(b.revenue,business.currency)+'</span>'+
          '</span></div>'
        ).join("")
      )+
    '</div>'
  );
}

function ensureBilling(b){
  if(!b.billing) b.billing = { invoicePrefix:"INV", receiptPrefix:"RCT", quotePrefix:"EST", nextInvoiceSeq:1, nextReceiptSeq:1, nextQuoteSeq:1, defaultTaxPercent:0, taxId:"" };
  if(b.billing.creditNotePrefix===undefined) b.billing.creditNotePrefix = "CRN";
  if(b.billing.nextCreditNoteSeq===undefined) b.billing.nextCreditNoteSeq = 1;
  if(b.billing.debitNotePrefix===undefined) b.billing.debitNotePrefix = "DBN";
  if(b.billing.nextDebitNoteSeq===undefined) b.billing.nextDebitNoteSeq = 1;
  if(b.billing.taxId===undefined) b.billing.taxId = "";
  return b.billing;
}
function ensureDocNumber(order, kind){
  const business = state.business;
  const billing = ensureBilling(business);
  const map = { invoice:["invoiceNo","invoicePrefix","nextInvoiceSeq"], receipt:["receiptNo","receiptPrefix","nextReceiptSeq"], quote:["quoteNo","quotePrefix","nextQuoteSeq"] };
  const [field, prefixKey, seqKey] = map[kind]||map.invoice;
  if(!order[field]){
    const seq = billing[seqKey]||1;
    order[field] = (billing[prefixKey]||"") + "-" + String(seq).padStart(4,"0");
    billing[seqKey] = seq+1;
    persistOrders(); persistBusiness();
  }
  return order[field];
}
// Assigns a permanent, sequential number to a credit or debit note the
// first time it's issued. Notes are final once numbered — void, don't renumber.
function ensureCreditNoteNumber(note){
  const business = state.business;
  const billing = ensureBilling(business);
  const isDebit = note.type==="debit";
  const prefixKey = isDebit ? "debitNotePrefix" : "creditNotePrefix";
  const seqKey = isDebit ? "nextDebitNoteSeq" : "nextCreditNoteSeq";
  if(!note.docNo){
    const seq = billing[seqKey]||1;
    note.docNo = (billing[prefixKey]||"") + "-" + String(seq).padStart(4,"0");
    billing[seqKey] = seq+1;
    persistBusiness();
  }
  return note.docNo;
}
// Assigns a permanent receipt number to a payment the moment it's
// recorded — a receipt is issued as soon as money is received, and from
// then on it can only be voided, never edited or deleted.
function ensurePaymentReceiptNumber(payment){
  const business = state.business;
  const billing = ensureBilling(business);
  if(!payment.receiptNo){
    const seq = billing.nextReceiptSeq||1;
    payment.receiptNo = (billing.receiptPrefix||"") + "-" + String(seq).padStart(4,"0");
    billing.nextReceiptSeq = seq+1;
    persistBusiness();
  }
  return payment.receiptNo;
}

function businessInitials(name){
  return (name||"T S").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function vcardEscape(str){
  return String(str||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function buildBusinessVCard(b){
  const email = (b.email || (state.account && state.account.email) || "").trim();
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:"+vcardEscape(b.name||"Business"),
    "ORG:"+vcardEscape(b.name||"Business"),
  ];
  if(b.phone) lines.push("TEL;TYPE=WORK,VOICE:"+vcardEscape(b.phone));
  if(email) lines.push("EMAIL;TYPE=WORK:"+vcardEscape(email));
  if(b.address) lines.push("ADR;TYPE=WORK:;;"+vcardEscape(b.address)+";;;;");
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

function initSignaturePad(){
  const canvas = document.getElementById("sigCanvas");
  if(!canvas || canvas._sigInit) return;
  canvas._sigInit = true;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1,Math.round(rect.width*dpr));
  canvas.height = Math.max(1,Math.round(rect.height*dpr));
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1E2A28";
  let drawing = false, lastX = 0, lastY = 0;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top];
  }
  function start(e){ drawing = true; [lastX,lastY] = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const [x,y] = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    [lastX,lastY] = [x,y];
    canvas.dataset.hasDrawn = "1";
    e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointerleave", end);
  canvas.addEventListener("pointercancel", end);
}

function modalShell(title, bodyHtml, variant){
  const cls = variant==="full" ? "full" : (variant ? "wide" : "");
  return '<div class="modalwrap" data-action="modal-backdrop"><div class="modal '+cls+'" data-stop="1">'+
    '<div class="modal-head"><h2 class="modal-title">'+esc(title)+'</h2>'+
      '<button class="iconbtn" data-action="close-modal" aria-label="Close">'+icon("close",16)+'</button></div>'+
    bodyHtml+
  '</div></div>';
}
// Wraps a chunk of the order modal in its own titled card, matching the
// natural business flow (details -> items -> money -> documents...).
// Returns "" (renders nothing) when bodyHtml is empty, so conditional

    '</div>'+
    bodyHtml+
  '</div>';
}

// Replaces native confirm()/alert() browser dialogs.
function askConfirm(opts){
  state.confirmDialog = {
    title: opts.title || "Are you sure?",
    body: opts.body || "",
    confirmLabel: opts.confirmLabel || "Confirm",
    cancelLabel: opts.cancelLabel || "Cancel",
    danger: !!opts.danger,
    withReason: !!opts.withReason,
    reasonLabel: opts.reasonLabel || "Reason (optional)",
    onConfirm: opts.onConfirm || function(){}
  };
  state.confirmReasonText = "";
  render();
}
function showAlertDialog(body, title){
  state.alertDialog = { title: title || "Notice", body: body || "" };
  render();
}

function renderInvoiceHelpModal(){

      '</div>'+
      '<div style="margin-bottom:14px;"><strong style="display:block;margin-bottom:6px;">1. Invoice (The Bill)</strong>'+
        'This is your formal request for payment. It shows:'+
        '<ul style="margin:6px 0;padding-left:20px;font-size:12.5px;"><li>What services/items you provided and their prices</li><li>The total amount due</li><li>When payment is due</li></ul>'+
        'Once issued, an invoice is <strong>locked</strong> — you can\'t edit the items or prices anymore (that keeps your records accurate).'+
      '</div>'+
      '<div style="margin-bottom:14px;"><strong style="display:block;margin-bottom:6px;">2. Receipt (Proof of Payment)</strong>'+
        'When a client pays, you generate a receipt as proof. Each receipt is numbered and shows:'+
        '<ul style="margin:6px 0;padding-left:20px;font-size:12.5px;"><li>How much was paid</li><li>When it was paid</li><li>How it was paid (cash, bank transfer, etc.)</li><li>What invoice it was for</li></ul>'+
        'Receipts are also <strong>locked</strong> once created—you can only void them if there\'s a mistake (never edit).'+
      '</div>'+
      '<div style="margin-bottom:14px;"><strong style="display:block;margin-bottom:6px;">3. Balance Tracking</strong>'+
        'The system automatically calculates:<ul style="margin:6px 0;padding-left:20px;font-size:12.5px;"><li><strong>Total:</strong> What you invoiced for</li><li><strong>Paid:</strong> What you\'ve received</li><li><strong>Balance:</strong> What\'s still owed (Total − Paid)</li></ul>'+
        '• If <span style="color:var(--rust);">balance is positive (red)</span> = client still owes money<br>'+
        '• If <span style="color:var(--green);">balance is zero (green)</span> = fully paid<br>'+
        '• If <span style="color:var(--gold);">balance is negative (gold) ⚠️</span> = client overpaid'+
      '</div>'+
      '<div style="margin-bottom:14px;"><strong style="display:block;margin-bottom:6px;">⚠️ Overpayment (Client Paid Too Much)</strong>'+
        'If a client accidentally overpays, the app flags it. You should:'+
        '<ul style="margin:6px 0;padding-left:20px;font-size:12.5px;"><li>Issue a <strong>credit note</strong> (formal record of the extra amount)</li><li>Refund the overpaid amount to the client</li></ul>'+
      '</div>'+
      '<div style="margin-bottom:14px;"><strong style="display:block;margin-bottom:6px;">4. Credit Note vs Debit Note</strong>'+
        'Once an invoice is issued it\'s locked, so you can\'t just edit the amount if something changes afterwards. Credit and debit notes are how you make that correction on paper, without touching the original invoice:'+
        '<ul style="margin:6px 0;padding-left:20px;font-size:12.5px;">'+
          '<li><strong>Credit note</strong> — reduces what the client owes. Use it for a return, an overcharge, a discount agreed after the invoice was issued, or an overpayment.</li>'+
          '<li><strong>Debit note</strong> — increases what the client owes. Use it when you need to bill extra after the invoice was issued: an additional charge, an undercharge you missed, or a correction that raises the total.</li>'+
        '</ul>'+
        'Is a debit note necessary? Only if the invoice needs to go up after it\'s been issued — for example the client asked for extra work, or you spot you charged too little. If you catch the mistake before issuing, just edit the invoice directly; no note needed. Once issued, use a debit note instead of a new invoice so there\'s one clean trail from the original invoice to the correction.'+

function renderOrderModal(){
  const o = state.modal.draft;
  const clients = state.clients;
  const business = state.business;
  const client = clients.find(c=>c.id===o.clientId);
  const kind = recordKind(o);
  const isQuote = kind==="quote";
  const sub = orderSubtotal(o), discount = orderDiscountAmount(o), tax = orderTaxAmount(o);
  const total = orderTotal(o), paid = orderPaid(o), bal = total-paid;
  const info = statusInfo2(o.status, o);
  const recLabel = isQuote ? "quote" : nounFor("record").toLowerCase();

  const isIssued = !isQuote && invoiceIssued(o);
  const isVoidDoc = !isQuote && invoiceVoided(o);
  const locked = isIssued || isVoidDoc;

  const itemsHtml = locked ?
    o.items.map(it=>
      '<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">'+
        '<div style="flex:2;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);">'+esc(it.desc||"—")+'</div>'+
        '<div class="mono" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);">'+money(it.price,business.currency)+'</div>'+
      '</div>'
    ).join("")
    : o.items.map((it,i)=>(
      '<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">'+
        '<input style="flex:2;" data-bind="modal.draft.items.'+i+'.desc" value="'+esc(it.desc)+'" placeholder="e.g. Native wear (agbada)">'+
        '<input class="mono" style="flex:1;" type="number" data-bind="modal.draft.items.'+i+'.price" value="'+esc(it.price)+'" placeholder="Price">'+
        '<button class="iconbtn" data-action="remove-order-item" data-index="'+i+'">'+icon("trash",14)+'</button>'+
      '</div>'
    )).join("");

  // Every payment is a receipt: it's numbered and locked the moment it's
  // recorded. The only way to reverse one afterwards is to void it.
  const paymentsHtml = (o.payments||[]).map((p,idx)=>{
    const isVoidP = p.status==="void";
    const runningBalance = idx===0 ? total - (isVoidP ? 0 : Number(p.amount||0)) : 0;
    let cumPaid = 0;
    for(let i = 0; i <= idx; i++){ if((o.payments[i].status||"") !== "void") cumPaid += Number(o.payments[i].amount||0); }
    const remainingBalance = total - cumPaid;
    return '<div class="rowline" style="'+(isVoidP?"opacity:.55;":"")+'">'+
      '<span>'+fmtDate(p.date)+' · '+esc(p.method)+(p.receiptNo?' · <span class="mono">'+esc(p.receiptNo)+'</span>':'')+
        (isVoidP?' · <span class="pill status-void" style="font-size:10px;padding:2px 7px;">Void</span>':'')+
        (idx>0&&!isVoidP?' · <span class="pill" style="background:var(--surface);color:var(--ink-soft);font-size:9.5px;padding:2px 6px;">Seq #'+(idx+1)+'</span>':'')+
      '</span>'+
      '<span style="display:flex;gap:10px;align-items:center;">'+
        '<div style="font-size:11px;color:var(--ink-soft);text-align:right;">'+
          '<div class="mono" style="'+(isVoidP?"text-decoration:line-through;":"")+'font-weight:600;">'+money(p.amount,business.currency)+'</div>'+
          (!isVoidP ? '<div style="font-size:10px;">Due: '+money(Math.max(0,remainingBalance),business.currency)+'</div>' : '')+
        '</div>'+
        (isVoidP ? '' : '<button class="iconbtn" data-action="void-payment" data-id="'+p.id+'" title="Void this receipt" aria-label="Void this receipt">'+icon("ban",12)+'</button>')+
      '</span></div>';
  }).join("") || '<div class="empty">No payments recorded yet. Add a payment when the client pays.</div>';

  const invoiceSection = state.modal.isExisting && client ? (
    isQuote ? (
      '<div>'+
        '<div class="rowline"><span style="font-size:13.5px;font-weight:500;">Share estimate</span>'+
          '<span style="display:flex;gap:6px;">'+
            '<button class="iconbtn" data-action="preview-invoice-image" data-kind="quote" title="Preview estimate" aria-label="Preview estimate">'+icon("eye",15)+'</button>'+
            '<button class="iconbtn" style="background:#3fa858;border-color:#3fa858;color:#fff;" data-action="share-invoice-image" data-kind="quote" title="Share estimate via WhatsApp" aria-label="Share estimate">'+icon("send",15)+'</button>'+
            '<button class="iconbtn" data-action="download-invoice-image" data-kind="quote" title="Download estimate image" aria-label="Download estimate">'+icon("download",15)+'</button>'+
          '</span>'+
        '</div>'+
      '</div>'+
      '<div style="margin-top:10px;"><button class="btn gold sm" data-action="convert-quote-to-order">'+icon("check",14)+' Convert to '+nounFor("record").toLowerCase()+'</button></div>'
    ) : (
      '<div>'+
        '<div class="rowline"><span style="font-size:13.5px;font-weight:500;">Invoice</span>'+
          '<span style="display:flex;gap:6px;">'+
            '<button class="iconbtn" data-action="preview-invoice-image" data-kind="invoice" title="Preview invoice" aria-label="Preview invoice">'+icon("eye",15)+'</button>'+
            '<button class="iconbtn" style="background:#3fa858;border-color:#3fa858;color:#fff;" data-action="share-invoice-image" data-kind="invoice" title="Share invoice via WhatsApp" aria-label="Share invoice">'+icon("send",15)+'</button>'+
            '<button class="iconbtn" data-action="download-invoice-image" data-kind="invoice" title="Download invoice image" aria-label="Download invoice">'+icon("download",15)+'</button>'+
          '</span>'+
        '</div>'+
        '<div class="rowline"><span style="font-size:13.5px;font-weight:500;">Receipt</span>'+
          '<span style="display:flex;gap:6px;">'+
            '<button class="iconbtn" data-action="preview-invoice-image" data-kind="receipt" title="Preview receipt" aria-label="Preview receipt">'+icon("eye",15)+'</button>'+
            '<button class="iconbtn" style="background:#3fa858;border-color:#3fa858;color:#fff;" data-action="share-invoice-image" data-kind="receipt" title="Share receipt via WhatsApp" aria-label="Share receipt">'+icon("send",15)+'</button>'+
            '<button class="iconbtn" data-action="download-invoice-image" data-kind="receipt" title="Download receipt image" aria-label="Download receipt">'+icon("download",15)+'</button>'+
          '</span>'+
        '</div>'+
        (bal>0 && !isVoidDoc ?
          '<div class="rowline"><span style="font-size:13.5px;font-weight:500;">Payment reminder</span>'+
            '<span style="display:flex;gap:6px;">'+
              '<button class="iconbtn" data-action="preview-reminder-image" title="Preview payment reminder" aria-label="Preview payment reminder">'+icon("eye",15)+'</button>'+
              '<button class="iconbtn" style="background:#3fa858;border-color:#3fa858;color:#fff;" data-action="share-reminder-image" title="Send payment reminder via WhatsApp" aria-label="Send payment reminder">'+icon("send",15)+'</button>'+
              '<button class="iconbtn" data-action="download-reminder-image" title="Download payment reminder image" aria-label="Download payment reminder">'+icon("download",15)+'</button>'+
            '</span>'+
          '</div>'
        : '')+
      '</div>'
    )
  ) : "";

  // Credit & debit notes: only issuable once the invoice itself is issued
  // (they exist to adjust an issued, otherwise-frozen document). Once
  // issued they're just as final — void only, never edited or deleted.
  const cdNotes = (state.modal.isExisting && !isQuote) ? (state.creditNotes||[]).filter(n=>n.orderId===o.id) : [];
  const creditDebitHtml = (state.modal.isExisting && !isQuote) ? (
    (!isIssued ? '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Available once this invoice is issued — used to correct or adjust an issued invoice without editing it.</div>' :
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'+
        '<button class="btn ghost sm" data-action="open-creditnote-modal-new" data-order-id="'+o.id+'" data-type="credit">'+icon("plus",13)+' Issue credit note</button>'+
        '<button class="btn ghost sm" data-action="open-creditnote-modal-new" data-order-id="'+o.id+'" data-type="debit">'+icon("plus",13)+' Issue debit note</button>'+
      '</div>')+
    (cdNotes.length===0 ? '' :
      '<div style="display:flex;flex-direction:column;gap:8px;">'+
        cdNotes.slice().reverse().map(n=>{
          const nVoid = n.status==="void";
          const nCredit = n.type==="credit";
          return '<div class="rowline" style="'+(nVoid?"opacity:.55;":"")+'align-items:flex-start;">'+
            '<span>'+
              '<span class="pill" style="font-size:10px;padding:2px 8px;background:'+(nCredit?"var(--rust-soft)":"var(--gold-soft)")+';color:'+(nCredit?"var(--rust)":"#8A5F1F")+';">'+(nCredit?"Credit note":"Debit note")+'</span>'+
              '<span class="mono" style="margin-left:6px;font-size:12.5px;">'+esc(n.docNo||"")+'</span>'+
              (nVoid?' <span class="pill status-void" style="font-size:10px;padding:2px 7px;">Void</span>':'')+
              (n.reason?'<div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;max-width:280px;">'+esc(n.reason)+'</div>':'')+
            '</span>'+
            '<span style="display:flex;gap:10px;align-items:center;">'+
              '<span class="mono" style="'+(nVoid?"text-decoration:line-through;":"")+'">'+(nCredit?"-":"+")+money(n.amount,business.currency)+'</span>'+
              (nVoid ? '' : '<button class="iconbtn" data-action="void-creditnote" data-id="'+n.id+'" title="Void this note" aria-label="Void this note">'+icon("ban",12)+'</button>')+
            '</span></div>';
        }).join("")+
      '</div>')+
    (cdNotes.some(n=>n.status!=="void") ?
      '<div class="rowline" style="border-top:2px solid var(--line);margin-top:8px;padding-top:8px;"><span style="font-weight:600;">Adjusted balance</span><span class="mono" style="font-weight:700;">'+money(orderAdjustedBalance(o),business.currency)+'</span></div>' : '')
  ) : "";

  if(!o.custom) o.custom = {};
  const extraRecordFieldsHtml = activeRecordFields().map(f=>
    '<div><label>'+esc(f.label)+'</label><input '+(f.type==="number"?'class="mono" type="number"':'type="text"')+' data-bind="modal.draft.custom.'+f.key+'" value="'+esc(o.custom[f.key]||"")+'" placeholder="'+esc(f.placeholder||"")+'"></div>'
  ).join("");

  const discountTaxHtml = locked ? '' :
    '<div style="margin-top:14px;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Discount &amp; tax</div>'+
    '<div class="grid-form2">'+
      '<div><label>Discount</label><div style="display:flex;gap:6px;">'+
        '<input class="mono" type="number" style="flex:1;" data-bind="modal.draft.discountValue" value="'+esc(o.discountValue||0)+'" placeholder="0">'+

          '<option value="percent" '+(o.discountType!=="flat"?"selected":"")+'>%</option>'+
          '<option value="flat" '+(o.discountType==="flat"?"selected":"")+'>'+esc(business.currency||"")+'</option>'+
        '</select>'+
      '</div></div>'+
      '<div><label>Tax rate (%)</label><input class="mono" type="number" data-bind="modal.draft.taxPercent" value="'+esc(o.taxPercent||0)+'" placeholder="0"></div>'+
    '</div>';

  if(!o.recurring) o.recurring = { enabled:false, frequency:"monthly", intervalDays:30, nextDate:"" };
  const rec = o.recurring;
  const recurringHtml = isQuote ? '' : (
    '<div class="rowline" style="padding:0 0 10px 0;border-bottom:none;"><span style="font-size:13px;">Repeat this order automatically</span>'+

      '</div>'+
      (state.modal.isExisting ? (
        '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
          '<button class="btn ghost sm" data-action="generate-recurring-from-modal">'+icon("send",13)+' Generate next invoice now</button>'+
          (rec.lastGeneratedAt ? '<span style="font-size:11.5px;color:var(--ink-soft);">Last generated '+fmtDate(rec.lastGeneratedAt.slice(0,10))+'</span>' : '')+
        '</div>'
      ) : '')
    ) : '<div style="font-size:12px;color:var(--ink-soft);">Turn this on for subscriptions, retainers, or repeat service bookings — a reminder will surface here when the next invoice is due (the app needs to be open to catch it, since there\'s no background server).</div>')
  );

  const totalsCardHtml = isQuote ?
    '<div style="display:flex;gap:16px;padding:12px;flex-wrap:wrap;background:var(--surface);border-radius:10px;">'+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Subtotal</div><div class="mono" id="ordSubVal" style="font-weight:600;">'+money(sub,business.currency)+'</div></div>'+
      (discount>0?'<div><div style="font-size:11.5px;color:var(--ink-soft);">Discount</div><div class="mono" id="ordDiscVal" style="font-weight:600;color:var(--rust);">-'+money(discount,business.currency)+'</div></div>':'')+
      (tax>0?'<div><div style="font-size:11.5px;color:var(--ink-soft);">Tax</div><div class="mono" id="ordTaxVal" style="font-weight:600;">'+money(tax,business.currency)+'</div></div>':'')+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Total estimate</div><div class="mono" id="ordTotalVal" style="font-weight:600;">'+money(total,business.currency)+'</div></div>'+
    '</div>'
    :
    '<div style="display:flex;gap:16px;padding:12px;flex-wrap:wrap;background:var(--surface);border-radius:10px;">'+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Subtotal</div><div class="mono" id="ordSubVal" style="font-weight:600;">'+money(sub,business.currency)+'</div></div>'+
      (discount>0?'<div><div style="font-size:11.5px;color:var(--ink-soft);">Discount</div><div class="mono" id="ordDiscVal" style="font-weight:600;color:var(--rust);">-'+money(discount,business.currency)+'</div></div>':'')+
      (tax>0?'<div><div style="font-size:11.5px;color:var(--ink-soft);">Tax</div><div class="mono" id="ordTaxVal" style="font-weight:600;">'+money(tax,business.currency)+'</div></div>':'')+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Total</div><div class="mono" id="ordTotalVal" style="font-weight:600;">'+money(total,business.currency)+'</div></div>'+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Paid</div><div class="mono" id="ordPaidVal" style="font-weight:600;color:var(--green);">'+money(paid,business.currency)+'</div></div>'+
      '<div><div style="font-size:11.5px;color:var(--ink-soft);">Balance</div><div class="mono" id="ordBalanceVal" style="font-weight:600;color:'+(bal>0?"var(--rust)":(bal<0?"var(--gold)":"var(--green)"))+';">'+money(bal,business.currency)+(bal<0?' ⚠️ OVERPAID':'')+' </div></div>'+
    '</div>'+
    (bal<0 ? '<div class="card" style="background:var(--gold-soft);border-color:var(--gold);margin-top:8px;padding:10px 12px;"><div style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--gold);">⚠️ Overpayment detected</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">Client has paid '+money(Math.abs(bal),business.currency)+' more than invoiced. Consider issuing a credit note or refunding the overpaid amount.</div></div>' : '');

  // Draft / Issued / Void banner — only meaningful for real orders that
  // already exist (a brand-new, unsaved order is implicitly a draft).
  const docStatusBannerHtml = (isQuote || state.modal.isNew) ? '' : (
    isVoidDoc ?
      '<div class="card" style="background:var(--rust-soft);border-color:var(--rust);margin-bottom:14px;padding:12px 14px;">'+
        '<div style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--rust);">'+icon("ban",15)+' Voided invoice'+(o.invoiceNo?' · '+esc(o.invoiceNo):'')+'</div>'+
        (o.voidedAt ? '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">Voided '+fmtDateTime(new Date(o.voidedAt))+'</div>' : '')+
        (o.voidReason ? '<div style="font-size:12.5px;margin-top:6px;">Reason: '+esc(o.voidReason)+'</div>' : '')+
      '</div>'
    : isIssued ?
      '<div class="card" style="background:var(--green-soft);border-color:var(--green);margin-bottom:14px;padding:12px 14px;">'+
        '<div style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--green);">'+icon("lock",15)+' Invoice issued'+(o.invoiceNo?' · '+esc(o.invoiceNo):'')+'</div>'+
        (o.issuedAt ? '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">Issued '+fmtDateTime(new Date(o.issuedAt))+' · client, items, pricing, discount and tax are locked</div>' : '')+
      '</div>'
    :
      '<div class="pill status-draft" style="margin-bottom:14px;display:inline-block;">'+icon("edit",11)+' Draft invoice — not yet issued</div>'
  );

  const clientFieldHtml = locked ?
    '<div><label>Client</label><div style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);">'+esc(client?client.name:"—")+'</div></div>'
    : '<div><label>Client</label><select data-bind="modal.draft.clientId" data-rerender="1">'+
        (clients.length===0 ? '<option value="">No clients yet</option>' : clients.map(c=>'<option value="'+c.id+'" '+(o.clientId===c.id?"selected":"")+'>'+esc(c.name)+'</option>').join(""))+
      '</select></div>';
  const titleFieldHtml = locked ?
    '<div><label>Order title</label><div style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);">'+esc(o.title||"—")+'</div></div>'
    : '<div><label>'+(isQuote?"Quote title":"Order title")+'</label><input data-bind="modal.draft.title" value="'+esc(o.title)+'" placeholder="Wedding aso-ebi, native wear..."></div>';
  const dueDateFieldHtml = locked ?
    '<div><label>Due date</label><div style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);">'+(o.dueDate?fmtDate(o.dueDate):"—")+'</div></div>'
    : '<div><label>'+(isQuote?"Valid until":"Due date")+'</label><input type="date" data-bind="modal.draft.dueDate" value="'+esc(o.dueDate)+'"></div>';

  const saveLabel = isQuote ? "Save" : (state.modal.isNew ? "Save as draft" : (locked ? "Save" : "Save changes"));

  // Card 1 — Details: who, what, when, and current status of the document.
  const detailsCardBody =
    docStatusBannerHtml+
    '<div class="grid-form2">'+
      clientFieldHtml+
      titleFieldHtml+
      dueDateFieldHtml+
      '<div><label>Status</label><select data-bind="modal.draft.status" data-rerender="1">'+
        statusesFor(kind).map(s=>'<option value="'+s.key+'" '+(o.status===s.key?"selected":"")+'>'+s.key+'</option>').join("")+
      '</select></div>'+
      (isQuote ? '' : extraRecordFieldsHtml)+
    '</div>'+
    (isQuote ? '' :
      '<div style="margin-top:14px;"><div class="tape-track '+(o.status==="Cancelled"?"cancelled":"")+'"><div class="fill" style="width:'+info.pct+'%;"></div></div>'+
      '<div class="tape-labels"><span>Pending</span><span>Cutting</span><span>Sewing</span><span>Fitting</span><span>Ready</span><span>Delivered</span></div></div>');

  // Card 2 — Items & pricing: what's being sold, plus any discount/tax.
  const itemsCardBody =
    itemsHtml+
    (locked ? '' :
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="btn ghost sm" data-action="add-order-item">'+icon("plus",14)+' Add item</button>'+
        '<button class="btn ghost sm" data-action="open-catalog-picker">'+icon("image",14)+' From catalogue</button>'+
      '</div>')+
    discountTaxHtml;

  // Card 3 — Totals & payments (or just the total, for a quote/estimate).
  const totalsCardBody =
    totalsCardHtml+
    (isQuote ? '' : (
      '<div style="margin-top:14px;">'+paymentsHtml+'</div>'+
      (isVoidDoc ? '' :
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
          '<input class="mono" type="number" placeholder="Amount received" data-bind="modal.payAmt" value="'+esc(state.modal.payAmt||"")+'" style="flex:1;min-width:140px;">'+
          '<select data-bind="modal.payMethod" style="max-width:140px;">'+
            ["Cash","Bank transfer","POS/Card","Other"].map(m=>'<option '+(state.modal.payMethod===m?"selected":"")+'>'+m+'</option>').join("")+
          '</select>'+
          '<button class="btn gold sm" data-action="add-payment">'+icon("plus",14)+' Add</button>'+
        '</div>')
    ));

  // Card 9 — Activity log (existing records only).
  const activityCardBody = (state.modal.isExisting && o.history && o.history.length) ?
    '<div style="display:flex;flex-direction:column;gap:6px;">'+
      o.history.slice().reverse().map(h=>
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);">'+
          '<span><span class="pill '+statusClass(h.status)+'" style="font-size:10.5px;padding:2px 8px;">'+esc(h.status)+'</span></span>'+
          '<span>'+fmtDateTime(new Date(h.at))+'</span>'+
        '</div>'
      ).join("")+
    '</div>'
    : '';

  return modalShell(state.modal.isNew?"New "+recLabel:"Edit "+recLabel,
    (state.modal.isNew ?
      '<div class="chipbar" style="margin-bottom:12px;">'+
        '<button class="btn '+(!isQuote?"gold":"ghost")+' sm" data-action="switch-draft-kind" data-kind="order">'+esc(nounFor("record"))+'</button>'+
        '<button class="btn '+(isQuote?"gold":"ghost")+' sm" data-action="switch-draft-kind" data-kind="quote">Quote / estimate</button>'+
      '</div>' : (isQuote ? '<div class="pill status-draft" style="margin-bottom:12px;display:inline-block;">Quote / estimate</div>' : '')
    )+
    sectionCard("edit", isQuote?"Quote details":"Order details", detailsCardBody)+
    sectionCard("scissors", "Items & pricing", itemsCardBody)+
    sectionCard("cash", isQuote?"Estimate total":"Totals & payments", totalsCardBody)+
    sectionCard("image", "Style reference", imagePickerHtml("Style chosen to be sewn", o.styleImages, "modal.draft.styleImages"))+
    sectionCard("card", isQuote?"Estimate sharing":"Invoice & receipts", invoiceSection)+
    sectionCard("ledger", "Credit & debit notes", creditDebitHtml)+
    sectionCard("refresh", "Recurring billing", recurringHtml)+
    sectionCard("edit", "Notes", '<textarea rows="2" placeholder="Optional" data-bind="modal.draft.notes">'+esc(o.notes)+'</textarea>')+
    sectionCard("calendar", "Activity", activityCardBody)+
    '<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:flex-end;">'+
      (state.modal.isExisting && (isQuote || !locked) ? '<button class="btn rust sm" data-action="delete-order">'+icon("trash",14)+' Delete</button>' : '')+
      (state.modal.isExisting && isIssued ? '<button class="btn rust sm" data-action="void-order">'+icon("ban",14)+' Void invoice</button>' : '')+
      (state.modal.isExisting ? '<button class="iconbtn" data-action="duplicate-order" title="Duplicate as new '+recLabel+'" aria-label="Duplicate as new '+recLabel+'">'+icon("plus",15)+'</button>' : '')+
      '<button class="btn ghost sm" data-action="close-modal">Cancel</button>'+
      (!isQuote && state.modal.isExisting && !locked ? '<button class="btn gold sm" '+(!o.clientId || total<=0?"disabled":"")+' data-action="issue-order">'+icon("lock",14)+' Issue invoice</button>' : '')+
      '<button class="btn sm" '+(!o.clientId?"disabled":"")+' data-action="save-order">'+icon("check",15)+' '+esc(saveLabel)+'</button>'+
    '</div>', true
  );
}

function renderCreditNoteModal(){
  const n = state.modal.draft;
  const order = findOrder(n.orderId);
  const client = order ? state.clients.find(c=>c.id===order.clientId) : null;
  const isDebit = n.type==="debit";
  const bal = order ? orderAdjustedBalance(order) : 0;
  return modalShell((isDebit?"Issue debit note":"Issue credit note"),
    '<div style="display:flex;flex-direction:column;gap:12px;">'+
      '<div style="font-size:12.5px;color:var(--ink-soft);">Against invoice <strong class="mono">'+esc(order&&order.invoiceNo||"—")+'</strong>'+(client?(' for '+esc(client.name)):'')+
        '<br>Current balance: <strong>'+money(bal, state.business.currency)+'</strong></div>'+
      '<div><label>Amount</label><input class="mono" type="number" data-bind="modal.draft.amount" value="'+esc(n.amount)+'" placeholder="0"></div>'+
      '<div><label>Date</label><input type="date" data-bind="modal.draft.date" value="'+esc(n.date)+'"></div>'+
      '<div><label>Reason</label><textarea rows="2" data-bind="modal.draft.reason" placeholder="'+(isDebit?"e.g. Additional charge, correction...":"e.g. Return, overcharge, discount agreed after invoicing...")+'">'+esc(n.reason||"")+'</textarea></div>'+
      '<div style="font-size:11.5px;color:var(--ink-soft);">Once issued, this '+(isDebit?"debit":"credit")+' note is final and can only be voided, not edited or deleted — standard bookkeeping practice.</div>'+

        '<button class="btn ghost sm" data-action="close-modal">Cancel</button>'+

function renderNotificationsModal(){
  const alerts = buildAlerts();
  const business = state.business;
  const kindPill = (k) => k==="payment" ?
    '<span class="pill" style="background:var(--rust-soft);color:var(--rust);">Payment</span>' :
    '<span class="pill" style="background:var(--gold-soft);color:#8A5F1F;">Delivery</span>';
  const section = (title, list, tone) => {
    if(list.length===0) return "";
    return '<div style="margin-bottom:18px;">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:'+tone+';margin-bottom:6px;">'+esc(title)+' ('+list.length+')</div>'+
      list.map(({o,bal,dleft,kinds,client}) => (
        '<div class="rowline" style="align-items:flex-start;gap:8px;">'+
          '<div style="cursor:pointer;flex:1;min-width:0;" data-action="open-order-modal" data-id="'+o.id+'">'+
            '<div style="font-weight:500;font-size:13.5px;">'+esc(client?client.name:"Unknown client")+' — '+esc(o.title||"Order")+'</div>'+
            '<div style="font-size:11.5px;color:'+(dleft<0?"var(--rust)":"var(--ink-soft)")+';margin-top:1px;">'+
              (dleft<0 ? Math.abs(dleft)+"d overdue" : dleft===0 ? "Due today" : "Due in "+dleft+"d")+
              (kinds.includes("payment") ? " · Balance "+money(bal,business.currency) : "")+
            '</div>'+
            '<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;">'+kinds.map(kindPill).join("")+'</div>'+
          '</div>'+
          (client ? '<button class="btn wa sm" data-action="share-reminder-image-dash" data-id="'+o.id+'" style="flex-shrink:0;">'+icon("send",13)+'</button>' : '')+
        '</div>'
      )).join("")+
    '</div>';
  };
  const body = alerts.total===0 ?
    '<div class="empty">All caught up — nothing due, overdue, or coming up in the next '+NEAR_DUE_DAYS+' days.</div>' :
    section("Overdue", alerts.overdue, "var(--rust)")+
    section("Due today", alerts.dueToday, "var(--gold)")+
    section("Due soon", alerts.nearDue, "var(--ink-soft)")+
    (alerts.renewals.length>0 ?
      '<div style="margin-bottom:18px;">'+
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);margin-bottom:6px;">Recurring renewals due ('+alerts.renewals.length+')</div>'+
        alerts.renewals.map(({o,dleft,client}) => (
          '<div class="rowline" style="align-items:flex-start;gap:8px;">'+
            '<div style="cursor:pointer;flex:1;min-width:0;" data-action="open-order-modal" data-id="'+o.id+'">'+
              '<div style="font-weight:500;font-size:13.5px;">'+esc(client?client.name:"Unknown client")+' — '+esc(o.title||"Order")+'</div>'+
              '<div style="font-size:11.5px;color:'+(dleft<0?"var(--rust)":"var(--ink-soft)")+';margin-top:1px;">'+
                (dleft<0 ? Math.abs(dleft)+"d overdue" : dleft===0 ? "Due today" : "Due in "+dleft+"d")+' · '+(o.recurring.frequency||"monthly")+
              '</div>'+
            '</div>'+

function renderGlobalSearchModal(){
  const q = (state.globalSearchQ||"").trim().toLowerCase();
  const business = state.business;
  let clientResults = [], orderResults = [], itemResults = [];
  if(q.length>=2){
    clientResults = state.clients.filter(c=> c.name.toLowerCase().includes(q) || (c.phone||"").includes(q)).slice(0,8);
    orderResults = state.orders.filter(o=>{
      const client = state.clients.find(c=>c.id===o.clientId);
      return (o.title||"").toLowerCase().includes(q) || (client && client.name.toLowerCase().includes(q)) || (o.notes||"").toLowerCase().includes(q);
    }).slice(0,8);
    itemResults = state.catalogue.items.filter(it=> it.name.toLowerCase().includes(q) || (it.description||"").toLowerCase().includes(q)).slice(0,8);
  }
  const resultGroup = (title, list, renderRow) => list.length===0 ? "" :
    '<div style="margin-bottom:16px;">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;">'+esc(title)+' ('+list.length+')</div>'+
      list.map(renderRow).join("")+
    '</div>';
  const body =
    '<div style="position:relative;margin-bottom:14px;">'+
      '<span style="position:absolute;left:10px;top:11px;color:var(--ink-soft);">'+icon("search",14)+'</span>'+
      '<input id="globalSearchInput" style="padding-left:30px;" placeholder="Search '+nounFor("clientPlural").toLowerCase()+', '+nounFor("recordPlural").toLowerCase()+', '+nounFor("catalogue").toLowerCase()+'..." data-action="global-search-input" value="'+esc(state.globalSearchQ||"")+'">'+
    '</div>'+
    '<div id="globalSearchResults">'+
    (q.length<2 ? '<div class="empty">Type at least 2 characters to search across everything.</div>' :
      (clientResults.length+orderResults.length+itemResults.length===0 ? '<div class="empty">No matches for "'+esc(state.globalSearchQ)+'".</div>' :
        resultGroup(nounFor("clientPlural"), clientResults, c=>
          '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-client" data-id="'+c.id+'">'+
            '<span>'+esc(c.name)+'</span><span style="font-size:12px;color:var(--ink-soft);">'+esc(c.phone||"")+'</span>'+
          '</div>'
        )+
        resultGroup(nounFor("recordPlural"), orderResults, o=>{
          const client = state.clients.find(c=>c.id===o.clientId);
          return '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-order" data-id="'+o.id+'">'+
            '<span>'+esc(client?client.name:"Unknown")+' — '+esc(o.title||"Order")+'</span><span class="pill '+statusClass(o.status)+'" style="font-size:10px;">'+o.status+'</span>'+
          '</div>';
        })+
        resultGroup(nounFor("catalogue"), itemResults, it=>
          '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-item" data-id="'+it.id+'">'+
            '<span>'+esc(it.name)+'</span><span class="mono" style="font-size:12px;">'+money(it.price,business.currency)+'</span>'+
          '</div>'
        )
      )
    )+
    '</div>';
  return modalShell("Search", body);
}

const VERTICAL_SLIDE_ACCENTS = {
  admin:"#2B2A28", tailoring:"#1E3A3A", restaurant:"#A2432B", salon:"#7A2E44",
  retail:"#8A5F1F", real_estate:"#233A5E", events:"#5B2E52", laundry:"#1F5C6B", others:"#33502E",
};
function verticalSlideImage(cfg){
  const c1 = VERTICAL_SLIDE_ACCENTS[cfg.id] || "#1E3A3A";
  const c2 = darken(c1, 0.4);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/>'+
    '</linearGradient></defs>'+
    '<rect width="400" height="500" fill="url(#g)"/>'+
    '<circle cx="335" cy="55" r="150" fill="rgba(255,255,255,0.06)"/>'+
    '<circle cx="30" cy="470" r="120" fill="rgba(255,255,255,0.05)"/>'+
    '<g transform="translate(112,168) scale(6.5)" stroke="rgba(255,255,255,0.32)" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[cfg.icon]||'')+'</g>'+
  '</svg>';
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

function openClientModal(existing){
  state.modal = { type:"client", isNew: !existing,

  pushNav();

async function pickContactPhone(){
  if(!(navigator.contacts && navigator.contacts.select)){
    showAlertDialog("Picking from contacts isn't supported on this browser/device. You can still type the number in manually.");
    return;
  }
  try{
    const picked = await navigator.contacts.select(["name","tel"], {multiple:false});
    if(!picked || !picked[0]) return;
    const contact = picked[0];
    const rawPhone = (contact.tel && contact.tel[0]) || "";
    const phone = rawPhone.replace(/[^0-9+]/g,"");
    if(phone && state.modal && state.modal.type==="client"){
      state.modal.draft.phone = phone;
      if(!state.modal.draft.name.trim() && contact.name && contact.name[0]){
        state.modal.draft.name = contact.name[0];
      }
      render();
    }
  }catch(e){ /* user cancelled the picker, or permission was denied */ }
}
function saveOrderDraft(){
  const o = state.modal.draft;
  if(!o.clientId) return null;
  o.items = o.items.filter(it => (it.desc && it.desc.trim()) || Number(it.price)>0);
  if(o.items.length===0) o.items = [{desc:"",price:0}];
  const existingOrder = state.orders.find(x=>x.id===o.id);
  const exists = !!existingOrder;
  if(!o.history) o.history = existingOrder && existingOrder.history ? existingOrder.history.slice() : [];
  if(!exists || !existingOrder || existingOrder.status !== o.status){
    o.history.push({status:o.status, at:new Date().toISOString()});
  }
  state.orders = exists ? state.orders.map(x=>x.id===o.id?o:x) : state.orders.concat([o]);
  persistOrders();
  return o;
}

function showToast(message, type){
  // Simple toast notification
  type = type || "info";
  const toastId = "toast-" + Date.now();
  const bgColor = type === "error" ? "var(--rust)" : type === "success" ? "var(--green)" : "var(--primary)";

async function shareCatalogueItem(id){
  const it = findCatItem(id);
  if(!it) return;
  const business = state.business;
  const cat = state.catalogue.categories.find(c=>c.id===it.categoryId);
  
  // Create preview HTML with full original image (no cropping)
  const heroImg = it.images?.[0];
  const sharePreview = document.createElement("div");
  sharePreview.style.cssText = "width:360px;background:#FBF9F3;padding:20px;font-family:Work Sans,sans-serif;color:#26221B;box-sizing:border-box;";
  sharePreview.innerHTML = 
    (heroImg ? '<img src="'+heroImg+'" style="width:100%;height:auto;max-height:600px;object-fit:contain;border-radius:12px;display:block;margin-bottom:14px;">' : '') +
    (cat ? '<div style="font-size:11.5px;color:#645E50;margin-bottom:4px;">'+esc(cat.name)+'</div>' : '') +
    '<div style="font-family:IBM Plex Mono,monospace;font-weight:700;font-size:24px;margin-bottom:8px;">'+money(it.price,business.currency)+'</div>'+
    '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">'+esc(it.name)+'</div>'+
    (it.description ? '<div style="font-size:13px;color:#645E50;margin-bottom:14px;white-space:pre-wrap;">'+esc(it.description)+'</div>' : '')+
    (business.name ? '<div style="font-size:12px;color:#645E50;border-top:1px solid #D6CDB6;padding-top:10px;">'+esc(business.name)+'</div>' : '');
  
  document.body.appendChild(sharePreview);
  
  try{
    const canvas = await html2canvas(sharePreview, {useCORS: true, scale: 8, backgroundColor: '#FBF9F3'});
    document.body.removeChild(sharePreview);
    
    canvas.toBlob(async (blob) => {
      const file = new File([blob], (it.name||"item").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".jpg", {type: "image/jpeg"});
      
      if(navigator.share){
        try{
          if(!navigator.canShare || navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title: it.name});
            return;
          }
        }catch(e){ /* fall through */ }
      }
      
      // Fallback: share text with WhatsApp link
      const text = "*"+it.name+"*\n"+(it.description?it.description+"\n":"")+money(it.price,business.currency)+(business.name?"\n\n"+business.name:"");
      window.open(waLink("", text), "_blank", "noreferrer");
    }, "image/jpeg", 0.9);
  }catch(e){
    document.body.removeChild(sharePreview);
    // Fallback: share text with WhatsApp link
    const text = "*"+it.name+"*\n"+(it.description?it.description+"\n":"")+money(it.price,business.currency)+(business.name?"\n\n"+business.name:"");
    window.open(waLink("", text), "_blank", "noreferrer");
  }
}

let tourResizeBound = false;
function startTour(){
  if(!state.authed || state.showWelcome) return;
  collapseNav(navDepth);
  state.modal = null; state.selectedClientId = null; state.lightbox = null; state.tab = "dashboard";
  markTourSeen();
  state.tour = { step: 0, steps: getTourSteps() };
  goToTourStep(0);
  if(!tourResizeBound){
    tourResizeBound = true;
    window.addEventListener("resize", () => { if(state.tour) renderTourOverlay(); });
  }
}
function goToTourStep(i){
  if(!state.tour) return;
  if(i < 0){ return; }
  if(i >= state.tour.steps.length){ endTour(); return; }
  state.tour.step = i;
  const step = state.tour.steps[i];
  if(step.tab && state.tab !== step.tab){
    const wasHome = state.tab === "dashboard";
    state.tab = step.tab; state.selectedClientId = null;
    if(wasHome && step.tab !== "dashboard") pushNav();
    else if(!wasHome && step.tab === "dashboard") collapseNav(1);
  }
  if(step.tab === "account") state.accountView = step.view || "account";
  render();
}
function nextTour(){ if(state.tour) goToTourStep(state.tour.step + 1); }
function prevTour(){ if(state.tour) goToTourStep(state.tour.step - 1); }
function endTour(){
  state.tour = null;
  const ov = document.getElementById("tourOverlay");
  if(ov) ov.remove();
  render();
}
function renderTourOverlay(){
  let overlay = document.getElementById("tourOverlay");
  if(!state.tour){ if(overlay) overlay.remove(); return; }
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "tourOverlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => {
      const el = e.target.closest("[data-tour-action]");
      if(!el) return;
      const act = el.getAttribute("data-tour-action");
      if(act === "next") nextTour();
      else if(act === "prev") prevTour();
      else if(act === "skip" || act === "finish") endTour();
    });
  }
  const idx = state.tour.step;
  const step = state.tour.steps[idx];
  let target = null;
  if(step && step.getTarget){ try{ target = step.getTarget(); }catch(e){ target = null; } }
  if(target && target.scrollIntoView) target.scrollIntoView({block:"center", behavior:"auto"});
  requestAnimationFrame(() => { paintTourOverlay(overlay, step, target, idx, state.tour.steps.length); });
}
function paintTourOverlay(overlay, step, target, idx, total){
  if(!state.tour) return;
  const rect = target ? target.getBoundingClientRect() : null;
  const pad = 6;
  const dots = state.tour.steps.map((_,i)=>'<span class="tour-dot '+(i===idx?"active":"")+'"></span>').join("");
  const isFirst = idx === 0, isLast = idx === total - 1;
  const panelClass = rect ? "tour-panel" : "tour-panel centered";
  const panelHtml =
    '<div class="'+panelClass+'">'+
      '<div class="tour-eyebrow"><span class="tour-step-label">Step '+(idx+1)+' of '+total+'</span>'+
        (isLast ? '' : '<button class="tour-skip" data-tour-action="skip">Skip tour</button>')+
      '</div>'+
      '<div class="tour-title">'+esc(step.title)+'</div>'+
      '<div class="tour-body">'+esc(step.body)+'</div>'+
      '<div class="tour-actions">'+
        (isFirst ? '<span></span>' : '<button class="btn ghost sm" data-tour-action="prev">'+icon("back",13)+' Back</button>')+
        '<div class="tour-dots">'+dots+'</div>'+
        (isLast ?
          '<button class="btn gold sm" data-tour-action="finish">'+icon("check",13)+' Done</button>' :
          '<button class="btn gold sm" data-tour-action="next">Next '+icon("forward",13)+'</button>')+
      '</div>'+
    '</div>';
  overlay.innerHTML =
    '<div class="tour-backdrop '+(rect ? "" : "dim")+'"></div>'+
    (rect ?
      '<div class="tour-spot" style="top:'+(rect.top-pad)+'px;left:'+(rect.left-pad)+'px;width:'+(rect.width+pad*2)+'px;height:'+(rect.height+pad*2)+'px;"></div>'
      : '')+
    panelHtml;
}

document.addEventListener("click", (e) => {
  const stop = e.target.closest('[data-stop]');
  const backdrop = e.target.closest('[data-action="modal-backdrop"], [data-action="confirm-backdrop"], [data-action="alert-backdrop"]');
  if(backdrop && !stop && e.target === backdrop){
    const bact = backdrop.getAttribute("data-action");
    if(bact === "modal-backdrop") closeModal();
    else if(bact === "confirm-backdrop"){ state.confirmDialog = null; render(); }
    else if(bact === "alert-backdrop"){ state.alertDialog = null; render(); }
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  if(state.viewOnly && MUTATING_ACTIONS.has(action)){
    showViewOnlyToast();
    return;
  }

  switch(action){
    case "confirm-yes": { const cb = state.confirmDialog && state.confirmDialog.onConfirm; const reason = state.confirmReasonText||""; state.confirmDialog = null; state.confirmReasonText=""; if(cb) cb(reason); else render(); break; }
    case "confirm-cancel": state.confirmDialog = null; render(); break;
    case "alert-ok": state.alertDialog = null; render(); break;
    case "start-tour": startTour(); break;
    case "dismiss-tour-banner": markTourSeen(); render(); break;
    case "set-tab": {
      const newTab = el.getAttribute("data-tab");
      const wasHome = state.tab === "dashboard";
      state.tab = newTab; state.selectedClientId = null;
      if(wasHome && newTab !== "dashboard") pushNav();
      else if(!wasHome && newTab === "dashboard") collapseNav(1);
      render();
      break;
    }
    case "set-account-view": state.accountView = el.getAttribute("data-view"); render(); break;
    case "select-client": state.selectedClientId = id; pushNav(); render(); break;
    case "back-to-clients": state.selectedClientId = null; collapseNav(1); render(); break;
    case "delete-client": askConfirm({ title:"Delete this client?", body:"This cannot be undone.", confirmLabel:"Delete", danger:true, onConfirm: () => { state.clients = state.clients.filter(c=>c.id!==id); if(state.selectedClientId===id){ state.selectedClientId=null; collapseNav(1); } persistClients(); render(); } }); break;
    case "open-client-modal-new": openClientModal(null); break;
    case "open-client-modal": openClientModal(findClient(id)); break;
    case "pick-contact-phone": pickContactPhone(); break;
    case "save-client": {
      const c = state.modal.draft;
      if(!c.name.trim()) return;
      const exists = state.clients.some(x=>x.id===c.id);
      state.clients = exists ? state.clients.map(x=>x.id===c.id?c:x) : state.clients.concat([c]);
      persistClients();
      if(state.selectedClientId===c.id) {} // detail will re-render from state.clients
      closeModal();
      break;
    }
    case "open-order-modal-new": openOrderModal(null, null, el.getAttribute("data-kind")); break;
    case "open-order-modal-new-for-client": openOrderModal(null, id); break;
    case "open-order-modal": openOrderModal(findOrder(id)); break;
    case "open-notifications": state.modal = { type:"notifications" }; pushNav(); render(); break;
    case "open-catalogue-manager": state.modal = { type:"catalogue-manager" }; pushNav(); render(); break;
    case "open-invoice-help-modal": state.modal = { type:"invoice-help" }; pushNav(); render(); break;
    case "open-policy-modal": state.modal = { type:"policy" }; pushNav(); render(); break;
    case "open-global-search": state.modal = { type:"global-search" }; state.globalSearchQ = ""; pushNav(); render();
      setTimeout(()=>{ const el = document.getElementById("globalSearchInput"); if(el) el.focus(); }, 30);
      break;
    case "global-search-goto-client": closeModal(); state.tab = "clients"; state.selectedClientId = id; render(); break;
    case "global-search-goto-order": closeModal(); openOrderModal(findOrder(id)); break;
    case "global-search-goto-item": closeModal(); state.tab = "catalogue"; openCatItemView(id); break;
    case "copy-text": {
      const value = el.getAttribute("data-value")||"";
      const restoreHtml = el.innerHTML;
      const flash = (ok) => {

function csvEscape(v){
  const s = (v===null||v===undefined) ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportClientsCsv(){
  const rows = [["Name","Phone","Address","Gender","Notes","Total spent","Orders"]];
  state.clients.forEach(c=>{
    const clientOrders = state.orders.filter(o=>o.clientId===c.id && isRealOrder(o));
    const total = clientOrders.reduce((s,o)=>s+orderTotal(o),0);
    rows.push([c.name, c.phone||"", c.address||"", c.gender||"", c.notes||"", total, clientOrders.length]);
  });
  downloadCsv("bizdeck-"+nounFor("clientPlural").toLowerCase()+"-"+todayISO()+".csv", rows);
}

// Consolidated export: Creates single JSON file with everything (account + data + settings)
async function exportEverything(){
  if(!state.account || !state.auth) {
    showToast("No account credentials to export", "error");
    return;
  }
  
  try {
    // Create comprehensive backup with credentials
    const backup = Object.assign(buildBackupPayload(), {
      license: createLicense(),
      accountName: state.account.name
    });
    
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "bizdeck-account-"+state.account.email+"-"+stamp+".bizdeck";
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast("Complete account backup exported with credentials", "success");
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e) {
    console.error("Export error:", e);
    showToast("Export failed: " + e.message, "error");
  }
}
function exportOrdersCsv(){
  const rows = [["Client","Title","Status","Total","Paid","Balance","Due date","Created"]];
  state.orders.filter(isRealOrder).forEach(o=>{
    const client = state.clients.find(c=>c.id===o.clientId);
    const total = orderTotal(o), paid = orderPaid(o);
    rows.push([client?client.name:"Unknown", o.title||"", o.status, total, paid, total-paid, o.dueDate||"", o.createdAt||""]);
  });
  downloadCsv("bizdeck-"+nounFor("recordPlural").toLowerCase()+"-"+todayISO()+".csv", rows);
}
function exportStockCsv(){
  const items = (state.inventory && state.inventory.items) || [];
  const rows = [["Name","SKU","Unit","Qty on hand","Reorder level","Cost price","Sell price","Notes"]];
  items.forEach(it=>{
    rows.push([it.name||"", it.sku||"", it.unit||"", it.qtyOnHand||0, it.reorderLevel||0, it.costPrice||0, it.sellPrice||0, it.notes||""]);
  });
  downloadCsv("bizdeck-stock-"+todayISO()+".csv", rows);
}
function exportExpensesCsv(){
  const rows = [["Date","Category","Vendor","Amount","Method","Note"]];
  state.expenses.forEach(e=>{
    const vendor = state.vendors.find(v=>v.id===e.vendorId);
    rows.push([e.date||"", e.category||"", vendor?vendor.name:"", e.amount||0, e.method||"", e.note||""]);
  });
  downloadCsv("bizdeck-books-expenses-"+todayISO()+".csv", rows);
}
// Shared shape for every backup we produce (download, share sheet, cloud
// folder, or the credentialed account export below).
function buildBackupPayload(){
  syncActiveBusinessEntry();
  return {
    app: "BizDeck", version: 1, exportedAt: new Date().toISOString(),
    businesses: state.businesses, activeBusinessId: state.activeBusinessId,
    clients: state.clients, orders: state.orders, catalogue: state.catalogue, inventory: state.inventory, vendors: state.vendors, expenses: state.expenses, creditNotes: state.creditNotes,
    business: state.business, theme: state.theme || "indigo", darkMode: state.darkMode||false, customThemeColors: state.customThemeColors||null,
    businessCategory: state.businessCategory || null, universalAccess: !!state.universalAccess,
  };
}

function shareBackupFile(){
  const backup = buildBackupPayload();
  const stamp = new Date().toISOString().slice(0,10);
  const file = new File([JSON.stringify(backup, null, 2)], "bizdeck-backup-"+stamp+".json", {type:"text/plain"});
  if(!navigator.share || (navigator.canShare && !navigator.canShare({files:[file]}))){
    exportBackup();
    showToast("Sharing isn't available here — downloaded the backup instead", "info");
    return;
  }
  navigator.share({ files:[file], title:"BizDeck backup" }).catch((e)=>{
    if(e && e.name==="AbortError") return;
    exportBackup();
  });
}

function exportBackup(){
  const backup = buildBackupPayload();
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = "bizdeck-backup-"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function downloadCredentialFile(baseName, _value, contents){
  const blob = new Blob([contents], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = baseName+"-"+(state.account.email||"account")+"-"+stamp+".txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Builds the shareable business card as a standalone, flat-edged HTML
// string (never the on-screen rounded preview) so exported/shared images
// always have plain, square corners — no transparent rounded-corner
// artifacts when dropped into WhatsApp, Messages, etc. Embeds the account
// QR code (if one has been generated) so the shared card doubles as a
// scannable contact card.
function buildBusinessCardHtml(b, qrDataUrl){
  const primary = themeColor("primary"), primaryDark = themeColor("primary-dark");
  const initials = businessInitials(b.name);
  const email = (b.email || (state.account && state.account.email) || "").trim();
  const logoBlock = b.logo
    ? '<img src="'+b.logo+'" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;">'
    : '<div style="width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,0.18);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:600;font-size:20px;flex-shrink:0;">'+esc(initials)+'</div>';
  return '<div style="width:480px;padding:28px;background:linear-gradient(135deg, '+primary+' 0%, '+primaryDark+' 100%);color:#fff;font-family:Georgia,serif;box-sizing:border-box;">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">'+
      '<div style="display:flex;align-items:center;gap:14px;min-width:0;flex:1;">'+
        logoBlock+
        '<div style="min-width:0;">'+
          '<div style="font-weight:600;font-size:19px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(b.name||"Your Business")+'</div>'+
          (b.regNumber ? '<div style="font-size:11px;opacity:.75;margin-top:2px;">'+esc(b.regNumber)+'</div>' : '')+
        '</div>'+
      '</div>'+
      (qrDataUrl ? '<div style="background:#fff;padding:6px;border-radius:8px;flex-shrink:0;line-height:0;"><img src="'+qrDataUrl+'" style="width:76px;height:76px;display:block;"></div>' : '')+
    '</div>'+
    '<div style="height:1px;background:rgba(255,255,255,0.25);margin:18px 0;"></div>'+
    '<div style="font-size:13px;line-height:1.7;opacity:.95;">'+

/* ================= CLOUD FOLDER BACKUP =================
   Uses the File System Access API to let the person point BizDeck at a real
   folder on their device — typically the local sync folder for Google
   Drive, OneDrive, Dropbox, or iCloud Drive. BizDeck writes backup files
   straight into it; the cloud provider's own sync client takes care of
   uploading them. No account, API key, or server is involved.
   The directory handle can't be stored in localStorage (it isn't plain
   JSON), so it lives in IndexedDB; only small status fields live in
   state.cloudBackup / localStorage. */
const CLOUD_DB_NAME = "bizdeck-fs", CLOUD_DB_STORE = "handles", CLOUD_BACKUP_KEEP = 20;
function supportsFSAccess(){ return typeof window !== "undefined" && "showDirectoryPicker" in window; }
function openCloudDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CLOUD_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(CLOUD_DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openCloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, "readwrite");
    tx.objectStore(CLOUD_DB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await openCloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, "readonly");
    const req = tx.objectStore(CLOUD_DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  const db = await openCloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, "readwrite");
    tx.objectStore(CLOUD_DB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

// Deletes older automatic snapshots so the folder doesn't fill up over time.
// "bizdeck-backup-latest.json" is always overwritten in place and never counted.
// Writes text to a file inside a directory handle, retrying briefly on
// failure before giving up. Cloud-sync clients (Google Drive for Desktop,
// OneDrive, etc.) commonly hold a brief lock on a file right after it's
// created while they start syncing it — createWritable()/write()/close()
// can fail during that window even though getFileHandle() already created
// the (empty) file, which is exactly what leaves a 0-byte file sitting in
// the folder. A short retry clears most of these transient failures; if it
// still fails after retrying, the empty/partial file is removed so it
// doesn't linger looking like a corrupt backup, and the original error is
// thrown so the caller can report it.
async function writeFileToDirectory(dirHandle, filename, contents){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{
      const fh = await dirHandle.getFileHandle(filename, { create:true });
      const w = await fh.createWritable();
      await w.write(contents);
      await w.close();
      return;
    }catch(err){
      lastErr = err;
      if(attempt < 2) await new Promise(r => setTimeout(r, 450 * (attempt+1)));
    }
  }
  try{ await dirHandle.removeEntry(filename); }catch(e){}
  throw lastErr;
}

async function pruneCloudBackups(handle){
  try{
    const names = [];
    for await (const [name, entryHandle] of handle.entries()){
      if(entryHandle.kind === "file" && /^bizdeck-backup-\d.*\.json$/.test(name)) names.push(name);
    }
    names.sort(); // timestamped filenames sort chronologically
    const excess = names.length - CLOUD_BACKUP_KEEP;
    if(excess > 0){
      for(const name of names.slice(0, excess)){
        try{ await handle.removeEntry(name); }catch(e){}
      }
    }
  }catch(e){ /* directory iteration isn't supported everywhere; safe to skip */ }
}

// silent=true is used for background/automatic runs: it never prompts for
// permission and never shows an error toast, it just quietly skips.
async function backupToCloudFolder(silent){
  if(!supportsFSAccess() || !state.cloudBackup.connected) return false;
  let handle;
  try{ handle = await idbGet("cloudFolderHandle"); }catch(e){ handle = null; }
  if(!handle){
    state.cloudBackup.connected = false; persistCloudBackup(); render();
    if(!silent) showToast("Cloud folder is no longer connected. Please reconnect.", "error");
    return false;
  }
  try{
    // Silent/background runs must never prompt, so they only ever peek at
    // the current permission state. Explicit "Backup now" clicks go
    // straight to requestPermission() right after the one unavoidable
    // idbGet() above — NOT after an extra queryPermission() round-trip —
    // because every awaited call between the click and requestPermission()
    // risks consuming the click's transient user-activation. Once that
    // activation is gone the browser resolves requestPermission() as if it
    // were denied instead of showing the prompt, which is what made
    // folders "connect" successfully but then silently fail to write on
    // every backup after that.
    let perm;
    if(silent){
      perm = await handle.queryPermission({ mode:"readwrite" });
      if(perm !== "granted") return false;
    } else {
      perm = await handle.requestPermission({ mode:"readwrite" });
      if(perm !== "granted"){ showToast("Permission needed to write to the cloud folder.", "error"); return false; }
    }
    const payload = buildBackupPayload();
    const json = JSON.stringify(payload, null, 2);
    const stamp = new Date().toISOString().replace(/[:.]/g,"-");

    await writeFileToDirectory(handle, "bizdeck-backup-"+stamp+".json", json);

    // Also keep one fixed, always-current copy for easy restoring.
    await writeFileToDirectory(handle, "bizdeck-backup-latest.json", json);

    await pruneCloudBackups(handle);

    state.cloudBackup.lastBackupAt = new Date().toISOString();
    state.cloudBackup.permissionGranted = true;
    persistCloudBackup();
    if(!silent) showToast('Backup saved to "'+state.cloudBackup.folderName+'" ✓', "success");
    render();
    return true;
  }catch(err){
    console.error("Cloud folder write error:", err);
    if(!silent) showToast("Couldn't write to that folder ("+(err && err.message ? err.message : "unknown error")+") — your cloud app (Drive/OneDrive/etc.) may be syncing or locking it right now. Wait a moment and tap Backup now again.", "error");
    return false;
  }
}
