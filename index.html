  useEffect(() => {
    if (!currentUser || isReadOnly) return;
    const thisMonth = todayISO().slice(0, 7);
    const groups = {};
    receipts.forEach((r) => {
      if (!r.recurring || r.voided) return;
      const key = r.recurringId || r.id;
      (groups[key] = groups[key] || []).push(r);
    });
    const fromData = receipts.map((r) => Number((r.receiptNo || '').replace(/\D/g, '')) || 0);
    let counter = Math.max(settings.receiptCounter || 2000, fromData.length ? Math.max(...fromData) : 2000);
    const additions = [];
    Object.values(groups).forEach((entries) => {
      const latest = entries.slice().sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      if (latest.date.slice(0, 7) === thisMonth) return; // already generated this month
      const originalDay = new Date(latest.date).getDate();
      const [yy, mm] = thisMonth.split('-').map(Number);
      const daysInMonth = new Date(yy, mm, 0).getDate();
      const day = Math.min(originalDay, daysInMonth);
      counter += 1;
      additions.push({
        id: uid(), receiptNo: `RCT-${counter}`, invoiceId: latest.invoiceId || null,
        clientId: latest.clientId || null, clientName: latest.clientName || '',
        items: (latest.items || []).map((it) => ({ ...it, id: uid() })),
        amount: latest.amount, date: `${thisMonth}-${String(day).padStart(2, '0')}`,
        note: latest.note || '', discountPercent: latest.discountPercent || 0, vatPercent: latest.vatPercent || 0,
        status: 'draft', recurring: true, recurringId: latest.recurringId || latest.id,
      });
    });
    if (additions.length) {
      setReceipts((prev) => [...additions, ...prev]);
      setSettings((s) => ({ ...s, receiptCounter: counter }));
      flash(`${additions.length} recurring receipt${additions.length === 1 ? '' : 's'} drafted for this month — review and issue when ready.`);
    }
  }, [currentUser]);

  const fmt = (n) => settings.currencySymbol + Math.round(Number(n || 0)).toLocaleString('en-NG');
  const toastTimerRef = useRef(null);
  const [toastUndo, setToastUndo] = useState(null);
  // flash(msg) behaves as before. flash(msg, undoFn) additionally shows an Undo button
  // in the toast for a few seconds — used after deletes so a slip of the finger (or a
  // reconsidered decision) isn't permanent, without needing a separate confirmation step.
  const flash = (msg, undoFn) => {
    setToast(msg);
    setToastUndo(() => undoFn || null);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => { setToast(''); setToastUndo(null); }, undoFn ? 6000 : 3200);
  };
  // In-app replacement for window.confirm; onConfirm runs only if confirmed.
  // opts.requireText: if set, the person must type this exact text before the confirm button unlocks.
  const askConfirm = (message, onConfirm, opts) => {
    setConfirmDialog({ message, onConfirm, confirmLabel: (opts && opts.confirmLabel) || 'Delete', danger: !opts || opts.danger !== false, requireText: (opts && opts.requireText) || null });
  };
  const digitsOnly = (s) => (s || '').replace(/\D/g, '');
  const waHref = (phone, text) => {
    const digits = digitsOnly(phone);
    let number = '';
    if (digits) {
      if (digits.startsWith(settings.countryCode)) number = digits;
      else if (digits.startsWith('0')) number = settings.countryCode + digits.slice(1);
      else number = settings.countryCode + digits;
    }
    return `https://wa.me/${number}?text=${encodeURIComponent(text)}`;
  };
  const shareToWhatsApp = (phone, text) => window.open(waHref(phone, text), '_blank');
  const shareImageToWhatsApp = (phone, text, filename) => {
    flash('Preparing image to share…');
    shareNodeImageToWhatsApp('receipt-print-area', filename, waHref(phone, text));
  };

  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const modalInitialRef = useRef({});
  const openModal = (type, initial = {}) => { setModal(type); setForm(initial); modalInitialRef.current = initial; };
  // Used right after a successful save; no need to ask.
  const closeModalSilently = () => { setModal(null); setForm({}); };
  // Used on manual dismiss; warns about losing unsaved input.
  const closeModal = () => {
    const isDirty = modal && JSON.stringify(form) !== JSON.stringify(modalInitialRef.current);
    if (isDirty) { askConfirm('Discard unsaved changes?', closeModalSilently, { confirmLabel: 'Discard' }); return; }
    closeModalSilently();
  };
  const setField = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  // Memoized so typing in unrelated plan-modal fields (name, amount) doesn't force a full
  // re-render of this list on every keystroke — it only recomputes when the actual inputs
  // that affect it (the member roster, ticked members, per-member amounts) change.
  const planMemberRows = useMemo(() => members.map((m) => {
    const checked = (form.memberIds || []).includes(m.id);
    return (
      <label key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <input type="checkbox" checked={checked}
          onChange={(e) => {
            const ids = form.memberIds || [];
            setField('memberIds', e.target.checked ? [...ids, m.id] : ids.filter((id) => id !== m.id));
          }} />
        <span style={{ flex: 1 }}>{m.name}</span>
        {form.perMemberAmounts && checked && (
          <input type="number" min="0" inputMode="decimal" className="kb-input kb-mono" style={{ width: 90 }}
            placeholder={form.amount || '0'}
            value={(form.memberAmounts || {})[m.id] || ''}
            onClick={(e) => e.stopPropagation()}
            onChange={(e) => setField('memberAmounts', { ...(form.memberAmounts || {}), [m.id]: e.target.value })} />
        )}
      </label>
    );
  }), [members, form.memberIds, form.perMemberAmounts, form.memberAmounts]);

  /* ---------- back button / swipe-back navigation ---------- */
  const closeAllOverlays = () => { closeModal(); setInvoiceDoc(null); setReceipt(null); setPaymentReceiptDoc(null); setReminderDoc(null); setReminderQueue([]); setCreditNoteDoc(null); };
  const historyInitedRef = useRef(false);
  const isRestoringRef = useRef(false);
  const exitArmedRef = useRef(false);
  const exitTimerRef = useRef(null);
  const pageSnapshot = (mod, tab, planId) => ({ kb: true, module: mod, tab, planId: planId || null });

  // One-time "Welcome" history entry so the first back-press has somewhere to land.
  useEffect(() => {
    if (currentUser && !historyInitedRef.current) {
      historyInitedRef.current = true;
      window.history.replaceState(pageSnapshot('home', 'home', null), '');
    }
    if (!currentUser) historyInitedRef.current = false;
  }, [currentUser]);

  // Push a history entry per page-level move, for back/swipe-back.
  useEffect(() => {
    if (!currentUser || !historyInitedRef.current) return;
    if (isRestoringRef.current) { isRestoringRef.current = false; return; }
    window.history.pushState(pageSnapshot(activeModule, activeTab, selectedPlanId), '');
  }, [activeModule, activeTab, selectedPlanId]);

  // Handle hardware/gesture back and browser back navigation.
  useEffect(() => {
    const handlePopState = (e) => {
      if (!currentUser) return;
      const overlayOpen = !!(modal || invoiceDoc || receipt || paymentReceiptDoc);
      if (overlayOpen) {
        // Back closes whatever's open first, without leaving the page.
        closeAllOverlays();
        window.history.pushState(pageSnapshot(activeModule, activeTab, selectedPlanId), '');
        return;
      }
      const atHome = activeModule === 'home' && activeTab === 'home';
      if (atHome) {
        if (exitArmedRef.current) return; // second press in a row: let it actually exit
        exitArmedRef.current = true;
        flash('Press back again to exit.');
        window.history.pushState(pageSnapshot('home', 'home', null), '');
        clearTimeout(exitTimerRef.current);
        exitTimerRef.current = setTimeout(() => { exitArmedRef.current = false; }, 2200);
        return;
      }
      const s = e.state;
      isRestoringRef.current = true;
      if (s && s.kb) {
        setActiveModule(s.module);
        setActiveTab(s.tab);
        setSelectedPlanId(s.planId || null);
      } else {
        setActiveModule('home'); setActiveTab('home'); setSelectedPlanId(null);
      }
    };
    window.addEventListener('popstate', handlePopState);
    return () => window.removeEventListener('popstate', handlePopState);
  }, [currentUser, modal, invoiceDoc, receipt, paymentReceiptDoc, activeModule, activeTab, selectedPlanId]);

  /* ---------- lookups ---------- */
  const memberById = (id) => members.find((m) => m.id === id);
  const planById = (id) => plans.find((p) => p.id === id);
  const clientById = (id) => clients.find((c) => c.id === id);
  const invoiceById = (id) => invoices.find((i) => i.id === id);
  // Credit notes reduce what's actually owed on an invoice without ever editing the
  // original billed amount — the invoice stays a fixed record, the adjustment is separate.
  const invoiceCreditTotal = (invoiceId) => creditNotes.filter((cn) => cn.invoiceId === invoiceId && !cn.voided).reduce((s, cn) => s + Number(cn.amount || 0), 0);
  const invoiceNetTotal = (inv) => Math.max(0, invoiceTotal(inv) - invoiceCreditTotal(inv.id));
  const findContribution = (planId, memberId, period) =>
    contributions.find((c) => c.planId === planId && c.memberId === memberId && c.period === period);
  const cycleCurrentPeriod = (plan) => { const periods = periodsForPlan(plan); return periods[periods.length - 1]; };
  const cyclePendingContributors = (plan) => {
    const period = cycleCurrentPeriod(plan);
    return plan.memberIds.filter((memberId) => !findContribution(plan.id, memberId, period));
  };

  const toggleContribution = (planId, memberId, period, amount, date) => {
    if (guardWrite()) return;
    const existing = findContribution(planId, memberId, period);
    const who = memberById(memberId)?.name || 'a contributor';
    if (existing) {
      setContributions((prev) => prev.filter((c) => c.id !== existing.id), `Unmarked payment — ${who} (${fmt(existing.amount)})`);
    } else {
      setContributions((prev) => [...prev, { id: uid(), planId, memberId, period, amount, date: date || todayISO() }], `Marked payment — ${who} (${fmt(amount)})`);
    }
  };
  // Requires two taps on the same grid cell (within 2s) before an edit actually fires —
  // guards against accidental taps while scrolling/swiping on a touch screen. First tap
  // just "arms" the cell (visual highlight); the second tap runs the real action.
  const handleCellTap = (cellKey, action) => {
    if (armedCell === cellKey) {
      clearTimeout(armedCellTimerRef.current);
      setArmedCell(null);
      action();
      return;
    }
    // First time ever a cell gets armed, surface a quick explanation — the pulsing highlight
    // alone isn't an obvious enough signal that a second tap is needed, especially for a
    // first-time / touch-screen user who taps once and sees nothing seem to "commit."
    try {
      if (!window.localStorage.getItem(CELL_TAP_HINT_SEEN_KEY)) {
        flash('Tap again to confirm — it clears itself after a couple of seconds.');
        window.localStorage.setItem(CELL_TAP_HINT_SEEN_KEY, '1');
      }
    } catch (err) {}
    setArmedCell(cellKey);
    clearTimeout(armedCellTimerRef.current);
    armedCellTimerRef.current = setTimeout(() => setArmedCell(null), 2000);
  };

  const planTotal = (planId) => contributions.filter((c) => c.planId === planId).reduce((s, c) => s + c.amount, 0);
  const memberTotal = (memberId) => contributions.filter((c) => c.memberId === memberId).reduce((s, c) => s + c.amount, 0);
  // Take-outs: a member drawing down their own accumulated savings — separate from a member loan,
  // which is money lent out of the pool and expected to be repaid.
  const planMemberContributed = (planId, memberId) => contributions.filter((c) => c.planId === planId && c.memberId === memberId).reduce((s, c) => s + c.amount, 0);
  const planWithdrawnTotal = (planId) => (planById(planId)?.withdrawals || []).reduce((s, w) => s + w.amount, 0);
  const planMemberWithdrawn = (planId, memberId) => (planById(planId)?.withdrawals || []).filter((w) => w.memberId === memberId).reduce((s, w) => s + w.amount, 0);
  const planMemberBalance = (planId, memberId) => planMemberContributed(planId, memberId) - planMemberWithdrawn(planId, memberId);
  const memberWithdrawnTotal = (memberId) => plans.reduce((s, p) => s + (p.withdrawals || []).filter((w) => w.memberId === memberId).reduce((s2, w) => s2 + w.amount, 0), 0);
  const memberBalance = (memberId) => memberTotal(memberId) - memberWithdrawnTotal(memberId);
  const memberConsistency = (memberId) => {
    const relevantPlans = plans.filter((p) => p.memberIds.includes(memberId));
    let due = 0, paid = 0;
    relevantPlans.forEach((p) => {
      const periods = periodsForPlan(p).slice(0, -1);
      due += periods.length;
      periods.forEach((period) => { if (findContribution(p.id, memberId, period)) paid += 1; });
    });
    return due > 0 ? Math.round((paid / due) * 100) : 100;
  };

  /* ---------- alerts ---------- */
  const rawAlerts = useMemo(() => {
    const list = [];
    loansGiven.forEach((l) => {
      const status = loanStatus(l, 'repayments');
      if (status === 'overdue') list.push({ id: 'lg-' + l.id, severity: 'high', group: 'Loans given', text: `${l.borrower} is overdue by ${Math.abs(daysFromToday(l.dueDate))} day(s) — ${fmt(outstandingOf(l, 'repayments'))} outstanding.`, target: { module: 'loans', tab: 'loansGiven' } });
      else if (status === 'due-soon') list.push({ id: 'lgs-' + l.id, severity: 'medium', group: 'Loans given', text: `${l.borrower}'s repayment is due in ${daysFromToday(l.dueDate)} day(s).`, target: { module: 'loans', tab: 'loansGiven' } });
    });
    loansReceived.forEach((l) => {
      const status = loanStatus(l, 'refunds');
      if (status === 'overdue') list.push({ id: 'lr-' + l.id, severity: 'high', group: 'Loans received', text: `You are ${Math.abs(daysFromToday(l.dueDate))} day(s) overdue refunding ${l.lender} — ${fmt(outstandingOf(l, 'refunds'))} left.`, target: { module: 'loans', tab: 'loansReceived' } });
      else if (status === 'due-soon') list.push({ id: 'lrs-' + l.id, severity: 'medium', group: 'Loans received', text: `Refund to ${l.lender} is due in ${daysFromToday(l.dueDate)} day(s).`, target: { module: 'loans', tab: 'loansReceived' } });
    });
    plans.forEach((p) => {
      if (p.closed) return;
      const periods = periodsForPlan(p).slice(0, -1);
      p.memberIds.forEach((memberId) => {
        const missed = periods.filter((period) => !findContribution(p.id, memberId, period));
        if (missed.length >= 2) {
          list.push({ id: 'miss-' + p.id + memberId, severity: 'medium', group: 'Thrift contributions', text: `${memberById(memberId)?.name} has missed ${missed.length} of ${periods.length} rounds in ${p.name}.`, target: { module: 'thrift', tab: 'plans', planId: p.id } });
        }
      });
    });
    invoices.forEach((inv) => {
      const status = invoiceStatusOf(inv);
      const client = clientById(inv.clientId);
      const name = client ? client.name : 'Client';
      const net = invoiceNetTotal(inv);
      if (status === 'overdue' && net > 0) list.push({ id: 'inv-' + inv.id, severity: 'high', group: 'Payments', text: `Invoice ${inv.number} to ${name} is overdue by ${Math.abs(daysFromToday(inv.dueDate))} day(s) — ${fmt(net)} outstanding.`, target: { module: 'payments', tab: 'invoices' } });
      else if (status === 'sent' && net > 0 && daysFromToday(inv.dueDate) <= 3) list.push({ id: 'invs-' + inv.id, severity: 'medium', group: 'Payments', text: `Invoice ${inv.number} to ${name} is due in ${daysFromToday(inv.dueDate)} day(s).`, target: { module: 'payments', tab: 'invoices' } });
    });
    const thisMonth = todayISO().slice(0, 7);
    const spentByCat = {};
    expenses.filter((e) => e.date.slice(0, 7) === thisMonth).forEach((e) => { spentByCat[e.category] = (spentByCat[e.category] || 0) + Number(e.amount || 0); });
    budgets.forEach((b) => {
      const spent = spentByCat[b.category] || 0;
      if (b.monthlyLimit <= 0) return;
      const pct = spent / b.monthlyLimit;
      if (pct >= 1) list.push({ id: 'bud-' + b.id, severity: 'high', group: 'Expense & Budgeting', text: `${b.category} is over its monthly budget — ${fmt(spent)} spent of ${fmt(b.monthlyLimit)}.`, target: { module: 'spending', tab: 'budgets' } });
      else if (pct >= 0.9) list.push({ id: 'buds-' + b.id, severity: 'medium', group: 'Expense & Budgeting', text: `${b.category} is close to its monthly budget — ${fmt(spent)} of ${fmt(b.monthlyLimit)} spent.`, target: { module: 'spending', tab: 'budgets' } });
    });
    return list;
  }, [loansGiven, loansReceived, plans, contributions, invoices, clients, expenses, budgets, todayKey]);
  // Once a dismissed alert's underlying condition is gone (paid off, missed rounds caught up, etc.)
  // its id stops showing up in rawAlerts — drop it from the dismissed list too, instead of keeping
  // stale ids around forever. If the same condition reappears later it gets a fresh id-based alert.
  useEffect(() => {
    const rawIds = new Set(rawAlerts.map((a) => a.id));
    setDismissed((prev) => {
      const next = prev.filter((id) => rawIds.has(id));
      return next.length === prev.length ? prev : next;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [rawAlerts]);
  const alerts = useMemo(() => rawAlerts.filter((a) => !dismissed.includes(a.id)), [rawAlerts, dismissed]);

  /* ---------- dashboard derived data ---------- */
  const totalCollected = contributions.reduce((s, c) => s + c.amount, 0);
  const totalWithdrawnFromThrift = plans.reduce((s, p) => s + (p.withdrawals || []).reduce((s2, w) => s2 + w.amount, 0), 0);
  const runningThriftBalance = totalCollected - totalWithdrawnFromThrift;
  const totalOwedToMe = loansGiven.reduce((s, l) => s + outstandingOf(l, 'repayments'), 0);
  const totalIOwe = loansReceived.reduce((s, l) => s + outstandingOf(l, 'refunds'), 0);
  const loanMovementThisMonth = (() => {
    const ym = todayISO().slice(0, 7);
    const repaid = loansGiven.reduce((s, l) => s + l.repayments.filter((r) => r.date.slice(0, 7) === ym).reduce((s2, r) => s2 + r.amount, 0), 0);
    const refunded = loansReceived.reduce((s, l) => s + l.refunds.filter((r) => r.date.slice(0, 7) === ym).reduce((s2, r) => s2 + r.amount, 0), 0);
    return repaid + refunded;
  })();
  const activePlansCount = plans.filter((p) => !p.closed).length;
  const cyclePlansCount = plans.filter((p) => p.category === 'Cycle' && !cycleComplete(p) && !p.closed).length;
  const collectedThisMonth = contributions.filter((c) => c.date.slice(0, 7) === todayISO().slice(0, 7)).reduce((s, c) => s + c.amount, 0);
  const totalInvoiced = invoices.reduce((s, i) => s + invoiceTotal(i), 0);
  const totalReceived = receipts.filter((r) => !r.voided).reduce((s, r) => s + r.amount, 0);
  const totalOutstanding = invoices.filter((i) => i.status !== 'paid' && i.status !== 'draft' && i.status !== 'void').reduce((s, i) => s + invoiceNetTotal(i), 0);
  const receivedThisMonth = receipts.filter((r) => !r.voided && r.date.slice(0, 7) === todayISO().slice(0, 7)).reduce((s, r) => s + r.amount, 0);
  const totalSpent = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const spentThisMonth = expenses.filter((e) => e.date.slice(0, 7) === todayISO().slice(0, 7)).reduce((s, e) => s + Number(e.amount || 0), 0);
  const spendByCategory = useMemo(() => {
    const map = {};
    expenses.forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [expenses]);
  const spentThisMonthByCategory = useMemo(() => {
    const map = {};
    const thisMonth = todayISO().slice(0, 7);
    expenses.filter((e) => e.date.slice(0, 7) === thisMonth).forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return map;
  }, [expenses]);
  const moduleAlerts = (groupNames) => alerts.filter((a) => groupNames.includes(a.group));

  const chartData = useMemo(() => {
    const weeks = lastNDates(8, 7);
    return weeks.map((w, i) => {
      const start = new Date(w).getTime();
      const end = start + 7 * dayMs;
      const total = contributions.filter((c) => {
        const t = new Date(c.date).getTime();
        return t >= start && t < end;
      }).reduce((s, c) => s + c.amount, 0);
      return { label: new Date(w).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), total };
    });
  }, [contributions]);

  const recentActivity = useMemo(() => {
    const acts = [];
    contributions.forEach((c) => acts.push({ date: c.date, text: `${memberById(c.memberId)?.name} paid ${fmt(c.amount)} into ${planById(c.planId)?.name}`, kind: 'in', scope: 'thrift' }));
    plans.forEach((p) => (p.payouts || []).forEach((po) => acts.push({ date: po.date, text: `${memberById(po.memberId)?.name} received the ${fmt(po.amount)} cycle payout from ${p.name}`, kind: 'out', scope: 'thrift' })));
    loansGiven.forEach((l) => l.repayments.forEach((r) => acts.push({ date: r.date, text: `${l.borrower} repaid ${fmt(r.amount)}`, kind: 'in', scope: 'loans' })));
    loansReceived.forEach((l) => l.refunds.forEach((r) => acts.push({ date: r.date, text: `You refunded ${fmt(r.amount)} to ${l.lender}`, kind: 'out', scope: 'loans' })));
    receipts.forEach((r) => {
      const client = clientById(r.clientId);
      acts.push({ date: r.date, text: `Received ${fmt(r.amount)} from ${client ? client.name : (r.clientName || 'a customer')} — ${r.receiptNo}`, kind: 'in', scope: 'payments' });
    });
    invoices.forEach((inv) => {
      const client = clientById(inv.clientId);
      acts.push({ date: inv.date, text: `Invoiced ${client ? client.name : (inv.clientName || 'a client')} ${fmt(inv.amount)} — ${inv.invoiceNo}`, kind: 'out', scope: 'payments' });
    });
    expenses.forEach((e) => acts.push({ date: e.date, text: `Logged ${fmt(e.amount)} expense — ${e.category}${e.note ? ` (${e.note})` : ''}`, kind: 'out', scope: 'spending' }));
    return acts.sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [contributions, loansGiven, loansReceived, plans, receipts, clients, invoices, expenses]);

  const todayActivity = useMemo(() => recentActivity.filter((a) => (a.date || '').slice(0, 10) === todayKey), [recentActivity, todayKey]);

  const borrowerNames = useMemo(() => Array.from(new Set(loansGiven.map((l) => l.borrower))), [loansGiven]);
  const lenderNames = useMemo(() => Array.from(new Set(loansReceived.map((l) => l.lender))), [loansReceived]);

  /* ---------- submit handlers ---------- */
  const submitNewPlan = () => {
    if (guardWrite()) return;
    if (!form.name) { flash('Enter a plan name.'); return; }
    if (!form.perMemberAmounts && !form.amount) { flash('Enter an amount per round.'); return; }
    if (form.perMemberAmounts) {
      const missingAmount = (form.memberIds || []).some((id) => !(form.memberAmounts || {})[id] && !form.amount);
      if (missingAmount) { flash('Enter an amount for each member, or set a default amount to fall back on.'); return; }
    }
    const isEdit = !!form.id;
    const existing = isEdit ? planById(form.id) : null;
    if (isEdit && !existing) { closeModalSilently(); return; }
    // Category, cadence and cycle/target-specific fields are locked once a plan exists —
    // changing them after contributions have been recorded against a given structure
    // would desync periods, cycle payouts, or target tracking from what's already saved.
    const category = isEdit ? existing.category : (form.category || 'Daily');
    if (category === 'Cycle' && (form.memberIds || []).length < 2) { flash('Pick at least 2 members for a rotating cycle plan.'); return; }
    const frequency = isEdit ? existing.frequency
      : category === 'Cycle' ? (form.cycleFrequency || 'monthly')
      : category === 'Weekly' ? 'weekly'
      : category === 'Daily' ? 'daily'
      : category === 'Target' ? (form.targetDateMode || 'daily')
      : 'monthly';
    const memberAmounts = {};
    if (form.perMemberAmounts) {

  /* ---------- Tax: import, consolidate, edit, calculate, file ---------- */

  // Reads each file, auto-detects columns, and stages the result for review.
  const handleTaxFileSelected = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const entries = [];
    for (const file of files) {
      const name = file.name.toLowerCase();
      const isExcel = /\.(xlsx|xls)$/.test(name);
      const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
      let autoResult = { rows: [], errors: [] };
      let rawRows = [];
      try {
        if (isExcel) {
          const buf = await file.arrayBuffer();
          const workbook = XLSX.read(new Uint8Array(buf), { type: 'array' });
          const found = excelRowsForImport(workbook);
          autoResult = found.autoResult || { rows: [], errors: ['Could not find a Date and Description/Narration column in this workbook.'] };
          rawRows = found.rawRows;
        } else if (isPdf) {
          if (!window.pdfjsLib) {
            autoResult = { rows: [], errors: ['PDF reading isn\u2019t available right now — try a CSV or Excel export instead.'] };
          } else {
            rawRows = await pdfRowsFromArrayBuffer(await file.arrayBuffer());
            autoResult = parseBankStatementRowsWithHeaderScan(rawRows, 20);
            if (autoResult.rows.length === 0) {
              autoResult = { rows: [], errors: rawRows.length > 1 ? ['Could not find a Date and Description/Narration column in this PDF.'] : ['No text could be extracted — this looks like a scanned PDF. Try OCR below.'] };
            }
          }
        } else {
          const text = await file.text();
          rawRows = toRowsFromText(text);
          autoResult = parseBankStatementRowsWithHeaderScan(rawRows, 15);
        }
      } catch (err) {
        console.warn('PocketLedger: statement read failed.', err);
        autoResult = { rows: [], errors: ['Could not read this file — it may be corrupted, scanned, or password-protected.'] };
      }
      entries.push({
        id: uid(), fileName: file.name, rows: autoResult.rows, errors: autoResult.errors,
        headerCells: rawRows[0] || [], dataRows: rawRows.slice(1),
        needsMapping: autoResult.rows.length === 0 && rawRows.length > 1,
        colMap: emptyColMap(),
        isPdf, sourceFile: isPdf ? file : null,
        looksScanned: isPdf && rawRows.length <= 1,
        ocrRunning: false, ocrAttempted: false,
        // Each file gets its own bank/account label — defaults to whatever's picked above,
        // but can be changed per file so a multi-bank batch doesn't get one name for all of them.
        bankName: taxImportBankOtherMode ? '' : taxImportSourceName,
        bankOtherMode: false,
        accountLabel: taxImportAccountLabelOtherMode ? '' : taxImportAccountLabel,
        accountLabelOtherMode: false,
      });
    }
    setTaxImportBatch((prev) => [...prev, ...entries]);
    if (entries.some((en) => en.rows.length === 0)) flash('One or more files couldn\u2019t be read automatically — see the notes below.');
    e.target.value = '';
  };
  const removeTaxImportEntry = (id) => setTaxImportBatch((prev) => prev.filter((entry) => entry.id !== id));
  const updateEntryBank = (id, value) => setTaxImportBatch((prev) => prev.map((entry) => {
    if (entry.id !== id) return entry;
    if (value === '__other__') return { ...entry, bankOtherMode: true, bankName: NIGERIA_BANK_NAMES.includes(entry.bankName) ? '' : entry.bankName };
    return { ...entry, bankOtherMode: false, bankName: value };
  }));
  const updateEntryAccountLabel = (id, value) => setTaxImportBatch((prev) => prev.map((entry) => {
    if (entry.id !== id) return entry;
    if (value === '__other__') return { ...entry, accountLabelOtherMode: true, accountLabel: ACCOUNT_LABEL_OPTIONS.includes(entry.accountLabel) ? '' : entry.accountLabel };
    return { ...entry, accountLabelOtherMode: false, accountLabel: value };
  }));
  // OCR is slow, so it only runs when explicitly requested per file.
  const runOcrOnEntry = async (id) => {
    const entry = taxImportBatch.find((en) => en.id === id);
    if (!entry || !entry.sourceFile) return;
    if (!window.Tesseract) { flash('OCR isn\u2019t available right now.'); return; }
    setTaxImportBatch((prev) => prev.map((en) => en.id === id ? { ...en, ocrRunning: true, ocrProgress: 'Starting…' } : en));
    try {
      const buf = await entry.sourceFile.arrayBuffer();
      const { rawRows, autoResult } = await ocrPdfRows(buf, (page, total) => {
        setTaxImportBatch((prev) => prev.map((en) => en.id === id ? { ...en, ocrProgress: `Reading page ${page} of ${total}…` } : en));
      });
      setTaxImportBatch((prev) => prev.map((en) => en.id === id ? {
        ...en, rows: autoResult.rows,
        errors: autoResult.rows.length > 0 ? [] : (autoResult.errors.length ? autoResult.errors : ['OCR could not find a readable table in this PDF.']),
        headerCells: rawRows[0] || [], dataRows: rawRows.slice(1),
        needsMapping: autoResult.rows.length === 0 && rawRows.length > 1,
        ocrRunning: false, ocrAttempted: true, ocrProgress: '',
      } : en));
      flash(autoResult.rows.length > 0 ? `OCR found ${autoResult.rows.length} transaction(s) — review the preview below.` : 'OCR finished but couldn\u2019t find a readable table. Try manual column mapping.');
    } catch (err) {
      console.warn('PocketLedger: OCR failed.', err);
      setTaxImportBatch((prev) => prev.map((en) => en.id === id ? { ...en, ocrRunning: false, ocrAttempted: true, ocrProgress: '' } : en));

  };
  const updateEntryColMap = (id, field, value) => {

  // Recomputes rows from manually-picked columns.
  const applyManualMapping = (id) => {

      if (cm.mode === 'debitCredit' && (cm.debit === '' || cm.credit === '')) { flash('Pick both a Debit and Credit column.'); return entry; }
      const numericColMap = {
        date: Number(cm.date), description: Number(cm.description), mode: cm.mode,
        amount: cm.amount !== '' ? Number(cm.amount) : undefined,
        debit: cm.debit !== '' ? Number(cm.debit) : undefined,

    ready.forEach((entry) => {
      const sourceName = ((entry.bankName || '').trim() || 'Bank statement') + ((entry.accountLabel || '').trim() ? ` — ${entry.accountLabel.trim()}` : '');
      const batchId = uid();

        const category = guessTaxCategory(r.description, r.amount);
        return {
          id: uid(), batchId, date: r.date, description: r.description, amount: r.amount,

        };

  // Pulls expenses into the tax ledger; safe to re-run, only pulls in new ones.

        amount: -Math.abs(Number(ex.amount || 0)), source: 'Expense Tracker', expenseRef: ex.id,
        category: ex.category === 'Business' ? 'Business Expense (deductible)' : 'Personal (non-deductible)',

    setTaxImports((prev) => [{ id: batchId, source: 'Expense Tracker', fileName: `${candidates.length} logged expense(s)`, count: newTxns.length, importedAt: new Date().toISOString() }, ...prev]);

  const removeTaxImportRecord = (batchId) => {
    if (guardWrite()) return;

      setTaxTransactions((prev) => prev.filter((t) => t.batchId !== batchId));
      setTaxImports((prev) => prev.filter((b) => b.id !== batchId));

  // Downloadable copies of the consolidated ledger.
  const exportTaxLedgerCsv = (rows, year) => {
    if (rows.length === 0) { flash('Nothing to export for this filter.'); return; }
    const header = ['Date', 'Source', 'Description', 'Category', 'Amount'].join(',');
    const csvRows = rows.map((t) => {
      const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      return [t.date, esc(t.source), esc(t.description), esc(t.category), t.amount].join(',');
    });
    const csv = [header, ...csvRows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);

  const taxSourcesAvailable = useMemo(() => Array.from(new Set(taxTransactions.map((t) => t.source))), [taxTransactions]);
  const taxTxnsForYear = (year) => taxTransactions.filter((t) => new Date(t.date).getFullYear() === Number(year));
  const sumTaxCategoryForYear = (year, category) => taxTxnsForYear(year).filter((t) => t.category === category).reduce((s, t) => s + Math.abs(Number(t.amount)), 0);

  const submitTaxReturn = () => {

        const req = await backupDirHandle.requestPermission({ mode: 'readwrite' });

      const fileHandle = await backupDirHandle.getFileHandle(fileName, { create: true });

    const token = githubTokenInput.trim();

    setGithubSyncing(true); setGithubError('');
    try {
      // Check token is valid
      const meRes = await fetch('https://api.github.com/user', { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' } });
      if (!meRes.ok) { setGithubError('Token rejected — make sure it has the "gist" scope.'); setGithubSyncing(false); return; }
      // Create a private gist
      const payload = backupPayload();
      const createRes = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: 'PocketLedger auto-sync backup', public: false, files: { 'pocketledger-backup.json': { content: JSON.stringify(payload, null, 2) } } }),
      });
      if (!createRes.ok) { setGithubError('Could not create a Gist — check token permissions.'); setGithubSyncing(false); return; }

    const client = clientById(inv.clientId);

    const discountAmt = invoiceDiscountAmount(inv);
    const vatAmt = invoiceVatAmount(inv);
    const total = invoiceTotal(inv);
    const status = invoiceStatusOf(inv);
    const lines = [
      `*${settings.businessName}*${settings.rcNumber ? ` (RC ${settings.rcNumber})` : ''}`, '',
      `Invoice: ${inv.number}`,
      `Bill to: ${client ? client.name : ''}`,
      `Issue date: ${new Date(inv.issueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
      `Due date: ${new Date(inv.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
      '',
      ...inv.items.map((it) => `${it.desc} — ${it.qty} x ${fmt(it.price)} = ${fmt(it.qty * it.price)}`),
      '',
    ];
    if (discountAmt > 0 || vatAmt > 0) {
      lines.push(`Subtotal: ${fmt(subtotal)}`);
      if (discountAmt > 0) lines.push(`Discount (${inv.discountPercent}%): -${fmt(discountAmt)}`);
      if (vatAmt > 0) lines.push(`VAT (${inv.vatPercent}%): +${fmt(vatAmt)}`);
    }
    lines.push(`Total: ${fmt(total)}`, `Status: ${INVOICE_STATUS_LABEL[status]}`);
    if (settings.accountNumber || settings.bankName || settings.accountName) lines.push('', `Pay to: ${settings.bankName || ''} ${settings.accountNumber} (${settings.accountName || settings.businessName})`);
    return lines.join('\n');
  };

    const client = clientById(inv.clientId);
    const total = invoiceTotal(inv);
    return [
      `Hello ${client ? client.name : ''}, this is a friendly reminder from ${settings.businessName}.`,
      `Invoice ${inv.number} for ${fmt(total)} is due on ${new Date(inv.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}.`,
      `Kindly reach out if you'd like to arrange this. Thank you!`,

        filename: `reminder-${inv.number}.png`,
      };
    });
    if (queue.length === 0) { flash('None of the overdue invoices have a client phone number on file.'); return; }
    setReminderDoc(queue[0]);
    setReminderQueue(queue.slice(1));
  };

                      <span className="kb-mono">{fmt(cyclePayoutsTotal(plan.payouts) + plan.cycleHistory.reduce((s, c) => s + cyclePayoutsTotal(c.payouts), 0))}</span>
                    </div>
                  </div>
                )}
                {!cycleComplete(plan) && plan.memberIds.length > 1 && (() => {
                  const order = cyclePayoutOrder(plan);
                  const paidIds = new Set((plan.payouts || []).map((p) => p.memberId));
                  const nextId = cycleCurrentRecipientId(plan);
                  return (
                    <div className="payout-order">
                      <div className="panel-sub" style={{ marginTop: 14, marginBottom: 6 }}>Payout order — use the arrows to change who's next</div>
                      <ul className="payout-order-list">
                        {order.map((memberId, i) => {
                          const m = memberById(memberId);
                          const isPaid = paidIds.has(memberId);
                          const isNext = memberId === nextId;
                          return (
                            <li key={memberId} className={`payout-order-row ${isPaid ? 'payout-order-paid' : ''} ${isNext ? 'payout-order-next' : ''}`}>
                              <span className="payout-order-pos kb-mono">{i + 1}</span>
                              <span className="payout-order-name">{m ? m.name : 'Unknown'}</span>
                              {isPaid ? <Stamp status="completed" label="Paid" /> : isNext ? <Stamp status="due-soon" label="Next up" /> : null}
                              <div className="payout-order-actions">
                                <button className="icon-btn" disabled={i === 0} onClick={() => movePayoutOrder(plan.id, memberId, -1)} title="Move up" aria-label="Move up">
                                  <ChevronDown size={14} style={{ transform: 'rotate(180deg)' }} />
                                </button>
                                <button className="icon-btn" disabled={i === order.length - 1} onClick={() => movePayoutOrder(plan.id, memberId, 1)} title="Move down" aria-label="Move down">
                                  <ChevronDown size={14} />
                                </button>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  );
                })()}
              </div>
            )}

            <div className="grid-scroll contrib-grid-scroll" data-tour="plans-table">
              <table className="contrib-grid">
                <thead>
                  <tr>
                    <th className="member-col">Contributor</th>
                    {periods.map((p) => (
                      <th key={p} className="kb-mono">
                        <button type="button" className="period-head-btn" title="Tap to see total collected for this round"
                          onClick={() => setPeriodTotalPrompt({ planId: plan.id, period: p, frequency: plan.frequency })}>
                          {periodLabel(p, plan.frequency)}
                        </button>
                      </th>
                    ))}
                    {plan.category !== 'Cycle' && <th className="kb-mono">Balance</th>}
                  </tr>
                </thead>
                <tbody>
                  {plan.memberIds.length === 0 ? (
                    <tr><td colSpan={periods.length + (plan.category !== 'Cycle' ? 2 : 1)}><EmptyState text="No contributors on this plan yet." /></td></tr>
                  ) : plan.memberIds.map((memberId) => (
                    <tr key={memberId}>
                      <td className="member-col">
                        {memberById(memberId)?.name}
                      </td>
                      {periods.map((period) => {
                        const contribution = findContribution(plan.id, memberId, period);
                        const paid = !!contribution;
                        const isToday = period === periods[periods.length - 1];
                        const isFixed = plan.fixedDueDay !== false;
                        const overdueUnpaid = isFixed && !paid && !isToday && new Date(period) < new Date(todayISO());
                        const memberAmount = plan.perMemberAmounts ? (plan.memberAmounts || {})[memberId] ?? plan.amount : plan.amount;
                        const paidOn = paid ? new Date(contribution.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
                        const cellKey = `${plan.id}:${memberId}:${period}`;
                        const armed = armedCell === cellKey;
                        const runCellAction = () => {
                          if (plan.closed) return;
                          if (paid) {
                            askConfirm(
                              `Unmark ${memberById(memberId)?.name || 'this contributor'}'s payment of ${fmt(contribution.amount)} for ${periodLabel(period, plan.frequency)}?`,
                              () => toggleContribution(plan.id, memberId, period),
                              { confirmLabel: 'Unmark payment', danger: true }
                            );
                            return;
                          }
                          setContribAmountInput('');
                          setContribDateInput(todayISO());
                          setContribPrompt({ planId: plan.id, memberId, period, frequency: plan.frequency, defaultAmount: memberAmount });
                        };
                        return (
                          <td key={period}>
                            <button
                              className={`cell-dot ${paid ? 'cell-paid' : 'cell-unpaid'} ${isToday ? 'cell-today' : ''} ${overdueUnpaid ? 'cell-overdue' : ''} ${armed ? 'cell-armed' : ''}`}
                              disabled={plan.closed && !paid}
                              title={plan.closed ? (paid ? `Paid ${fmt(contribution.amount)} on ${paidOn}` : 'Plan is closed') : armed ? 'Tap again to confirm' : paid ? `Paid ${fmt(contribution.amount)} on ${paidOn} — tap twice to undo` : overdueUnpaid ? 'Overdue — tap twice to enter amount paid' : 'Tap twice to enter amount paid'}
                              onClick={() => handleCellTap(cellKey, runCellAction)}
                            >
                              {armed && paid ? (
                                <span className="cell-amount-flash kb-mono">{fmt(contribution.amount)}</span>
                              ) : armed ? <span className="cell-armed-dot" /> : paid ? (isFixed ? <span className="cell-paid-stamp">{new Date(contribution.date).getDate()}</span> : <CheckCircle2 size={15} />) : null}
                            </button>
                          </td>
                        );
                      })}
                      {plan.category !== 'Cycle' && (
                        <td className="kb-mono balance-cell">
                          {fmt(planMemberBalance(plan.id, memberId))}
                          <button className="icon-btn" style={{ marginLeft: 6, verticalAlign: '-3px' }} title="Take out savings" aria-label="Take out savings"
                            onClick={() => openModal('thriftWithdrawal', { planId: plan.id, memberId, date: todayISO() })}>
                            <ArrowUpRight size={13} />
                          </button>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {(plan.withdrawals || []).length > 0 && (
              <div style={{ marginTop: 18 }}>
                <div className="panel-title" style={{ fontSize: 13 }}>Take-outs from this plan</div>
                <ul className="tab-entry-list">
                  {plan.withdrawals.map((w) => (
                    <li key={w.id} className="tab-entry-row tab-entry-row-borrow">
                      <span className="tab-entry-amount kb-mono">{fmt(w.amount)}</span>
                      <span className="tab-entry-note">{memberById(w.memberId)?.name || 'Member'}{w.note ? ` — ${w.note}` : ''}</span>
                      <span className="tab-entry-date kb-mono">{new Date(w.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                      <div className="tab-entry-actions">
                        <button className="icon-btn" onClick={() => deleteThriftWithdrawal(plan.id, w.id)} title="Delete" aria-label="Delete"><Trash2 size={13} /></button>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {(plan.memberLoans || []).length > 0 && (
              <div style={{ marginTop: 18 }}>
                <div className="panel-title" style={{ fontSize: 13 }}>Loans given from this pool</div>
                <ul className="tab-entry-list">
                  {plan.memberLoans.map((ml) => (
                    <li key={ml.id} className={`tab-entry-row ${ml.repaid ? 'tab-entry-row-payment' : 'tab-entry-row-borrow'}`}>
                      <span className="tab-entry-amount kb-mono">{fmt(ml.amount)}</span>
                      <span className="tab-entry-note">{memberById(ml.memberId)?.name || 'Member'}{ml.note ? ` — ${ml.note}` : ''}</span>
                      <span className="tab-entry-date kb-mono">{new Date(ml.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                      <div className="tab-entry-actions">
                        <button className="btn btn-small btn-ghost" onClick={() => togglePlanMemberLoanRepaid(plan.id, ml.id)}>{ml.repaid ? 'Repaid' : 'Mark repaid'}</button>
                        <button className="icon-btn" onClick={() => deletePlanMemberLoan(plan.id, ml.id)} title="Delete" aria-label="Delete"><Trash2 size={13} /></button>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
          </div>
          </div>
          </div>
        )}
      </>
    );
  };

  const renderContributors = () => {
    const filtered = members.filter((m) => m.name.toLowerCase().includes(memberSearch.toLowerCase()));
    const selected = memberById(selectedMemberId) || members[0];
    const memberPlans = selected ? plans.filter((p) => p.memberIds.includes(selected.id)) : [];
    const history = selected ? contributions.filter((c) => c.memberId === selected.id).sort((a, b) => new Date(b.date) - new Date(a.date)) : [];
    const withdrawalHistory = selected ? plans.flatMap((p) => (p.withdrawals || []).filter((w) => w.memberId === selected.id).map((w) => ({ ...w, planId: p.id }))).sort((a, b) => new Date(b.date) - new Date(a.date)) : [];

        <div className="contributors-shell">

                  <input type="checkbox" checked={checkedMemberIds.includes(m.id)} onClick={(e) => e.stopPropagation()} onChange={() => toggleMemberChecked(m.id)} style={{ marginRight: 4 }} />
                  <div className="member-avatar kb-display">{m.name.charAt(0)}</div>
                  <div>
                    <div className="member-name">{m.name}</div>
                    <div className="member-sub kb-mono">{fmt(memberBalance(m.id))} balance</div>
                  </div>
                  <ChevronRight size={15} className="chev" />
                </li>
              ))}
            </ul>
            )}
          </div>
        </div>

        {selected && memberDashboardOpen && (
          <div className="modal-backdrop" onClick={() => setMemberDashboardOpen(false)}>
            <div className="modal-card modal-card-wide member-dashboard-modal" onClick={(e) => e.stopPropagation()}>
              <div className="modal-head">
                <h3 className="kb-display">Member dashboard</h3>
                <button className="icon-btn" onClick={() => setMemberDashboardOpen(false)} title="Close" aria-label="Close"><X size={18} /></button>
              </div>
              <div className="modal-body member-dashboard-body">
                <div className="detail-head">
                  <div className="member-avatar-lg kb-display">{selected.name.charAt(0)}</div>
                  <div style={{ flex: 1 }}>
                    <div className="kb-display detail-name">{selected.name}</div>
                    <div className="panel-sub"><Phone size={12} style={{ verticalAlign: '-2px' }} /> {selected.phone ? <a className="tel-link" href={`tel:${selected.phone.replace(/[^0-9+]/g, '')}`}>{selected.phone}</a> : 'No phone on file'}</div>
                    {selected.email && <div className="panel-sub"><Mail size={12} style={{ verticalAlign: '-2px' }} /> {selected.email}</div>}
                    {selected.address && <div className="panel-sub"><MapPin size={12} style={{ verticalAlign: '-2px' }} /> {selected.address}</div>}
                    {selected.note && <div className="panel-sub" style={{ marginTop: 4, fontStyle: 'italic' }}>{selected.note}</div>}
                  </div>
                  <MoreMenu title="Contributor actions" items={[
                    { icon: <Edit3 size={15} />, label: 'Edit contributor', onClick: () => openModal('newMember', { id: selected.id, name: selected.name, phone: selected.phone || '', email: selected.email || '', address: selected.address || '', note: selected.note || '' }) },
                    { icon: <Trash2 size={15} />, label: 'Delete contributor', onClick: () => deleteMember(selected.id), danger: true },
                  ]} />
                </div>
                <div className="detail-actions">
                  <button className="btn btn-small btn-ghost" onClick={() => setBiodataDoc({
                    name: selected.name, phone: selected.phone,
                    fields: [
                      { label: 'Total contributed', value: fmt(memberTotal(selected.id)) },
                      { label: 'Payment consistency', value: `${memberConsistency(selected.id)}%` },
                      { label: 'Plans joined', value: memberPlans.length ? memberPlans.map((p) => p.name).join(', ') : 'None yet' },
                    ],
                    filename: `biodata-${selected.name.replace(/\s+/g, '-').toLowerCase()}.png`,
                  })}>
                    <ImageIcon size={13} /> Share biodata
                  </button>
                  {memberPlans.filter((p) => p.category !== 'Cycle').length > 0 && (
                    <button className="btn btn-small btn-outline" onClick={() => openModal('thriftWithdrawal', { planId: memberPlans.filter((p) => p.category !== 'Cycle')[0].id, memberId: selected.id, date: todayISO() })}>
                      <ArrowUpRight size={13} /> Take out
                    </button>
                  )}
                  <button className="btn btn-small btn-outline" onClick={() => setContributorStatementDoc(selected)}>
                    <FileText size={13} /> Download statement
                  </button>
                </div>
                <div className="detail-stats">
                  <div><span className="kb-mono">{fmt(memberTotal(selected.id))}</span><label>Total contributed</label></div>
                  <div><span className="kb-mono">{fmt(memberBalance(selected.id))}</span><label>Running balance</label></div>
                  <div><span className="kb-mono">{memberConsistency(selected.id)}%</span><label>Payment consistency</label></div>
                  <div><span className="kb-mono">{memberPlans.length}</span><label>Plans joined</label></div>
                </div>
                <div className="member-plan-list">
                  {memberPlans.map((p) => (
                    <div key={p.id} className="member-plan-row">
                      <CategoryTag category={p.category} />

                      {!p.closed && (
                        <button className="icon-btn" onClick={() => closeMemberOnPlan(p.id, selected.id)} title="Close this contributor's spot on this plan" aria-label={`Close ${selected.name}'s spot on ${p.name}`}>

                            {withdrawalHistory.map((w) => (

                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  // Groups loans by person, rolled up but keeping each loan's own repayment trail.
  const groupLoans = (list, personField, key) => {
    const dateField = personField === 'borrower' ? 'dateGiven' : 'dateReceived';
    const rank = { overdue: 0, 'due-soon': 1, active: 2, completed: 3 };
    const map = new Map();
    list.forEach((l) => {
      const name = (l[personField] || '').trim();
      const mapKey = name.toLowerCase();
      if (!map.has(mapKey)) map.set(mapKey, { name, loans: [] });
      map.get(mapKey).loans.push(l);
    });
    const groups = Array.from(map.values()).map((g) => {
      const loans = [...g.loans].sort((a, b) => new Date(b[dateField]) - new Date(a[dateField]));
      const totalPrincipal = loans.reduce((s, l) => s + l.principal, 0);
      const totalOutstanding = loans.reduce((s, l) => s + outstandingOf(l, key), 0);
      const worstRank = Math.min(...loans.map((l) => rank[loanStatus(l, key)]));
      return { name: g.name, loans, totalPrincipal, totalOutstanding, worstRank };
    });
    groups.sort((a, b) => a.worstRank - b.worstRank || b.totalOutstanding - a.totalOutstanding);
    return groups;
  };

  const renderLoanGroups = (list, key, personField, addFn, addLabel, emptyText, search, setSearch, deleteFn) => {
    const dateField = personField === 'borrower' ? 'dateGiven' : 'dateReceived';
    const groups = groupLoans(list, personField, key).filter((g) => g.name.toLowerCase().includes(search.toLowerCase()));
    return (
      <>
        <SearchBox className="loan-search" placeholder="Search by name…" value={search} onChange={setSearch} />
        {list.length === 0 ? <EmptyState text={emptyText} /> : groups.length === 0 ? <EmptyState text="No match found." /> : (
          <div className="loan-groups">
            {groups.map((g) => (
              <div key={g.name} className="person-group">
                <div className="person-group-head">
                  <div className="member-avatar kb-display">{g.name.charAt(0)}</div>
                  <div className="person-group-info">
                    <div className="person-group-name kb-display">{g.name}</div>
                    <div className="panel-sub">{g.loans.length} loan{g.loans.length > 1 ? 's' : ''} · {fmt(g.totalPrincipal)} total principal given{personField === 'lender' ? ' to you' : ''}</div>
                  </div>
                  <button className="btn btn-small btn-ghost" onClick={() => setBiodataDoc({
                    name: g.name, phone: g.loans[0].phone,
                    fields: [
                      { label: 'Loans on record', value: String(g.loans.length) },
                      { label: 'Total principal', value: fmt(g.totalPrincipal) },
                      { label: 'Total outstanding', value: fmt(g.totalOutstanding) },
                    ],
                    filename: `biodata-${g.name.replace(/\s+/g, '-').toLowerCase()}.png`,
                  })}>
                    <ImageIcon size={13} /> Biodata
                  </button>
                  <button className="icon-btn" onClick={() => openModal('editLoanPerson', {
                    personField, oldName: g.name, name: g.name, phone: g.loans[0].phone || '',
                  })} title="Edit contact" aria-label="Edit contact"><Edit3 size={15} /></button>
                  <div className="kb-mono outstanding"><span>total outstanding</span>{fmt(g.totalOutstanding)}</div>
                </div>
                <div className="person-group-list-kicker"><span />Loan list</div>
                <div className="loan-list">
                  {g.loans.map((l) => {
                    const status = loanStatus(l, key);
                    const out = outstandingOf(l, key);
                    const accrued = accruedOf(l, key);
                    const paid = paidOf(l, key);
                    const isOpen = expandedLoan === l.id;
                    const plan = l.linkedPlanId ? planById(l.linkedPlanId) : null;
                    const person = l[personField];
                    return (
                      <div key={l.id} className="loan-card">
                        <div className="loan-card-top" onClick={() => setExpandedLoan(isOpen ? null : l.id)}>
                          <div>
                            <div className="loan-name kb-display kb-mono">{fmt(l.principal)}</div>
                            <div className="panel-sub">
                              given {new Date(l[dateField]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
                              {' · due '}{new Date(l.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
                              {l.interestRate > 0 && <span className="kb-mono"> · {l.interestRate}%/yr</span>}
                              {plan && <span className="linked-tag"><Link2 size={11} /> {plan.name}</span>}
                            </div>
                          </div>
                          <div className="loan-card-right">
                            <div className="kb-mono outstanding"><span>outstanding</span>{fmt(out)}</div>
                            <Stamp status={status} />
                            <ChevronDown size={16} className={`chev ${isOpen ? 'chev-open' : ''}`} />
                          </div>
                        </div>
                        {isOpen && (
                          <div className="loan-card-body">
                            {l.note && <div className="loan-note">“{l.note}”</div>}
                            <div className="balance-breakdown">
                              <div><label>Principal</label><span className="kb-mono">{fmt(l.principal)}</span></div>
                              {accrued > 0 && <div><label>Accrued interest</label><span className="kb-mono">{fmt(accrued)}</span></div>}
                              <div><label>Paid so far</label><span className="kb-mono">{fmt(paid)}</span></div>
                              <div className="balance-total"><label>Outstanding</label><span className="kb-mono">{fmt(out)}</span></div>
                            </div>
                            <div className="loan-actions">
                              {out > 0 && (
                                <button className="btn btn-small btn-ghost" onClick={() => { setReminderQueue([]); setReminderDoc({
                                  title: key === 'repayments' ? 'Repayment Reminder' : 'Refund Reminder',
                                  personName: person, personPhone: l.phone,
                                  message: reminderMessage(person, l, key, dateField),
                                  amountDue: out, dueDate: l.dueDate,
                                  filename: `reminder-${l.id.slice(0, 8)}.png`,
                                }); }}>
                                  <Send size={13} /> Send reminder
                                </button>
                              )}
                              <button className="btn btn-small btn-danger" onClick={() => deleteFn(l.id)}><Trash2 size={13} /> Delete</button>
                            </div>
                            <div className="panel-title" style={{ fontSize: 13, marginTop: 12 }}>Payment history</div>
                            {(l[key] || []).length === 0 ? <EmptyState text="No payments recorded yet." /> : (
                              <ul className="payment-history">
                                {l[key].map((r) => (
                                  <li key={r.id}>
                                    <CheckCircle2 size={14} className="pay-icon" />
                                    <span className="kb-mono">{fmt(r.amount)}</span>
                                    <span className="panel-sub">on {new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                                    <button className="link-btn receipt-link" onClick={() => setReceipt({ kind: 'loan', loan: l, key, personField, dateField, payment: r })}>
                                      <Receipt size={12} /> Receipt
                                    </button>
                                  </li>
                                ))}
                              </ul>
                            )}

                            {out > 0 && <AddPaymentRow label={addLabel} onAdd={(amount, date) => addFn(l.id, amount, date)} />}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </>

  const performGlobalSearch = (query) => {
    if (!query.trim()) return [];
    const q = query.trim().toLowerCase();
    const results = [];
    
    // Search members (thrift contributors)
    members.forEach((m) => {
      if (m.name.toLowerCase().includes(q) || (m.phone && m.phone.includes(query))) {
        results.push({ type: 'member', id: m.id, name: m.name, phone: m.phone, module: 'thrift', tab: 'contributors', label: 'Thrift Contributor' });
      }
    });
    
    // Search clients (invoices/receipts)
    clients.forEach((c) => {
      if (c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(query)) || (c.email && c.email.toLowerCase().includes(q))) {
        results.push({ type: 'client', id: c.id, name: c.name, phone: c.phone, email: c.email, module: 'payments', tab: 'clients', label: 'Client' });
      }
    });
    
    // Search loan contacts
    loanContacts.forEach((lc) => {
      if (lc.name.toLowerCase().includes(q) || (lc.phone && lc.phone.includes(query)) || (lc.email && lc.email.toLowerCase().includes(q))) {
        results.push({ type: 'loanContact', id: lc.id, name: lc.name, phone: lc.phone, email: lc.email, module: 'loans', tab: 'loansGiven', label: 'Loan Contact' });
      }
    });
    
    // Search thrift plans
    plans.forEach((p) => {
      if (p.name.toLowerCase().includes(q)) {
        results.push({ type: 'plan', id: p.id, name: p.name, module: 'thrift', tab: 'plans', label: 'Thrift Plan' });
      }
    });
    
    // Search loans (by name or contact info)
    loansGiven.forEach((l) => {
      const contact = loanContacts.find((c) => c.id === l.contactId);
      if ((contact && contact.name.toLowerCase().includes(q)) || (contact && contact.phone && contact.phone.includes(query))) {
        results.push({ type: 'loanGiven', id: l.id, name: contact?.name || 'Unnamed', amount: l.principal, module: 'loans', tab: 'loansGiven', label: 'Loan (Given)' });
      }
    });
    loansReceived.forEach((l) => {
      const contact = loanContacts.find((c) => c.id === l.contactId);
      if ((contact && contact.name.toLowerCase().includes(q)) || (contact && contact.phone && contact.phone.includes(query))) {
        results.push({ type: 'loanReceived', id: l.id, name: contact?.name || 'Unnamed', amount: l.principal, module: 'loans', tab: 'loansReceived', label: 'Loan (Received)' });
      }
    });
    
    return results.slice(0, 12); // Limit to 12 results
  };

                                  <div className="outstanding kb-mono">{fmt(r.amount)}</div>

  const renderInvoices = () => {
    const filtered = invoices.filter((i) => {
      const client = clientById(i.clientId);
      const name = (client ? client.name : '').toLowerCase();
      const matchesSearch = name.includes(invoiceSearch.toLowerCase()) || i.number.toLowerCase().includes(invoiceSearch.toLowerCase());
      const matchesStatus = invoiceStatusFilter === 'All' || invoiceStatusOf(i) === invoiceStatusFilter;
      const matchesFrom = !invoiceDateFrom || i.issueDate >= invoiceDateFrom;
      const matchesTo = !invoiceDateTo || i.issueDate <= invoiceDateTo;
      const matchesRecurring = !invoiceRecurringOnly || !!i.recurring;
      return matchesSearch && matchesStatus && matchesFrom && matchesTo && matchesRecurring;
    }).sort((a, b) => {
      const { key, dir } = invoiceSort;
      const mul = dir === 'asc' ? 1 : -1;
      if (key === 'client') return mul * (clientById(a.clientId)?.name || '').localeCompare(clientById(b.clientId)?.name || '');
      if (key === 'total') return mul * (invoiceTotal(a) - invoiceTotal(b));
      if (key === 'status') return mul * invoiceStatusOf(a).localeCompare(invoiceStatusOf(b));
      return mul * (new Date(a.issueDate) - new Date(b.issueDate));
    });
    const overdueInvoices = invoices.filter((i) => invoiceStatusOf(i) === 'overdue');
    const overdueTotal = overdueInvoices.reduce((s, i) => s + invoiceNetTotal(i), 0);
    return (
      <>
        <SectionHeader eyebrow="Bill your clients" title="Invoices"
          action={<div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

            <button className="btn btn-outline" onClick={() => exportInvoicesXlsx(filtered)}><Download size={16} /> Excel</button>
