  const renderReceipts = () => {
    const filtered = receipts.filter((r) => {
      const client = clientById(r.clientId);
      const name = (client ? client.name : r.clientName || '').toLowerCase();
      const matchesSearch = name.includes(receiptSearch.toLowerCase()) || r.receiptNo.toLowerCase().includes(receiptSearch.toLowerCase());
      const matchesFrom = !receiptDateFrom || r.date >= receiptDateFrom;
      const matchesTo = !receiptDateTo || r.date <= receiptDateTo;
      return matchesSearch && matchesFrom && matchesTo;
    }).sort((a, b) => {
      const { key, dir } = receiptSort;
      const mul = dir === 'asc' ? 1 : -1;
      if (key === 'client') {
        const nameOf = (r) => clientById(r.clientId)?.name || r.clientName || '';
        return mul * nameOf(a).localeCompare(nameOf(b));
      }
      if (key === 'amount') return mul * (Number(a.amount) - Number(b.amount));
      return mul * (new Date(a.date) - new Date(b.date));
    });
    return (
      <>
        <SectionHeader eyebrow="Proof of payment" title="Receipts"
          action={<div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn btn-outline" onClick={() => exportReceiptsCsv(filtered)}><Download size={16} /> CSV</button>
            <button className="btn btn-outline" onClick={() => exportReceiptsXlsx(filtered)}><Download size={16} /> Excel</button>
            <button className="btn btn-outline" onClick={() => {
              const sortLabels = { 'date:desc': 'date (newest first)', 'date:asc': 'date (oldest first)', 'client:asc': 'payer (A–Z)', 'client:desc': 'payer (Z–A)', 'amount:desc': 'amount (highest first)', 'amount:asc': 'amount (lowest first)' };
              setReceiptSummaryDoc({
                title: 'Receipt Summary',
                sortLabel: sortLabels[`${receiptSort.key}:${receiptSort.dir}`] || 'date',
                count: filtered.length,
                rows: filtered.map((r) => {
                  const client = clientById(r.clientId);
                  return {
                    primary: r.receiptNo, secondary: client ? client.name : (r.clientName || 'Unknown payer'),
                    meta: `${new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · ${r.voided ? 'Void' : r.status === 'draft' ? 'Draft' : 'Paid'}`,
                    amount: Number(r.amount || 0),
                  };
                }),
                totalLabel: 'Total (all receipts shown)',
                total: filtered.reduce((s, r) => s + Number(r.amount || 0), 0),
              });
            }}><FileText size={16} /> PDF summary</button>
            <button className="btn btn-primary" data-tour="receipts-new" onClick={() => openModal('newReceipt', { date: todayISO() })}><Plus size={16} /> Issue receipt</button>
          </div>} />
        <SearchBox className="loan-search" placeholder="Search by payer or receipt number…" value={receiptSearch} onChange={setReceiptSearch} />
        <div className="field-row" style={{ marginBottom: 14 }}>
          <select className="kb-input" value={`${receiptSort.key}:${receiptSort.dir}`} onChange={(e) => { const [key, dir] = e.target.value.split(':'); setReceiptSort({ key, dir }); }}>
            <option value="date:desc">Date (newest first)</option>
            <option value="date:asc">Date (oldest first)</option>
            <option value="client:asc">Payer (A–Z)</option>
            <option value="client:desc">Payer (Z–A)</option>
            <option value="amount:desc">Amount (highest first)</option>
            <option value="amount:asc">Amount (lowest first)</option>
          </select>
        </div>
        <div className="field-row" style={{ marginBottom: 14 }}>
          <div className="field"><label>Date from</label>
            <input type="date" className="kb-input" value={receiptDateFrom} onChange={(e) => setReceiptDateFrom(e.target.value)} />
          </div>
          <div className="field"><label>Date to</label>
            <input type="date" className="kb-input" value={receiptDateTo} onChange={(e) => setReceiptDateTo(e.target.value)} />
          </div>
          {(receiptDateFrom || receiptDateTo) && (
            <button className="btn btn-outline btn-small" style={{ alignSelf: 'flex-end', marginBottom: 2 }} onClick={() => { setReceiptDateFrom(''); setReceiptDateTo(''); }}>Clear dates</button>
          )}
        </div>
        {filtered.length === 0 ? <EmptyState text={receipts.length === 0 ? "No receipts yet — they're generated automatically when you mark an invoice paid, or issue one directly." : 'No receipts match your search.'} /> : (
          <div className="loan-list">
            {filtered.map((r) => {
              const client = clientById(r.clientId);
              const invoice = r.invoiceId ? invoiceById(r.invoiceId) : null;
              const voided = !!r.voided;
              const draft = !voided && r.status === 'draft';
              return (
                <div key={r.id} className={`loan-card${voided ? ' receipt-voided' : ''}`}>
                  <div className="loan-card-top" onClick={() => setPaymentReceiptDoc(r)}>
                    <div>
                      <span className="loan-name">{r.receiptNo} &middot; {client ? client.name : (r.clientName || 'Walk-in customer')}{r.recurring && <span title="Repeats monthly"><Repeat size={12} style={{ marginLeft: 6, verticalAlign: '-1px', opacity: 0.6 }} /></span>}</span>
                      <div className="plan-card-meta">{new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}{invoice ? ` · for ${invoice.number}` : ''}</div>
                    </div>
                    <div className="loan-card-right">
                      {voided ? <Stamp status="overdue" label="Void" /> : draft ? <Stamp status="due-soon" label="Draft" /> : <Stamp status="completed" label="Paid" />}
                      <div className="outstanding kb-mono">{fmt(r.amount)}<span>received</span></div>
                      <ChevronRight size={15} className="chev" />
                    </div>
                  </div>
                  <div className="loan-card-body">
                    <div className="loan-actions" style={{ marginTop: 12, flexWrap: 'wrap' }}>
                      <button className="btn btn-outline btn-small" onClick={() => setPaymentReceiptDoc(r)}><Receipt size={13} /> View / share</button>
                      {draft && <button className="btn btn-outline btn-small" onClick={() => editReceipt(r)}><Edit3 size={13} /> Edit</button>}
                      {draft && <button className="btn btn-secondary btn-small" onClick={() => issueReceipt(r.id)}><Send size={13} /> Issue</button>}
                      {!draft && (voided ? (
                        <button className="btn btn-secondary btn-small" onClick={() => restoreReceipt(r.id)}><RotateCcw size={13} /> Restore</button>
                      ) : (
                        <button className="btn btn-outline btn-small" onClick={() => voidReceipt(r.id)}><Ban size={13} /> Void</button>
                      ))}
                      {(draft || settings.allowDocDelete === true) && <button className="btn btn-danger btn-small" onClick={() => deleteReceipt(r.id)}><Trash2 size={13} /> Delete</button>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </>
    );
  };

  const renderSpendingOverview = () => {
    const recentExpenses = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 8);
    const topCategory = spendByCategory[0];
    return (
      <>
        <SectionHeader eyebrow="Expense & budgeting" title="Where your money is going" />
        <div className="stat-grid">
          <StatCard label="Spent this month" value={fmt(spentThisMonth)} icon={CreditCard} tone="brick" sub={`${expenses.filter((e) => e.date.slice(0, 7) === todayISO().slice(0, 7)).length} expense(s)`} />
          <StatCard label="Total logged" value={fmt(totalSpent)} icon={Wallet} tone="steel" sub={`${expenses.length} expense(s) all-time`} />
          <StatCard label="Top category" value={topCategory ? topCategory[0] : '—'} icon={Target} tone="gold" sub={topCategory ? fmt(topCategory[1]) : 'No expenses yet'} />
          <StatCard label="Budgets over limit" value={budgets.filter((b) => (spentThisMonthByCategory[b.category] || 0) > b.monthlyLimit).length} icon={AlertTriangle} tone="brick" sub={`${budgets.length} budget(s) set`} />
          <StatCard label="Budget alerts" value={moduleAlerts(['Expense & Budgeting']).length} icon={AlertTriangle} tone="green" sub="Needs attention" />
          <StatCard label="Categories tracked" value={spendByCategory.length} icon={Repeat} tone="steel" sub="With logged spend" />
        </div>
        <div className="two-col">
          <div className="panel">
            <div className="panel-title">Recent expenses</div>
            {recentExpenses.length === 0 ? <EmptyState text="No expenses logged yet." /> : (
              <ul className="activity-list">
                {recentExpenses.map((e) => (
                  <li key={e.id} className="activity-item">
                    <span className="dot dot-out" />
                    <span className="activity-text">{e.category}{e.note ? ` — ${e.note}` : ''} <span className="kb-mono">{fmt(e.amount)}</span></span>
                    <span className="activity-date kb-mono">{new Date(e.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
          <div className="panel">
            <div className="panel-title">By category</div>
            {spendByCategory.length === 0 ? <EmptyState text="Nothing logged yet." /> : (
              <ul className="activity-list">
                {spendByCategory.map(([cat, amt]) => (
                  <li key={cat} className="activity-item">
                    <span className="activity-text">{cat}</span>
                    <span className="kb-mono">{fmt(amt)}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      </>
    );
  };

  const renderExpenses = () => {
    const filtered = expenses
      .filter((e) => expenseCategoryFilter === 'All' || e.category === expenseCategoryFilter)
      .filter((e) => !expenseSearch || (e.note || '').toLowerCase().includes(expenseSearch.toLowerCase()) || (e.category || '').toLowerCase().includes(expenseSearch.toLowerCase()))
      .sort((a, b) => {
        const { key, dir } = expenseSort;
        const mul = dir === 'asc' ? 1 : -1;
        if (key === 'date') return mul * (new Date(a.date) - new Date(b.date));
        if (key === 'amount') return mul * (Number(a.amount) - Number(b.amount));
        return mul * String(a[key] || '').localeCompare(String(b[key] || ''));
      });
    const visible = filtered.slice(0, expenseShowCount);
    const sortHeader = (key, label) => (
      <th className="sortable-th" onClick={() => setExpenseSort((s) => ({ key, dir: s.key === key && s.dir === 'desc' ? 'asc' : 'desc' }))}>
        {label} {expenseSort.key === key && (expenseSort.dir === 'desc' ? <ChevronDown size={12} /> : <ChevronDown size={12} style={{ transform: 'rotate(180deg)' }} />)}
      </th>
    );
    return (
      <>
        <SectionHeader eyebrow="Every expense" title="Expenses"
          action={<div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-outline" onClick={() => exportExpensesCsv(filtered)}><Download size={16} /> Export CSV</button>
            <button className="btn btn-primary" data-tour="expenses-new" onClick={() => openModal('newExpense', { date: todayISO() })}><Plus size={16} /> Log expense</button>
          </div>} />
        <SearchBox className="loan-search" placeholder="Search by note or category…" value={expenseSearch} onChange={(v) => { setExpenseSearch(v); setExpenseShowCount(20); }} />
        <div className="field-row" style={{ marginBottom: 14 }}>
          <select className="kb-input" value={expenseCategoryFilter} onChange={(e) => { setExpenseCategoryFilter(e.target.value); setExpenseShowCount(20); }}>
            <option value="All">All categories</option>
            {EXPENSE_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        {filtered.length === 0 ? <EmptyState text={expenses.length === 0 ? 'No expenses logged yet.' : 'No expenses match your filters.'} /> : (
          <>
            <table className="history-table">
              <thead><tr>{sortHeader('date', 'Date')}{sortHeader('category', 'Category')}<th>Note</th>{sortHeader('amount', 'Amount')}<th></th></tr></thead>
              <tbody>
                {visible.map((e) => (
                  <tr key={e.id}>
                    <td className="kb-mono">{new Date(e.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                    <td>{e.category}{e.recurring && <span title="Repeats monthly"><Repeat size={12} style={{ marginLeft: 6, verticalAlign: '-1px', opacity: 0.6 }} /></span>}</td>
                    <td className="panel-sub">{e.note || '—'}</td>
                    <td className="kb-mono">
                      {fmt(e.amount)}
                      {e.foreignCurrency && (
                        <div className="panel-sub" style={{ fontSize: 11 }}>{foreignCurrencyByCode(e.foreignCurrency)?.symbol || ''}{e.foreignAmount} {e.foreignCurrency}</div>
                      )}
                    </td>
                    <td>
                      <div className="tab-entry-actions">
                        <button className="icon-btn" onClick={() => openModal('editExpense', { ...e })} title="Edit" aria-label="Edit"><Edit3 size={13} /></button>
                        <button className="icon-btn" onClick={() => deleteExpense(e.id)} title="Delete" aria-label="Delete"><Trash2 size={13} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {filtered.length > visible.length && (
              <button className="btn btn-outline btn-small" style={{ marginTop: 12 }} onClick={() => setExpenseShowCount((n) => n + 20)}>
                Load more ({filtered.length - visible.length} remaining)
              </button>
            )}
          </>
        )}
      </>
    );
  };

  const renderBudgets = () => {
    const uncovered = EXPENSE_CATEGORIES.filter((c) => !budgetForCategory(c));
    return (
      <>
        <SectionHeader eyebrow="Stay within limits" title="Monthly budgets"
          action={<button className="btn btn-primary" data-tour="budgets-new" onClick={() => openModal('setBudget', {})}><Plus size={16} /> Set a budget</button>} />
        {budgets.length === 0 ? <EmptyState text="No budgets set yet — set a monthly limit for a category to start tracking against it." /> : (
          <div className="loan-list">
            {budgets.map((b) => {
              const spent = spentThisMonthByCategory[b.category] || 0;
              const over = spent > b.monthlyLimit;
              return (
                <div key={b.id} className="loan-card">
                  <div className="loan-card-body" style={{ paddingTop: 16 }}>
                    <div className="loan-card-top" style={{ cursor: 'default' }}>
                      <div>
                        <div className="loan-name kb-display">{b.category}</div>
                        <div className="panel-sub" style={over ? { color: 'var(--brick)' } : undefined}>
                          {fmt(spent)} of {fmt(b.monthlyLimit)} spent this month{over ? ' — over budget' : ''}
                        </div>
                      </div>
                      <div className="loan-card-right">
                        <button className="btn btn-small btn-outline" onClick={() => openModal('setBudget', { id: b.id, category: b.category, monthlyLimit: b.monthlyLimit })}><Edit3 size={13} /> Edit</button>
                        <button className="icon-btn" onClick={() => deleteBudget(b.id)} title="Delete" aria-label="Delete"><Trash2 size={15} /></button>

                    </div>
                    <ProgressBar value={spent} max={b.monthlyLimit} />

                </div>
              );

          <div className="field-hint" style={{ marginTop: 16 }}>
            No budget set yet for: {uncovered.join(', ')}.
          </div>
        )}
      </>
    );
  };

  const renderBudgetTrends = () => {
    // Calculate spending per month per category over the last 12 months
    const monthsData = [];
    const today = new Date();
    for (let i = 11; i >= 0; i--) {
      const date = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      monthsData.push(monthKey);
    }

    // Build chart data: each month is a row, with columns for each budget category
    const chartData = monthsData.map((monthKey) => {
      const row = { month: new Date(monthKey + '-01').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }) };
      budgets.forEach((b) => {
        const spent = expenses
          .filter((e) => e.date.slice(0, 7) === monthKey && e.category === b.category)
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        row[b.category] = spent;
        row[`limit-${b.category}`] = b.monthlyLimit;
      });
      return row;
    });

    // Get unique categories from budgets
    const categories = budgets.map((b) => b.category);
    const tones = ['green', 'gold', 'brick', 'steel', 'navy'];

    return (
      <>
        <SectionHeader eyebrow="Spending over time" title="Budget trends" />
        {budgets.length === 0 ? (
          <EmptyState text="Set at least one budget to see spending trends." />
        ) : (
          <>
            <div className="panel" style={{ marginBottom: 16 }}>
              <div className="panel-title" style={{ marginBottom: 16 }}>Monthly spending vs budget limits (last 12 months)</div>
              {chartData.length > 0 && (
                <ResponsiveContainer width="100%" height={320}>
                  <AreaChart data={chartData}>
                    <defs>
                      {categories.map((cat, idx) => (
                        <linearGradient key={`grad-${idx}`} id={`grad-${idx}`} x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor={
                            tones[idx % tones.length] === 'green' ? 'var(--green)' :
                            tones[idx % tones.length] === 'gold' ? 'var(--gold)' :
                            tones[idx % tones.length] === 'brick' ? 'var(--brick)' :
                            tones[idx % tones.length] === 'steel' ? 'var(--steel)' :
                            'var(--navy)'
                          } stopOpacity={0.8} />
                          <stop offset="95%" stopColor={
                            tones[idx % tones.length] === 'green' ? 'var(--green)' :
                            tones[idx % tones.length] === 'gold' ? 'var(--gold)' :
                            tones[idx % tones.length] === 'brick' ? 'var(--brick)' :
                            tones[idx % tones.length] === 'steel' ? 'var(--steel)' :
                            'var(--navy)'
                          } stopOpacity={0.1} />
                        </linearGradient>
                      ))}
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="var(--paper-line)" />
                    <XAxis dataKey="month" stroke="var(--ink-soft)" style={{ fontSize: 12 }} />
                    <YAxis stroke="var(--ink-soft)" style={{ fontSize: 12 }} />
                    <Tooltip 
                      contentStyle={{ background: 'var(--surface)', border: `1px solid var(--paper-line)` }}
                      formatter={(value) => fmt(value)}
                      labelStyle={{ color: 'var(--ink)' }}
                    />
                    {categories.map((cat, idx) => (
                      <Area key={cat} type="monotone" dataKey={cat} fill={`url(#grad-${idx})`} 
                        stroke={
                          tones[idx % tones.length] === 'green' ? 'var(--green)' :
                          tones[idx % tones.length] === 'gold' ? 'var(--gold)' :
                          tones[idx % tones.length] === 'brick' ? 'var(--brick)' :
                          tones[idx % tones.length] === 'steel' ? 'var(--steel)' :
                          'var(--navy)'
                        } isAnimationActive={false} />
                    ))}
                  </AreaChart>
                </ResponsiveContainer>
              )}
            </div>
            <div className="two-col">
              {categories.map((cat, idx) => {
                const budget = budgetForCategory(cat);
                if (!budget) return null;
                const totalSpent = expenses
                  .filter((e) => e.category === cat)
                  .reduce((s, e) => s + Number(e.amount || 0), 0);
                const avgMonthly = totalSpent / Math.max(1, expenses.filter((e) => e.category === cat).length > 0 ? 12 : 1);
                const thisMonthSpent = spentThisMonthByCategory[cat] || 0;
                const pct = (avgMonthly / budget.monthlyLimit * 100).toFixed(0);
                return (
                  <div key={cat} className="panel">
                    <div className="panel-title">{cat}</div>
                    <div style={{ marginBottom: 12 }}>
                      <div className="panel-sub">Average monthly</div>
                      <div className="kb-display" style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>{fmt(avgMonthly)}</div>
                      <ProgressBar value={avgMonthly} max={budget.monthlyLimit} />
                      <div className="panel-sub" style={{ marginTop: 8, fontSize: 11 }}>
                        {pct}% of {fmt(budget.monthlyLimit)} limit · This month: {fmt(thisMonthSpent)}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </>
    );
  };

  const renderTaxOverview = () => {
    const year = taxYearFilter;

            </select>
          } />
        <div className="stat-grid">
          <StatCard label="Consolidated income" value={fmt(income)} icon={TrendingUp} tone="green" sub={`${year} · from ledger`} />
          <StatCard label="Deductible / reliefs" value={fmt(deductible)} icon={CreditCard} tone="steel" sub={`${year} · from ledger`} />
          <StatCard label="Transactions imported" value={taxTransactions.length} icon={Upload} tone="gold" sub={`${taxImports.length} import batch(es)`} />
          <StatCard label="Returns this year" value={yearReturns.length} icon={Receipt} tone="brick" sub={`${taxReturns.length} total on file`} />
          <StatCard label="Net taxable" value={fmt(netTaxable)} icon={Landmark} tone="steel" sub={`${year} · income less reliefs`} />
          <StatCard label="Filed returns" value={filedReturnsCount} icon={CheckCircle2} tone="green" sub={`${taxReturns.length - filedReturnsCount} draft(s)`} />
        </div>
        <div className="panel">
          <div className="panel-title">How this works</div>
          <div className="panel-sub" style={{ lineHeight: 1.6 }}>
            1. Import bank statements in <strong>Import</strong> — CSV, Excel or PDF.<br />
            2. Or pull in everything from <strong>Expense &amp; Budgeting</strong>, one tap.<br />
            3. Tag each line in <strong>Ledger</strong> as income, deductible, or non-taxable.<br />
            4. Calculate and file a return in <strong>Returns</strong>.
          </div>
        </div>
        <div className="panel" style={{ marginTop: 16 }}>
          <div className="panel-title">Recent transactions</div>
          {recent.length === 0 ? <EmptyState text="No transactions consolidated yet — import a bank statement to get started." /> : (
            <div className="grid-scroll">
            <table className="history-table">

  const renderTaxTransactions = () => {
    const filtered = taxTransactions
      .filter((t) => new Date(t.date).getFullYear() === Number(taxYearFilter))

      .filter((t) => !taxNeedsReviewOnly || t.categoryIsGuess)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const guessCountThisYear = taxTransactions.filter((t) => new Date(t.date).getFullYear() === Number(taxYearFilter) && t.categoryIsGuess).length;
    const income = filtered.filter((t) => t.amount >= 0 && t.category !== 'Non-Taxable Transfer').reduce((s, t) => s + t.amount, 0);
    const deductible = filtered.filter((t) => TAX_DEDUCTION_CATEGORIES.includes(t.category) && t.category !== 'Personal (non-deductible)').reduce((s, t) => s + Math.abs(t.amount), 0);
    const visible = filtered.slice(0, taxTxnShowCount);
    return (
      <>
        <SectionHeader eyebrow="Every bank, one ledger" title="Consolidated ledger"
          action={<button className="btn btn-primary" onClick={() => openModal('newTaxTxn', { date: todayISO(), direction: 'in', source: 'Manual entry' })}><Plus size={16} /> Add entry</button>} />
        <div className="field-row" style={{ marginBottom: 14, flexWrap: 'wrap' }}>
          <select className="kb-input" value={taxYearFilter} onChange={(e) => { setTaxYearFilter(Number(e.target.value)); setTaxTxnShowCount(30); }}>

            <button
              className={`btn btn-small ${taxNeedsReviewOnly ? 'btn-primary' : 'btn-outline'}`}
              onClick={() => { setTaxNeedsReviewOnly((v) => !v); setTaxTxnShowCount(30); }}
              title="Only show transactions where the category was a low-confidence guess, not a clear pattern match"
            >
              <AlertTriangle size={13} /> {taxNeedsReviewOnly ? 'Showing' : 'Needs review'} ({guessCountThisYear})
            </button>
          )}
        </div>
        <div className="stat-grid" style={{ marginBottom: 18 }}>
          <StatCard label="Income (this filter)" value={fmt(income)} icon={TrendingUp} tone="green" />
          <StatCard label="Deductible (this filter)" value={fmt(deductible)} icon={CreditCard} tone="steel" />
        </div>
        {filtered.length === 0 ? <EmptyState text={taxTransactions.length === 0 ? 'No transactions yet — import a statement or add one manually.' : 'No transactions match this filter.'} /> : (
          <>
          <div className="grid-scroll">
          <table className="history-table">
            <thead><tr><th>Date</th><th>Source</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
            <tbody>
              {visible.map((t) => (
                <tr key={t.id}>
                  <td className="kb-mono">{new Date(t.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</td>

                  <td>{t.description}</td>

                    <select className="kb-input" style={{ padding: '5px 8px', fontSize: 12.5 }} value={t.category} onChange={(e) => updateTaxTxnCategory(t.id, e.target.value)}>

                    )}
                  </td>
                  <td className="kb-mono" style={{ color: t.amount >= 0 ? 'var(--green)' : 'var(--brick)' }}>{t.amount >= 0 ? '+' : '−'}{fmt(Math.abs(t.amount))}</td>

                    <div className="tab-entry-actions">

            </button>
          )} />

          const items = alerts.filter((a) => a.group === g);
          if (items.length === 0) return null;
          return (
            <div key={g} className="panel" style={{ marginBottom: 16 }}>
              <div className="panel-title-row">
                <div className="panel-title">{g} <span className="tag-ink" style={{ fontSize: 11.5 }}>{items.length}</span></div>
                <button className="link-btn" onClick={() => setDismissed((d) => [...d, ...items.map((a) => a.id)])}>Clear group</button>
              </div>
              <ul className="alert-list">
                {items.map((a) => (
                  <li key={a.id} className={`alert-row sev-${a.severity} ${a.target ? 'alert-row-clickable' : ''}`}
                    onClick={a.target ? () => goToAlert(a) : undefined}

                    <AlertTriangle size={15} />
                    <span>{a.text}</span>

              </ul>
            </div>
          );
        })}
      </>

      {clientStatementDoc && (
        <ClientStatementModal
          client={clientStatementDoc}
          invoices={invoices}
          receipts={receipts}
          creditNotes={creditNotes}
          settings={settings}
          fmt={fmt}
          onClose={() => setClientStatementDoc(null)}
          shareImageToWhatsApp={shareImageToWhatsApp}
        />
      )}
      {contributorStatementDoc && (
        <ContributorStatementModal
          member={contributorStatementDoc}
          plans={plans}
          contributions={contributions}
          settings={settings}
          fmt={fmt}
          onClose={() => setContributorStatementDoc(null)}
          downloadNodeAsPdf={downloadNodeAsPdf}
          shareImageToWhatsApp={shareImageToWhatsApp}
        />
      )}
      {invoiceSummaryDoc && (
        <SummaryReportModal doc={invoiceSummaryDoc} settings={settings} fmt={fmt} onClose={() => setInvoiceSummaryDoc(null)} downloadNodeAsPdf={downloadNodeAsPdf} />
      )}
      {receiptSummaryDoc && (
        <SummaryReportModal doc={receiptSummaryDoc} settings={settings} fmt={fmt} onClose={() => setReceiptSummaryDoc(null)} downloadNodeAsPdf={downloadNodeAsPdf} />
      )}
      {biodataDoc && (
        <BiodataDocModal doc={biodataDoc} settings={settings} fmt={fmt} onClose={() => setBiodataDoc(null)} shareImageToWhatsApp={shareImageToWhatsApp} />
      )}
      {invoiceDoc && (
        <InvoiceDocModal
          invoice={invoiceDoc}
          client={clientById(invoiceDoc.clientId)}
          settings={settings}
          fmt={fmt}
          onClose={() => setInvoiceDoc(null)}
          onMarkPaid={(id) => { markInvoicePaid(id); setInvoiceDoc((d) => d ? { ...d, status: 'paid', paidDate: todayISO() } : d); }}
          shareToWhatsApp={shareToWhatsApp}
          shareImageToWhatsApp={shareImageToWhatsApp}
          message={invoiceMessage(invoiceDoc)}
          receipts={receipts}
          creditNotes={creditNotes}
          onIssueCreditNote={(inv) => openModal('newCreditNote', { invoiceId: inv.id, date: todayISO() })}
          onOpenCreditNote={(cn) => setCreditNoteDoc(cn)}
          onEditInvoice={(inv) => { setInvoiceDoc(null); editInvoice(inv); }}
          onIssueInvoice={(id) => { issueInvoice(id); setInvoiceDoc((d) => d ? { ...d, status: 'sent' } : d); }}
          onVoidInvoice={(id) => { setInvoiceDoc(null); voidInvoice(id); }}
          onRestoreInvoice={(id) => { restoreInvoice(id); setInvoiceDoc((d) => d ? { ...d, status: 'sent', voidedAt: null } : d); }}
        />
      )}
      {modal === 'newCreditNote' && (() => {
        const inv = invoiceById(form.invoiceId);
        const c = inv ? clientById(inv.clientId) : null;
        const remaining = inv ? invoiceNetTotal(inv) : 0;
        return (
          <Modal title="Issue credit note" onClose={closeModal}>
            {inv ? (
              <div className="field-hint" style={{ marginBottom: 14 }}>
                Against invoice <strong>{inv.number}</strong>{c ? ` — ${c.name}` : ''}. Currently {fmt(remaining)} outstanding.
                This creates a separate document that reduces the balance owed — the invoice itself stays unchanged.
              </div>
            ) : (
              <div className="field-hint" style={{ marginBottom: 14 }}>Could not find that invoice.</div>
            )}
            <div className="field-row">
              <div className="field"><label>Amount to credit</label>
                <input type="number" min="0" inputMode="decimal" className="kb-input" value={form.amount || ''} onChange={(e) => setField('amount', e.target.value)} placeholder="5000" autoFocus />
              </div>
              <div className="field"><label>Date</label>
                <input type="date" className="kb-input" value={form.date || todayISO()} onChange={(e) => setField('date', e.target.value)} />
              </div>
            </div>
            <div className="field"><label>Reason</label>
              <input className="kb-input" value={form.reason || ''} onChange={(e) => setField('reason', e.target.value)} placeholder="e.g. Returned item, billing error, goodwill discount" />
            </div>
            <button className="btn btn-primary" onClick={submitCreditNote} disabled={!inv}>Issue credit note</button>
          </Modal>
        );
      })()}
      {paymentReceiptDoc && (
        <PaymentReceiptModal
          receiptDoc={paymentReceiptDoc}
          client={clientById(paymentReceiptDoc.clientId)}
          invoice={paymentReceiptDoc.invoiceId ? invoiceById(paymentReceiptDoc.invoiceId) : null}
          settings={settings}
          fmt={fmt}
          onClose={() => setPaymentReceiptDoc(null)}
          shareToWhatsApp={shareToWhatsApp}
          shareImageToWhatsApp={shareImageToWhatsApp}
          onEditReceipt={(r) => { setPaymentReceiptDoc(null); editReceipt(r); }}
          onIssueReceipt={(id) => { issueReceipt(id); setPaymentReceiptDoc((d) => d ? { ...d, status: 'issued' } : d); }}
        />
      )}
      {creditNoteDoc && (
        <CreditNoteDocModal
          creditNoteDoc={creditNoteDoc}
          client={clientById(creditNoteDoc.clientId)}
          invoice={creditNoteDoc.invoiceId ? invoiceById(creditNoteDoc.invoiceId) : null}
          settings={settings}
          fmt={fmt}
          onClose={() => setCreditNoteDoc(null)}
          shareImageToWhatsApp={shareImageToWhatsApp}
          onVoidCreditNote={(id) => { setCreditNoteDoc(null); voidCreditNote(id); }}
          onRestoreCreditNote={(id) => { restoreCreditNote(id); setCreditNoteDoc((d) => d ? { ...d, voided: false, voidedAt: null } : d); }}
        />
      )}
      {taxReturnDoc && (
        <TaxReturnDocModal
          taxReturn={taxReturnDoc}
          settings={settings}
          fmt={fmt}
          onClose={() => setTaxReturnDoc(null)}
          onMarkFiled={markTaxReturnFiled}
        />
      )}
      {reminderDoc && (
        <ReminderDocModal
          reminderDoc={reminderDoc}
          settings={settings}
          fmt={fmt}
          onClose={advanceReminderQueue}
          queueRemaining={reminderQueue.length}
          shareImageToWhatsApp={shareImageToWhatsApp}
        />
      )}
      {newAccountKeyModal && (
        <Modal title="Save your account key" onClose={() => setNewAccountKeyModal(null)}>
          <div className="panel-sub" style={{ marginBottom: 12 }}>
            This key is tied to your account's email and password. Keep it — along with an exported backup — so you can bring this account to a new device. You can view it anytime from Settings.
          </div>
          <div className="kb-input kb-mono" style={{ padding: '10px 12px', wordBreak: 'break-all', marginBottom: 12 }}>{newAccountKeyModal}</div>
          <div className="settings-actions">
            <button className="btn btn-outline btn-small" onClick={() => {
              if (navigator.clipboard) { navigator.clipboard.writeText(newAccountKeyModal); flash('Account key copied.'); }
            }}><Copy size={14} /> Copy key</button>
            <button className="btn btn-primary" onClick={() => setNewAccountKeyModal(null)}>I've saved it</button>
          </div>
        </Modal>
      )}
      {contribPrompt && (
        <Modal title="Enter amount paid" onClose={() => setContribPrompt(null)}>
          <div className="field-hint" style={{ marginBottom: 14 }}>
            {memberById(contribPrompt.memberId)?.name} — {periodLabel(contribPrompt.period, contribPrompt.frequency)}
          </div>
          <div className="field-row">
            <div className="field">
              <label>Amount</label>
              <input type="number" min="0" inputMode="decimal" className="kb-input" autoFocus
                value={contribAmountInput} onChange={(e) => setContribAmountInput(e.target.value)}
                placeholder={contribPrompt.defaultAmount ? String(contribPrompt.defaultAmount) : '0'}
                onKeyDown={(e) => { if (e.key === 'Enter') document.getElementById('contrib-prompt-submit')?.click(); }} />
            </div>
            <div className="field">
              <label>Date paid</label>
              <input type="date" className="kb-input" max={todayISO()}
                value={contribDateInput || todayISO()} onChange={(e) => setContribDateInput(e.target.value)} />
            </div>
          </div>
          <button id="contrib-prompt-submit" className="btn btn-primary" onClick={() => {
            const amt = Number(contribAmountInput || contribPrompt.defaultAmount || 0);
            if (!amt) { flash('Enter an amount, or close this window.'); return; }
            toggleContribution(contribPrompt.planId, contribPrompt.memberId, contribPrompt.period, amt, contribDateInput || todayISO());
            setContribPrompt(null);
          }}>Mark paid</button>
        </Modal>
      )}
      {periodTotalPrompt && (() => {
        const plan = planById(periodTotalPrompt.planId);
        if (!plan) return null;
        const period = periodTotalPrompt.period;
        const periodContribs = contributions.filter((c) => c.planId === plan.id && c.period === period);
        const total = periodContribs.reduce((s, c) => s + Number(c.amount || 0), 0);
        const paidIds = new Set(periodContribs.map((c) => c.memberId));
        const paidCount = plan.memberIds.filter((id) => paidIds.has(id)).length;
        return (
          <Modal title="Round total" onClose={() => setPeriodTotalPrompt(null)}>
            <div className="field-hint" style={{ marginBottom: 14 }}>
              {plan.name} — {periodLabel(period, plan.frequency)}
            </div>
            <div className="period-total-amount kb-display kb-mono">{fmt(total)}</div>
            <div className="panel-sub" style={{ marginBottom: 14 }}>
              {paidCount} of {plan.memberIds.length} contributor(s) paid this round
            </div>
            {periodContribs.length === 0 ? (
              <EmptyState text="No contributions recorded for this round yet." />
            ) : (
              <div className="period-total-list">
                {plan.memberIds.map((memberId) => {
                  const c = periodContribs.find((x) => x.memberId === memberId);
                  return (
                    <div key={memberId} className="doc-line">
                      <span>{memberById(memberId)?.name}</span>
                      <span className="kb-mono">{c ? fmt(c.amount) : '—'}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </Modal>
        );
      })()}
      {historyOpen && (
        <Modal title="Activity log" onClose={() => setHistoryOpen(false)}>
          <div className="panel-sub" style={{ marginBottom: 14 }}>
            Your last {undoStack.length} change{undoStack.length === 1 ? '' : 's'} on this device. Undoing an older entry also undoes anything more recent than it.
          </div>
          {undoStack.length === 0 ? (
            <EmptyState text="No changes yet to undo." />
          ) : (
            <ul className="history-log-list">
              {[...undoStack].reverse().map((entry, i) => (
                <li key={entry.id} className="history-log-row">
                  <div className="history-log-info">
                    <div className="history-log-label">{entry.label}</div>
                    <div className="history-log-time kb-mono">{timeAgo(entry.ts)}</div>
                  </div>
                  <button className="btn btn-small btn-outline" onClick={() => undoAction(entry.id)}>
                    <RotateCcw size={13} /> {i === 0 ? 'Undo' : 'Undo to here'}
                  </button>
                </li>
              ))}
            </ul>
          )}
        </Modal>
      )}
      {confirmDialog && (
        <div className="modal-backdrop" onClick={() => { setConfirmDialog(null); setConfirmTypedText(''); }}>
          <div className="modal-card confirm-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3 className="kb-display">{confirmDialog.danger ? 'Are you sure?' : 'Please confirm'}</h3>
              <button className="icon-btn" onClick={() => { setConfirmDialog(null); setConfirmTypedText(''); }} title="Close" aria-label="Close"><X size={18} /></button>
            </div>
            <div className="modal-body">
              <p className="panel-sub" style={{ marginBottom: confirmDialog.requireText ? 12 : 22, lineHeight: 1.5 }}>{confirmDialog.message}</p>
              {confirmDialog.requireText && (
                <div className="field" style={{ marginBottom: 12 }}>
                  <label>Type <strong>{confirmDialog.requireText}</strong> to confirm</label>
                  <input className="kb-input" autoFocus value={confirmTypedText} onChange={(e) => setConfirmTypedText(e.target.value)} placeholder={confirmDialog.requireText} />
                </div>
              )}
              <div className="settings-actions">
                <button
                  className={confirmDialog.danger ? 'btn btn-danger' : 'btn btn-primary'}
                  disabled={confirmDialog.requireText ? confirmTypedText.trim() !== confirmDialog.requireText : false}
                  onClick={() => { const fn = confirmDialog.onConfirm; setConfirmDialog(null); setConfirmTypedText(''); fn && fn(); }}
                >
                  {confirmDialog.danger ? <Trash2 size={15} /> : <CheckCircle2 size={15} />} {confirmDialog.confirmLabel}
                </button>
                <button className="btn btn-outline" onClick={() => { setConfirmDialog(null); setConfirmTypedText(''); }}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('PocketLedger crashed:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ fontFamily: 'system-ui, sans-serif', maxWidth: 420, margin: '15vh auto', padding: 24, textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 8 }}>⚠️</div>
          <div style={{ fontSize: 17, fontWeight: 600, marginBottom: 8 }}>Something went wrong</div>
          <div style={{ fontSize: 13.5, color: '#666', marginBottom: 18 }}>
            This screen hit an unexpected error and couldn't continue. Your saved data hasn't been touched — reloading should bring you back to normal.
          </div>
          <button onClick={() => window.location.reload()} style={{ background: '#111', color: '#fff', border: 'none', borderRadius: 8, padding: '10px 18px', fontSize: 14, cursor: 'pointer' }}>
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>

<script>
if ('serviceWorker' in navigator) {
    let swRefreshing = false;
    // Reload once when a new service worker takes control, to pick up the update.
    navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
    });

    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
            // Check for updates right away, then periodically.
            reg.update();
            setInterval(() => reg.update(), 60 * 60 * 1000);
        }).catch((err) => {
            console.warn('PocketLedger: service worker registration failed.', err);
        });
    });
}
</script>
</body>
</html>
