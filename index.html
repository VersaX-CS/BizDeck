function completeImportWithCredentials(){
  const importForm = state.importForm || {};
  const password = importForm.password || "";
  const data = state.modal?.data;
  
  if(!data || !data.license) {
    showToast("Import data is missing", "error");
    return;
  }
  
  const email = (data.license.email || "").trim().toLowerCase();
  
  if(!email || !password) {
    showToast("Please enter your password", "error");
    return;
  }
  
  // Validate credentials against the license
  const enteredHash = simpleHash(email + password);
  if(enteredHash !== data.license.keyHash) {
    showToast("Incorrect password for this account", "error");
    return;
  }
  
  // Restore which business vertical this account was set up as (Tailoring,
  // Restaurant, etc). Older backups made before this field existed fall
  // back to "others" so the person can still get into the app; they can
  // switch the vertical again if it's wrong.
  state.businessCategory = (data.businessCategory && CATEGORY_CONFIG[data.businessCategory]) ? data.businessCategory : "others";
  state.pendingCategory = null;
  state.universalAccess = !!data.universalAccess;
  persistBusinessCategory();
  persistUniversalAccess();

  // Restore businesses registry if available, otherwise create from legacy data
  if(data.businesses && Array.isArray(data.businesses) && data.businesses.length){
    state.businesses = data.businesses;
    state.activeBusinessId = (data.activeBusinessId && state.businesses.some(b=>b.id===data.activeBusinessId)) ? data.activeBusinessId : state.businesses[0].id;
    loadRealDataFromStorage();
  } else {
    // Legacy format: create a single business entry from flat data
    const entry = {
      id: uid(), 
      category: state.businessCategory || "others",
      business: data.business || { name: data.accountName || "My Business", phone:"", address:"", currency:"₦", regNumber:"", bankAccounts:[], logo:null },
      clients: data.clients || [],
      orders: data.orders || [],
      catalogue: data.catalogue || { categories: [], items: [] },
      inventory: data.inventory || { items:[], movements:[] },
      vendors: data.vendors || [],
      expenses: data.expenses || [],
    };
    state.businesses = [entry];
    state.activeBusinessId = entry.id;
    loadRealDataFromStorage();
  }
  
  if(data.theme) state.theme = data.theme;
  if(typeof data.darkMode !== 'undefined') state.darkMode = data.darkMode;
  if(data.customThemeColors) state.customThemeColors = data.customThemeColors;
  
  state.account = { 
    email: email, 
    password: password,
    name: data.accountName || "User"
  };
  
  // Restore auth with same credentials
  state.auth = {
    email: email,
    keyHash: enteredHash,
    accessKey: data.license.accessKey || generateAccessKey(),
    created: data.license.created
  };
  
  // Persist everything
  persistClients(); persistOrders(); persistCatalogue(); persistBusiness();
  persistAccount(); persistAuth();
  if(state.inventory) persistInventory();
  if(state.vendors) persistVendors();
  if(state.expenses) persistExpenses();
  persistCreditNotes();
  
  // Set auth state
  state.authed = true;
  state.viewOnly = false;
  state.authMode = "signin";
  state.modal = null;
  state.importForm = null;
  
  showToast("Account restored successfully!", "success");
  render();
}
const AUTO_BACKUP_INTERVALS = { daily:1, weekly:7, monthly:30 };
function nextAutoBackupDate(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled) return null;
  const days = AUTO_BACKUP_INTERVALS[bs.frequency] || 7;
  const base = bs.lastBackupAt ? new Date(bs.lastBackupAt) : new Date();
  return new Date(base.getTime() + days*24*60*60*1000);
}
function autoBackupStatusText(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled) return "Off — a backup file will only be created when you tap Export.";
  const next = nextAutoBackupDate();
  const freqLabel = {daily:"Daily",weekly:"Weekly",monthly:"Monthly"}[bs.frequency] || "Weekly";
  return freqLabel+" · next backup around "+fmtDateTime(next)+(bs.lastBackupAt ? " (last: "+fmtDateTime(new Date(bs.lastBackupAt))+")" : "");
}
// Runs on every render while signed in. Cheap date comparison; only does real
// work (an export + persist) on the rare render where a backup is actually due,
// and updates lastBackupAt in memory immediately so it won't re-trigger on the
// next render before the debounced persist() write lands.
function checkAutoBackup(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled || state.viewOnly || !state.authed) return;
  const days = AUTO_BACKUP_INTERVALS[bs.frequency] || 7;
  const last = bs.lastBackupAt ? new Date(bs.lastBackupAt) : null;
  const now = new Date();
  if(!last || (now - last) >= days*24*60*60*1000){
    try{ exportBackup(); }catch(e){}
    if(state.cloudBackup && state.cloudBackup.connected && state.cloudBackup.autoSync){
      backupToCloudFolder(true).catch(()=>{});
    }
    bs.lastBackupAt = now.toISOString();
    persistBackupSettings();
  }
}

// Wipes every persisted key and reloads, so the app comes back up exactly
// as it would on a brand-new install. Cancels any debounced persist()
// writes first so nothing re-populates localStorage after it's cleared.
function resetAppToDefault(){
  Object.keys(persistTimers).forEach(k => clearTimeout(persistTimers[k]));
  try{ localStorage.clear(); }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}
  window.location.reload();
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{
      data = JSON.parse(reader.result);
      if(!data || typeof data !== "object") throw new Error("bad file");
    }catch(e){
      showAlertDialog("Couldn't read that file. Make sure it's a BizDeck backup exported from this app.");
      return;
    }
    askConfirm({
      title: "Import this backup?",
      body: "This will replace all clients, orders, catalogue, stock, vendors, expenses and settings currently on this device.",
      confirmLabel: "Import", danger: true,
      onConfirm: () => {
        try{
          if(Array.isArray(data.clients)) state.clients = data.clients;
          if(Array.isArray(data.orders)) state.orders = data.orders;
          if(data.catalogue && typeof data.catalogue === "object") state.catalogue = data.catalogue;
          if(data.inventory && typeof data.inventory === "object") state.inventory = data.inventory;
          if(Array.isArray(data.vendors)) state.vendors = data.vendors;
          if(Array.isArray(data.expenses)) state.expenses = data.expenses;
          if(Array.isArray(data.creditNotes)) state.creditNotes = data.creditNotes;
          if(data.business && typeof data.business === "object") state.business = Object.assign({}, state.business, data.business);
          if(!state.business.bankAccounts) state.business.bankAccounts = [];
          if(data.customThemeColors) state.customThemeColors = data.customThemeColors;
          state.darkMode = !!data.darkMode;
          if(data.theme) applyTheme(data.theme); else applyTheme(state.theme||"indigo");
          persistClients(); persistOrders(); persistCatalogue(); persistInventory(); persistVendors(); persistExpenses(); persistCreditNotes(); persistBusiness(); persist("theme", state.theme||"indigo");
          persist("darkMode", state.darkMode); if(state.customThemeColors) persist("customThemeColors", state.customThemeColors);
          state.activeCategoryId = state.catalogue.categories[0] ? state.catalogue.categories[0].id : null;
          render();
          showAlertDialog("Backup imported successfully.");
        }catch(e){
          showAlertDialog("Couldn't read that file. Make sure it's a BizDeck backup exported from this app.");
        }
      }
    });
  };
  reader.readAsText(file);
}

document.addEventListener("input", (e) => {
  const bindEl = e.target.closest("[data-bind]");
  if(bindEl){
    const path = bindEl.getAttribute("data-bind");
    if(state.viewOnly && !path.startsWith("authForm.")){ showViewOnlyToast(); e.target.value = getPath(state, path) || ""; return; }
    setPath(state, path, e.target.value);
    if(path.startsWith("business.")) persistBusiness();
    if(path === "business.signature.text"){
      const preview = document.getElementById("sigTypedPreview");
      if(preview) preview.textContent = e.target.value;
      else render();
    }
    if(/^modal\.draft\.items\.\d+\.price$/.test(path) || path==="modal.draft.discountValue" || path==="modal.draft.taxPercent") updateOrderTotalsInline();
    if(path === "modal.draft.amount"){
      // Update save button state in place instead of a full re-render,
      // which was dropping the on-screen keyboard on every keystroke.
      const btn = document.getElementById("modalSaveBtn");
      if(btn) btn.disabled = !(Number(e.target.value) > 0);
    }
    if(path === "modal.draft.name"){
      const btn = document.getElementById("modalSaveBtn");
      if(btn) btn.disabled = !e.target.value.trim();
    }
    return;
  }
  if(e.target.matches('[data-action="input-new-category"]')){ state.newCategoryName = e.target.value; return; }
  if(e.target.matches('[data-action="search-clients"]')){
    state.clientSearch = e.target.value;
    const grid = document.getElementById("clientsGrid");
    if(grid){
      const q = state.clientSearch.toLowerCase();
      const filtered = state.clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone||"").includes(q));
      grid.innerHTML = clientCardsHtml(filtered);
    }
    return;
  }
  if(e.target.matches('[data-action="search-orders"]')){
    state.orderSearch = e.target.value;
    const wrap = document.getElementById("ordersListWrap");
    if(wrap) wrap.innerHTML = orderCardsHtml(filteredSortedOrders());
    return;
  }
  if(e.target.matches('[data-action="set-order-date-from"]')){ state.orderDateFrom = e.target.value; render(); return; }
  if(e.target.matches('[data-action="set-order-date-to"]')){ state.orderDateTo = e.target.value; render(); return; }
  if(e.target.matches('[data-action="search-catalogue"]')){
    state.catalogueSearch = e.target.value;
    const wrap = document.getElementById("catalogueItemsWrap");
    if(wrap) wrap.innerHTML = catalogueResultsHtml();
    return;
  }
  if(e.target.matches('[data-action="search-inventory"]')){
    state.inventorySearch = e.target.value;
    const wrap = document.getElementById("inventoryItemsWrap");
    if(wrap) wrap.innerHTML = inventoryItemsHtml();
    return;
  }
  if(e.target.matches('[data-action="global-search-input"]')){ state.globalSearchQ = e.target.value; 
    // Update search results without full render to preserve keyboard state
    const resultsDiv = document.getElementById("globalSearchResults");
    if(resultsDiv){
      const q = state.globalSearchQ.toLowerCase();
      if(q.length < 2){
        resultsDiv.innerHTML = '<div class="empty">Type at least 2 characters to search across everything.</div>';
      } else {
        const clientResults = state.clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone||"").includes(q)).slice(0,8);
        const orderResults = state.orders.filter(o => {
          const client = state.clients.find(c=>c.id===o.clientId);
          return (o.title||"").toLowerCase().includes(q) || (client && client.name.toLowerCase().includes(q)) || (o.notes||"").toLowerCase().includes(q);
        }).slice(0,8);
        const itemResults = state.catalogue.items.filter(i => i.name.toLowerCase().includes(q) || (i.description||"").toLowerCase().includes(q)).slice(0,8);
        
        let html = '';
        if(clientResults.length) html += '<div style="padding:10px 0;"><div style="font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">'+nounFor("clientPlural")+'</div>' + clientResults.map(c => '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-client" data-id="'+c.id+'">'+esc(c.name)+'</div>').join('') + '</div>';
        if(orderResults.length) html += '<div style="padding:10px 0;"><div style="font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">'+nounFor("recordPlural")+'</div>' + orderResults.map(o => { const client = state.clients.find(c=>c.id===o.clientId); return '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-order" data-id="'+o.id+'"><span>'+esc(client?client.name:"Unknown")+' — '+esc(o.title||"Order")+'</span><span class="pill '+statusClass(o.status)+'" style="font-size:10px;">'+o.status+'</span></div>'; }).join('') + '</div>';
        if(itemResults.length) html += '<div style="padding:10px 0;"><div style="font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">'+nounFor("catalogue")+'</div>' + itemResults.map(it => '<div class="rowline" style="cursor:pointer;" data-action="global-search-goto-item" data-id="'+it.id+'">'+esc(it.name)+'</div>').join('') + '</div>';
        if(!clientResults.length && !orderResults.length && !itemResults.length) html = '<div class="empty">No results found.</div>';
        resultsDiv.innerHTML = html;
      }
    }
    return;
  }
});
function updateOrderTotalsInline(){
  if(!state.modal || state.modal.type!=="order") return;
  const o = state.modal.draft, business = state.business;
  const sub = orderSubtotal(o), discount = orderDiscountAmount(o), tax = orderTaxAmount(o);
  const total = orderTotal(o), paid = orderPaid(o), bal = total-paid;
  const sEl=document.getElementById("ordSubVal"), dEl=document.getElementById("ordDiscVal"), xEl=document.getElementById("ordTaxVal");
  const tEl=document.getElementById("ordTotalVal"), pEl=document.getElementById("ordPaidVal"), bEl=document.getElementById("ordBalanceVal");
  if(sEl) sEl.textContent = money(sub, business.currency);
  if(dEl) dEl.textContent = "-"+money(discount, business.currency);
  if(xEl) xEl.textContent = money(tax, business.currency);
  if(tEl) tEl.textContent = money(total, business.currency);
  if(pEl) pEl.textContent = money(paid, business.currency);
  if(bEl){ bEl.textContent = money(bal, business.currency); bEl.style.color = bal>0 ? "var(--rust)" : "var(--green)"; }
}

document.addEventListener("change", (e) => {
  if(e.target.matches('[data-action="toggle-policy-understand"]')){
    state.policyChecks.understand = e.target.checked; render(); return;
  }
  if(e.target.matches('[data-action="toggle-policy-accept"]')){
    state.policyChecks.accept = e.target.checked; render(); return;
  }
  if(e.target.matches('[data-action="toggle-auto-backup"]')){
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.backupSettings.enabled; return; }
    state.backupSettings.enabled = e.target.checked;
    // Start the interval fresh from now rather than immediately firing a
    // backup the moment it's turned on.
    state.backupSettings.lastBackupAt = new Date().toISOString();
    persistBackupSettings();
    render();
    return;
  }
  if(e.target.matches('[data-action="toggle-cloud-auto-sync"]')){
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.cloudBackup.autoSync; return; }
    state.cloudBackup.autoSync = e.target.checked;
    persistCloudBackup();
    render();
    return;
  }
  if(e.target.matches('[data-action="toggle-portfolio-prices"]')){
    if(!state.portfolioSettings) state.portfolioSettings = { showPrices:true };
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.portfolioSettings.showPrices!==false; return; }
    state.portfolioSettings.showPrices = e.target.checked;
    persistPortfolioSettings();
    render();
    return;
  }
  if(e.target.matches('[data-action="toggle-dark-mode"]')){
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.darkMode; return; }
    toggleDarkMode(e.target.checked);
    render();
    return;
  }
  if(e.target.matches('[data-action="toggle-signature-invoice"]')){
    if(!state.business.signature) state.business.signature = { mode:"draw", image:null, text:"", font:"Dancing Script", showOnInvoice:true, showOnReceipt:true };
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.business.signature.showOnInvoice!==false; return; }
    state.business.signature.showOnInvoice = e.target.checked;
    persistBusiness(); render();
    return;
  }
  if(e.target.matches('[data-action="toggle-signature-receipt"]')){
    if(!state.business.signature) state.business.signature = { mode:"draw", image:null, text:"", font:"Dancing Script", showOnInvoice:true, showOnReceipt:true };
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.business.signature.showOnReceipt!==false; return; }
    state.business.signature.showOnReceipt = e.target.checked;
    persistBusiness(); render();
    return;
  }
  if(e.target.matches('[data-action="toggle-order-recurring"]')){
    if(!state.modal || !state.modal.draft) return;
    if(!state.modal.draft.recurring) state.modal.draft.recurring = { enabled:false, frequency:"monthly", intervalDays:30, nextDate:"" };
    state.modal.draft.recurring.enabled = e.target.checked;
    if(state.modal.draft.recurring.enabled && !state.modal.draft.recurring.nextDate){
      state.modal.draft.recurring.nextDate = state.modal.draft.dueDate || advanceRecurringDate(todayISO(), state.modal.draft.recurring);
    }
    render();
    return;
  }
  const bindEl = e.target.closest("[data-bind]");
  if(bindEl && bindEl.hasAttribute("data-rerender")){
    const path = bindEl.getAttribute("data-bind");
    if(state.viewOnly && !path.startsWith("authForm.")){ showViewOnlyToast(); render(); return; }
    setPath(state, path, e.target.value);
    if(path.startsWith("backupSettings.")) persistBackupSettings();
    render();
    return;
  }
  if(state.viewOnly && e.target.matches('[data-action]') && MUTATING_CHANGE_ACTIONS.has(e.target.getAttribute("data-action"))){
    showViewOnlyToast();
    e.target.value = "";
    return;
  }
  if(e.target.matches('[data-action="import-data-file"]')){
    const f = e.target.files && e.target.files[0];
    if(f) importBackup(f);
    e.target.value = "";
    return;
  }
  if(e.target.matches('[data-action="import-from-file"]')){
    const f = e.target.files && e.target.files[0];
    if(f) importFromFile(f);
    e.target.value = "";
    return;
  }
  if(e.target.matches('[data-action="upload-logo"]')){
    const f = e.target.files && e.target.files[0];
    if(f){ resizeImage(f, 300, 0.82).then(url => { state.business.logo = url; persistBusiness(); render(); }); }
    return;
  }
  if(e.target.matches('[data-action="upload-signature-image"]')){
    const f = e.target.files && e.target.files[0];
    if(f){
      if(!state.business.signature) state.business.signature = { mode:"draw", image:null, text:"", font:"Dancing Script", showOnInvoice:true, showOnReceipt:true };
      resizeImage(f, 400, 0.85).then(url => {
        state.business.signature.image = url;
        state.business.signature.mode = "draw";
        state.sigRedrawing = false;
        persistBusiness(); render();
      });
    }
    return;
  }
  if(e.target.matches('[data-action="upload-images"]')){
    const target = e.target.getAttribute("data-target");
    const files = Array.from(e.target.files||[]);
    Promise.all(files.map(f=>resizeImage(f))).then(urls=>{
      const arr = getPath(state, target);
      urls.forEach(u=>arr.push(u));
      render();
    });
    return;
  }
  if(e.target.matches('[data-action="upload-gallery-images"]')){
    const catId = e.target.getAttribute("data-cat");
    const files = Array.from(e.target.files||[]);
    Promise.all(files.map(f=>resizeImage(f, 640, 0.75))).then(urls=>{
      const cat = state.catalogue.categories.find(c=>c.id===catId);
      if(cat){ urls.forEach(u=>cat.gallery.push(u)); persistCatalogue(); }
      render();
    });
    return;
  }
});

/* ================= PULL TO REFRESH ================= */
function ensurePullIndicator(){
  let el = document.getElementById("pullRefreshIndicator");
  if(!el){
    el = document.createElement("div");
    el.id = "pullRefreshIndicator";
    el.style.cssText = "position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:56px;transform:translateY(-56px);z-index:9998;pointer-events:none;";
    el.innerHTML = '<div style="width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:var(--primary-text);">'+
      '<span id="pullArrow" style="display:flex;transition:transform .1s;">'+icon("refresh",16)+'</span></div>';
    document.body.appendChild(el);
  }
  return el;
}
function initPullToRefresh(){
  const THRESHOLD = 70, MAX_PULL = 110;
  let startY = 0, pulling = false, dragged = 0, refreshing = false;

  function contentEl(){ return document.getElementById("content"); }
  function blocked(){ return refreshing || state.modal || state.lightbox || state.tour; }

  document.addEventListener("touchstart", (e) => {
    if(blocked() || e.touches.length!==1){ pulling=false; return; }
    const sc = contentEl();
    const atTop = !sc || sc.scrollTop <= 0;
    pulling = atTop;
    startY = e.touches[0].clientY;
    dragged = 0;
  }, {passive:true});

  document.addEventListener("touchmove", (e) => {
    if(!pulling || blocked()) return;
    const sc = contentEl();
    const atTop = !sc || sc.scrollTop <= 0;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && atTop){
      dragged = Math.min(dy*0.5, MAX_PULL);
      const el = ensurePullIndicator();
      el.style.transition = "none";
      el.style.transform = "translateY("+(dragged-56)+"px)";
      const arrow = document.getElementById("pullArrow");
      if(arrow) arrow.style.transform = "rotate("+Math.min(dragged/THRESHOLD,1)*220+"deg)";
    } else {
      pulling = false;
    }
  }, {passive:true});

  document.addEventListener("touchend", () => {
    if(!pulling) return;
    pulling = false;
    const el = ensurePullIndicator();
    el.style.transition = "transform .2s";
    if(dragged >= THRESHOLD){
      refreshing = true;
      el.style.transform = "translateY(8px)";
      const arrow = document.getElementById("pullArrow");
      if(arrow) arrow.style.animation = "spin .6s linear infinite";
      setTimeout(() => { window.location.reload(); }, 200);
    } else {
      el.style.transform = "translateY(-56px)";
    }
    dragged = 0;
  }, {passive:true});
}
initPullToRefresh();

loadAll();

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service worker registered successfully.', reg);
          // Check for a newer sw.js every time the app is opened.
          reg.update().catch(() => {});
          // If a new worker is already waiting, activate it now.
          if (reg.waiting) reg.waiting.postMessage('skipWaiting');
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller){
                nw.postMessage('skipWaiting');
              }
            });
          });
        })
        .catch((err) => console.log('Service worker registration failed:', err));

      // Once the new service worker takes control, reload once so the
      // page itself (not just cached assets) is the latest version.
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
