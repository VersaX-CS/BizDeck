<script>
/* PocketLedger PWA install helper */
let pocketLedgerInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  pocketLedgerInstallPrompt = event;
  window.dispatchEvent(new CustomEvent('pocketledger-install-ready'));
});

window.pocketLedgerInstall = async function () {
  if (!pocketLedgerInstallPrompt) return false;
  pocketLedgerInstallPrompt.prompt();
  const result = await pocketLedgerInstallPrompt.userChoice;
  pocketLedgerInstallPrompt = null;
  return result.outcome === 'accepted';
};

window.addEventListener('appinstalled', () => {
  pocketLedgerInstallPrompt = null;
  console.log('PocketLedger installed as a standalone PWA.');
});
</script>

// Persists the backup folder handle in IndexedDB (localStorage can't store it).
const IDB_DB = 'pocketledger-fs', IDB_STORE = 'handles', IDB_KEY = 'backupDir';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetHandle() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbClearHandle() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

// Hashes a password with SHA-256 before it's ever stored or compared — the app has no
// server, so this is client-side hashing (not salted/peppered like a real backend would do),
// but it means the raw password is never written to localStorage or an exported backup.
async function hashPassword(password) {
  const enc = new TextEncoder().encode(String(password));
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}
// Generates a random per-account key at signup, tied to that account's email + password.
// Shown once at signup and viewable (show/hide) from Settings — it travels with the
// account inside an exported backup so the account can be identified on a new device.
function generateAccountKey() {
  const groups = Array.from(crypto.getRandomValues(new Uint32Array(4)))
    .map((n) => n.toString(36).toUpperCase().padStart(4, '0').slice(-4));
  return `PL-${groups.join('-')}`;
}

  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}
function dateFieldForKey(key) {
  return key === 'repayments' ? 'dateGiven' : 'dateReceived';
}
function accruedOf(item, key) {
  const rate = Number(item.interestRate || 0);
  if (!rate) return 0;
  const dateField = dateFieldForKey(key);
  const days = Math.max(0, Math.floor((new Date(todayISO()) - new Date(item[dateField])) / dayMs));
  return item.principal * (rate / 100) * (days / 365);
}
function paidOf(item, key) {
  return (item[key] || []).reduce((s, r) => s + Number(r.amount || 0), 0);
}
function totalOwedOf(item, key) {
  return item.principal + accruedOf(item, key);
}
function outstandingOf(item, key) {
  return Math.max(0, totalOwedOf(item, key) - paidOf(item, key));
}
function loanStatus(item, key) {
  const out = outstandingOf(item, key);
  if (out <= 0) return 'completed';
  if (daysFromToday(item.dueDate) < 0) return 'overdue';
  if (daysFromToday(item.dueDate) <= 7) return 'due-soon';
  return 'active';
}

function planColor(plan) { return (plan && plan.color) || PLAN_COLORS[0]; }
function cyclePot(plan) {
  if (plan.perMemberAmounts) return (plan.memberIds || []).reduce((s, id) => s + Number((plan.memberAmounts || {})[id] ?? plan.amount ?? 0), 0);
  return Number(plan.amount || 0) * (plan.memberIds || []).length;
}
function cycleRoundsDone(plan) { return (plan.payouts || []).length; }
function cycleComplete(plan) { return (plan.memberIds || []).length > 0 && cycleRoundsDone(plan) >= plan.memberIds.length; }
function cyclePayoutsTotal(payouts) { return (payouts || []).reduce((s, po) => s + Number(po.amount || 0), 0); }
// Cycle payout order; falls back to join order and stays in sync with membership.
function cyclePayoutOrder(plan) {
  const saved = (plan.payoutOrder && plan.payoutOrder.length) ? plan.payoutOrder : (plan.memberIds || []);
  const kept = saved.filter((id) => (plan.memberIds || []).includes(id));
  const missing = (plan.memberIds || []).filter((id) => !kept.includes(id));
  return [...kept, ...missing];
}
function cycleCurrentRecipientId(plan) {
  if (cycleComplete(plan)) return null;
  // Next recipient = earliest unpaid person in the order, not a fixed index.
  const paidIds = new Set((plan.payouts || []).map((p) => p.memberId));
  return cyclePayoutOrder(plan).find((id) => !paidIds.has(id)) || null;
}

function shareNodeImageToWhatsApp(elementId, filename, waHref) {
  const node = document.getElementById(elementId);
  if (!node || !window.html2canvas) { window.open(waHref, '_blank'); return; }
  window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 16 }).then((canvas) => {
    canvas.toBlob((blob) => {
      if (!blob) { window.open(waHref, '_blank'); return; }
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(() => {});
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      window.open(waHref, '_blank');
    }, 'image/png');
  }).catch(() => window.open(waHref, '_blank'));
}

// Nigeria Tax Act 2025 bands/rates — estimate only, not tax advice.
const PIT_BANDS = [
  { upTo: 800000, rate: 0 },
  { upTo: 3000000, rate: 0.15 },
  { upTo: 12000000, rate: 0.18 },
  { upTo: 25000000, rate: 0.21 },
  { upTo: 50000000, rate: 0.23 },
  { upTo: Infinity, rate: 0.25 },
];
function calcPIT(chargeableIncome) {
  let remaining = Math.max(0, Number(chargeableIncome) || 0);
  let lastCap = 0;
  let total = 0;
  const breakdown = [];
  for (const band of PIT_BANDS) {
    const width = band.upTo - lastCap;
    const taxableInBand = Math.min(remaining, width);
    if (taxableInBand > 0) {
      const tax = taxableInBand * band.rate;
      total += tax;
      breakdown.push({ from: lastCap, to: band.upTo === Infinity ? null : band.upTo, rate: band.rate, amount: taxableInBand, tax });
      remaining -= taxableInBand;
    }
    lastCap = band.upTo;
    if (remaining <= 0) break;
  }
  return { total, breakdown };
}
function calcRentRelief(rentPaidAnnual) {
  return Math.min(500000, 0.2 * (Number(rentPaidAnnual) || 0));
}
// Small companies are CIT/CGT/levy-exempt; standard rate is 30% CIT + 4% levy.
function calcCIT({ turnover, fixedAssets, assessableProfit }) {
  const isSmall = (Number(turnover) || 0) <= 100000000 && (Number(fixedAssets) || 0) <= 250000000;
  const profit = Math.max(0, Number(assessableProfit) || 0);
  if (isSmall) return { isSmall: true, cit: 0, levy: 0, total: 0 };
  const cit = profit * 0.30;
  const levy = profit * 0.04;
  return { isSmall: false, cit, levy, total: cit + levy };
}

// Splits a delimited line, respecting quoted fields.
function splitDelimitedLine(line, delim) {
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === delim && !inQuotes) {
      out.push(cur); cur = '';
    } else cur += ch;
  }
  out.push(cur);
  return out.map((s) => s.trim());
}
function parseMoneyString(raw) {
  if (raw === undefined || raw === null) return NaN;
  let s = String(raw).trim();
  if (!s) return NaN;
  let negative = false;
  if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
  if (/^-/.test(s)) { negative = true; }
  if (/^\+/.test(s)) { s = s.slice(1); }
  s = s.replace(/[^\d.]/g, '');
  if (!s) return NaN;
  const n = parseFloat(s);
  if (isNaN(n)) return NaN;
  return negative ? -n : n;
}
function parseStatementDate(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  // dd/mm/yyyy or dd-mm-yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  // yyyy-mm-dd already
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return '';
}

  type: ['type', 'transaction type', 'dr/cr', 'dr cr'],
};
function matchHeader(header) {
  const h = header.toLowerCase().trim();
  for (const key of Object.keys(HEADER_SYNONYMS)) {
    if (HEADER_SYNONYMS[key].some((syn) => h === syn || h.includes(syn))) return key;
  }
  return null;
}
// Normalises bank statement rows into { date, description, amount }, handling common layouts.
function parseBankStatementRows(rows) {
  if (rows.length < 2) return { rows: [], errors: ['File looks empty or has no data rows.'] };
  const headerCells = (rows[0] || []).map((c) => (c === undefined || c === null) ? '' : String(c));
  const colMap = {};
  headerCells.forEach((h, i) => { const key = matchHeader(h); if (key && !(key in colMap)) colMap[key] = i; });
  if (colMap.date === undefined || colMap.description === undefined) {
    return { rows: [], errors: ['Could not find Date and Description/Narration columns. Make sure the first row is a header row.'] };
  }
  const out = [];
  const errors = [];
  for (let i = 1; i < rows.length; i++) {
    const cells = (rows[i] || []).map((c) => (c === undefined || c === null) ? '' : String(c));
    if (cells.every((c) => !c.trim())) continue;
    const date = parseStatementDate(cells[colMap.date]);
    const description = (cells[colMap.description] || '').trim();
    let amount = NaN;
    if (colMap.debit !== undefined || colMap.credit !== undefined) {
      const debit = parseMoneyString(cells[colMap.debit]);
      const credit = parseMoneyString(cells[colMap.credit]);
      if (!isNaN(credit) && credit !== 0) amount = Math.abs(credit);
      else if (!isNaN(debit) && debit !== 0) amount = -Math.abs(debit);
      else amount = 0;
    } else if (colMap.amount !== undefined) {
      const raw = parseMoneyString(cells[colMap.amount]);
      if (colMap.type !== undefined) {
        const t = (cells[colMap.type] || '').toLowerCase();
        amount = /dr|debit|out/.test(t) ? -Math.abs(raw) : Math.abs(raw);
      } else {
        amount = raw;
      }
    }
    if (!date || !description || isNaN(amount)) { errors.push(`Row ${i + 1}: couldn't read this line, skipped.`); continue; }
    out.push({ date, description, amount });
  }
  return { rows: out, errors };
}

// Scans the first few rows for the real header (some exports have banner rows above it).
function parseBankStatementRowsWithHeaderScan(rows, maxScan) {
  const limit = Math.min(maxScan || 15, Math.max(rows.length - 1, 0));
  let lastResult = { rows: [], errors: ['Could not find a Date and Description/Narration column.'] };
  for (let start = 0; start <= limit; start++) {
    const result = parseBankStatementRows(rows.slice(start));
    if (result.rows.length > 0) return result;
    lastResult = result;
  }
  return lastResult;
}

// Splits raw delimited text into rows, auto-detecting the delimiter.
function toRowsFromText(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length === 0) return [];
  const firstLine = lines[0];
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length
    ? ';' : (firstLine.includes('\t') ? '\t' : ',');
  return lines.map((l) => splitDelimitedLine(l, delim));
}

// Reads an Excel workbook, trying each sheet until one auto-parses cleanly.
// Parses a 2D grid of rows (from CSV/Excel/PDF) shaped like a thrift contribution sheet:
// first column = member name, remaining columns = one per round, cell = amount paid (blank/0 = unpaid).
// This is also exactly the shape produced by this app's own "Export contributions" CSV, so a
// previously exported plan round-trips cleanly back in.
function parseThriftGridRows(rows) {
  const nonEmpty = (r) => r.some((c) => String(c || '').trim());
  const headerIdx = rows.findIndex((r) => nonEmpty(r) && r.length > 1);
  if (headerIdx === -1) return { members: [], periodCount: 0, suggestedAmount: '', suggestedFrequency: 'monthly', suggestedStartDate: '', fixedAmount: true };
  const header = rows[headerIdx];
  const periodLabels = header.slice(1);
  const members = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !nonEmpty(row)) continue;
    const name = String(row[0] || '').trim();
    if (!name) continue;
    const amounts = periodLabels.map((_, j) => {
      const n = parseMoneyString(row[j + 1]);
      return isNaN(n) ? 0 : Math.abs(n);
    });
    // This member's own most common non-zero amount on the sheet — used as their
    // exact recorded amount when the plan turns out not to use one flat figure for everyone.
    const ownCounts = {};
    amounts.forEach((a) => { if (a > 0) ownCounts[a] = (ownCounts[a] || 0) + 1; });
    const ownKeys = Object.keys(ownCounts);
    const typicalAmount = ownKeys.length ? Number(ownKeys.sort((a, b) => ownCounts[b] - ownCounts[a])[0]) : 0;
    members.push({ name, amounts, include: true, typicalAmount });
  }
  // Best-effort: parse the first couple of period labels as dates to guess a start date and cadence.
  const parsedDates = periodLabels.map((l) => parseStatementDate(l)).filter(Boolean);
  let suggestedStartDate = parsedDates[0] || '';
  let suggestedFrequency = 'monthly';
  if (parsedDates.length >= 2) {
    const gapDays = Math.round((new Date(parsedDates[1]) - new Date(parsedDates[0])) / 86400000);
    if (gapDays <= 2) suggestedFrequency = 'daily';
    else if (gapDays <= 10) suggestedFrequency = 'weekly';
    else suggestedFrequency = 'monthly';
  }
  // Most common non-zero amount across every cell, as a sensible default round amount.
  const counts = {};
  members.forEach((m) => m.amounts.forEach((a) => { if (a > 0) counts[a] = (counts[a] || 0) + 1; }));
  const suggestedAmount = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || '';
  // The sheet only reflects one fixed amount if every contributor's own typical amount
  // matches it (contributors with no paid rounds yet don't count against it either way).
  const fixedAmount = members.every((m) => m.typicalAmount === 0 || String(m.typicalAmount) === String(suggestedAmount));
  return { members, periodCount: periodLabels.length, suggestedAmount, suggestedFrequency, suggestedStartDate, fixedAmount };
}
// Generates exactly `count` period dates from a start date at a given cadence, matching the
// exact date math periodsForPlan uses (so imported contributions line up with the plan's own
// grid afterward) — but driven by a fixed count instead of "how much time has elapsed".
function periodsForCount(startDate, frequency, count) {
  const start = new Date(startDate); start.setHours(0, 0, 0, 0);
  const arr = [];
  if (frequency === 'monthly') {
    for (let i = 0; i < count; i++) arr.push(addMonthsClamped(start, i).toISOString().slice(0, 10));
  } else {
    const stepDays = frequency === 'weekly' ? 7 : 1;
    for (let i = 0; i < count; i++) arr.push(new Date(start.getTime() + i * stepDays * dayMs).toISOString().slice(0, 10));
  }
  return arr;
}
// When a plan's start date is edited, every round shifts with it. Contributions are keyed
// by their exact due-date `period`, so each recorded contribution's period is re-anchored to
// the new start date at the same round index it was originally recorded against — a monthly
// round is matched by month offset (so day-of-month clamping stays consistent), daily/weekly
// rounds by a constant day offset (both starts move by the same number of days).
function remapPeriodToNewStart(period, oldStart, newStart, frequency) {
  const os = new Date(oldStart); os.setHours(0, 0, 0, 0);
  const ns = new Date(newStart); ns.setHours(0, 0, 0, 0);
  const p = new Date(period); p.setHours(0, 0, 0, 0);
  if (frequency === 'monthly') {
    const monthIndex = (p.getFullYear() - os.getFullYear()) * 12 + (p.getMonth() - os.getMonth());
    return addMonthsClamped(ns, monthIndex).toISOString().slice(0, 10);
  }
  const dayOffset = Math.round((ns - os) / dayMs);
  return new Date(p.getTime() + dayOffset * dayMs).toISOString().slice(0, 10);
}
function excelRowsForImport(workbook) {
  let autoResult = null;
  let rawRows = [];
  for (const sheetName of workbook.SheetNames) {
    const sheet = workbook.Sheets[sheetName];
    if (!sheet) continue;
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    if (aoa.length > rawRows.length) rawRows = aoa;
    if (!autoResult) {
      const result = parseBankStatementRowsWithHeaderScan(aoa, 15);
      if (result.rows.length > 0) autoResult = { result, rawRows: aoa };
    }
  }
  return { autoResult: autoResult ? autoResult.result : null, rawRows: autoResult ? autoResult.rawRows : rawRows };
}

// Reconstructs table rows from a PDF's text-item positions. Empty for scanned PDFs.
async function pdfRowsFromArrayBuffer(arrayBuffer) {
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items
      .filter((it) => (it.str || '').trim().length > 0)
      .slice()
      .sort((a, b) => (b.transform[5] - a.transform[5]) || (a.transform[4] - b.transform[4]));
    let lineItems = [];
    let lineY = null;
    const flushLine = () => {
      if (!lineItems.length) return;
      lineItems.sort((a, b) => a.transform[4] - b.transform[4]);
      let line = '';
      let lastEnd = null;
      lineItems.forEach((it) => {
        const x = it.transform[4];
        if (lastEnd !== null && x - lastEnd > 8) line += '\t';
        else if (line && !line.endsWith(' ')) line += ' ';
        line += it.str;
        lastEnd = x + (it.width || it.str.length * 4);
      });
      if (line.trim()) lines.push(line);
      lineItems = [];
    };
    items.forEach((it) => {
      const y = it.transform[5];
      if (lineY === null || Math.abs(y - lineY) > 3) { flushLine(); lineY = y; }
      lineItems.push(it);
    });
    flushLine();
  }
  return lines.map((l) => splitDelimitedLine(l, '\t'));
}

// OCR fallback for scanned PDFs; slow, so only runs when requested.
async function ocrPdfRows(arrayBuffer, onPageProgress) {
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const lines = [];
  const worker = await Tesseract.createWorker('eng');
  try {
    const pageCount = Math.min(pdf.numPages, 15); // cap pages so this can't run indefinitely
    for (let p = 1; p <= pageCount; p++) {
      if (onPageProgress) onPageProgress(p, pageCount);
      const page = await pdf.getPage(p);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const { data } = await worker.recognize(canvas);
      const words = (data.words || []).filter((w) => (w.text || '').trim().length > 0);
      words.sort((a, b) => a.bbox.y0 - b.bbox.y0 || a.bbox.x0 - b.bbox.x0);
      let lineWords = [];
      let lineY = null;
      const flushLine = () => {
        if (!lineWords.length) return;
        lineWords.sort((a, b) => a.bbox.x0 - b.bbox.x0);
        let line = '';
        let lastEnd = null;
        lineWords.forEach((w) => {
          if (lastEnd !== null && w.bbox.x0 - lastEnd > 20) line += '\t';
          else if (line) line += ' ';
          line += w.text;
          lastEnd = w.bbox.x1;
        });
        if (line.trim()) lines.push(line);
        lineWords = [];
      };
      words.forEach((w) => {
        const yCenter = (w.bbox.y0 + w.bbox.y1) / 2;
        if (lineY === null || Math.abs(yCenter - lineY) > 12) { flushLine(); lineY = yCenter; }
        lineWords.push(w);
      });
      flushLine();
    }
  } finally {
    await worker.terminate();
  }
  const rawRows = lines.map((l) => splitDelimitedLine(l, '\t'));
  const autoResult = parseBankStatementRowsWithHeaderScan(rawRows, 20);
  return { rawRows, autoResult };
}

// Builds rows from manually-picked columns, for statements the auto-detector couldn't read.
function buildRowsFromManualMap(dataRows, colMap) {
  const out = [];
  const errors = [];
  for (let i = 0; i < dataRows.length; i++) {
    const cells = (dataRows[i] || []).map((c) => (c === undefined || c === null) ? '' : String(c));
    if (cells.every((c) => !c.trim())) continue;
    const date = parseStatementDate(cells[colMap.date]);
    const description = (cells[colMap.description] || '').trim();
    let amount = NaN;
    if (colMap.mode === 'debitCredit') {
      const debit = parseMoneyString(cells[colMap.debit]);
      const credit = parseMoneyString(cells[colMap.credit]);
      if (!isNaN(credit) && credit !== 0) amount = Math.abs(credit);
      else if (!isNaN(debit) && debit !== 0) amount = -Math.abs(debit);
      else amount = 0;
    } else {
      const raw = parseMoneyString(cells[colMap.amount]);
      if (colMap.type !== undefined && !isNaN(colMap.type)) {
        const t = (cells[colMap.type] || '').toLowerCase();
        amount = /dr|debit|out/.test(t) ? -Math.abs(raw) : Math.abs(raw);
      } else {
        amount = raw;
      }
    }
    if (!date || !description || isNaN(amount)) { errors.push(`Row ${i + 1}: couldn't read this line, skipped.`); continue; }
    out.push({ date, description, amount });
  }
  return { rows: out, errors };
}

function useEscClose(onClose) {

    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
}
function Modal({ title, onClose, children, className }) {
  useEscClose(onClose);
  const bodyRef = useRef(null);
  useEffect(() => {
    // Move focus into the form on mount, for keyboard users.
    const t = setTimeout(() => {
      const el = bodyRef.current && bodyRef.current.querySelector('input, select, textarea, button');
      if (el) el.focus();
    }, 30);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className={`modal-card${className ? ` ${className}` : ''}`} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">

        </div>
        <div className="modal-body" ref={bodyRef}>{children}</div>
      </div>
    </div>
  );
}

// Self-contained calculator pad: standard four-function logic plus memory and a
// reusable history, so it feels at home whether it's docked in a modal or a panel.
function CalculatorPad() {
  const [display, setDisplay] = useState('0');
  const [prevValue, setPrevValue] = useState(null);
  const [operator, setOperator] = useState(null);
  const [waiting, setWaiting] = useState(false);
  const [memory, setMemory] = useState(0);
  const [history, setHistory] = useState([]);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [flash, setFlash] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => { if (wrapRef.current) wrapRef.current.focus(); }, 30);
    return () => clearTimeout(t);
  }, []);

  const fmt = (n) => {
    if (n === null || n === undefined || !isFinite(n)) return 'Error';
    let rounded = Math.round((n + Number.EPSILON) * 1e9) / 1e9;
    let s = rounded.toString();
    if (s.replace('-', '').replace('.', '').length > 14) s = rounded.toExponential(6);
    return s;
  };
  const withCommas = (s) => {
    if (s === 'Error' || s === undefined) return s || '0';
    const neg = s.startsWith('-');
    const body = neg ? s.slice(1) : s;
    const [int, dec] = body.split('.');
    const intCommas = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + intCommas + (dec !== undefined ? '.' + dec : '');
  };
  const calc = (a, b, op) => {
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  };

  const inputDigit = (d) => {
    if (display === 'Error') { setDisplay(d === '.' ? '0.' : d); setWaiting(false); return; }
    if (waiting) { setDisplay(d === '.' ? '0.' : d); setWaiting(false); return; }
    if (d === '.') { if (!display.includes('.')) setDisplay(display + '.'); return; }
    if (display.replace('-', '').replace('.', '').length >= 14) return;
    setDisplay(display === '0' ? d : display + d);
  };
  const inputPercent = () => {
    const v = parseFloat(display);
    if (isNaN(v)) return;
    setDisplay(fmt(operator && prevValue !== null ? (prevValue * v) / 100 : v / 100));
    setWaiting(false);
  };
  const toggleSign = () => {
    if (display === '0' || display === 'Error') return;
    setDisplay(display.startsWith('-') ? display.slice(1) : '-' + display);
  };
  const backspace = () => {
    if (waiting || display === 'Error') return;
    if (display.length <= 1 || (display.length === 2 && display.startsWith('-'))) { setDisplay('0'); return; }
    setDisplay(display.slice(0, -1));
  };
  const clearAll = () => { setDisplay('0'); setPrevValue(null); setOperator(null); setWaiting(false); };
  const applyOperator = (nextOp) => {
    const inputValue = parseFloat(display);
    if (display === 'Error' || isNaN(inputValue)) return;
    if (operator && !waiting) {
      const result = calc(prevValue, inputValue, operator);
      setDisplay(fmt(result));
      setPrevValue(result);
    } else {
      setPrevValue(inputValue);
    }
    setOperator(nextOp);
    setWaiting(true);
  };
  const equals = () => {
    if (operator === null || prevValue === null || display === 'Error') return;
    const inputValue = parseFloat(display);
    const result = calc(prevValue, inputValue, operator);
    const expr = `${withCommas(fmt(prevValue))} ${operator} ${withCommas(fmt(inputValue))}`;
    setHistory((h) => [{ expr, result: fmt(result) }, ...h].slice(0, 30));
    setDisplay(fmt(result));
    setPrevValue(null);
    setOperator(null);
    setWaiting(true);
  };
  const flashMem = () => { setFlash(true); setTimeout(() => setFlash(false), 650); };
  const memClear = () => setMemory(0);
  const memRecall = () => { setDisplay(fmt(memory)); setWaiting(true); };
  const memAdd = () => { const v = parseFloat(display); if (!isNaN(v)) setMemory((m) => m + v); flashMem(); };
  const memSub = () => { const v = parseFloat(display); if (!isNaN(v)) setMemory((m) => m - v); flashMem(); };
  const useHistoryEntry = (h) => { setDisplay(h.result); setWaiting(true); setPrevValue(null); setOperator(null); };

  const handleKey = (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { inputDigit(k); return; }
    if (k === '.') { inputDigit('.'); return; }
    if (k === '+') { applyOperator('+'); return; }
    if (k === '-') { applyOperator('−'); return; }
    if (k === '*') { applyOperator('×'); return; }
    if (k === '/') { e.preventDefault(); applyOperator('÷'); return; }
    if (k === '%') { inputPercent(); return; }
    if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); return; }
    if (k === 'Backspace') { backspace(); return; }
    if (k.toLowerCase() === 'c') { clearAll(); return; }
  };

  const Key = ({ label, onClick, variant }) => (
    <button type="button" className={`calc-key${variant ? ` calc-key-${variant}` : ''}`} onClick={onClick}>{label}</button>
  );

  return (
    <div className="calc-widget" ref={wrapRef} tabIndex={0} onKeyDown={handleKey}>
      <style>{`
        .calc-widget{outline:none;user-select:none;}
        .calc-display-wrap{background:var(--ink);border-radius:12px;padding:16px 16px 14px;margin-bottom:12px;position:relative;}
        .calc-expr{font-size:12px;color:rgba(255,255,255,0.55);min-height:16px;text-align:right;font-family:'IBM Plex Mono',monospace;}
        .calc-display{font-size:34px;font-weight:600;color:#fff;text-align:right;font-family:'IBM Plex Mono',monospace;line-height:1.25;word-break:break-all;}
        .calc-mem-badge{position:absolute;left:16px;top:16px;font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:1px 5px;}
        .calc-mem-row{display:flex;gap:6px;margin-bottom:10px;}
        .calc-mem-btn{flex:1;background:var(--surface-2);border:1px solid var(--paper-line);color:var(--ink-soft);font-size:11.5px;font-weight:700;border-radius:8px;padding:7px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;}
        .calc-mem-btn:hover{background:var(--paper-line);}
        .calc-mem-btn-active{color:var(--ink);background:var(--paper-line);}
        .calc-mem-flash{color:var(--green);border-color:var(--green);}
        .calc-history{background:var(--surface-2);border:1px solid var(--paper-line);border-radius:10px;padding:8px;margin-bottom:10px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
        .calc-history-empty{font-size:12px;color:var(--ink-soft);padding:8px;text-align:center;}
        .calc-history-row{display:flex;flex-direction:column;align-items:flex-end;background:none;border:none;border-radius:7px;padding:6px 8px;cursor:pointer;text-align:right;font-family:inherit;}
        .calc-history-row:hover{background:var(--paper-line);}
        .calc-history-expr{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
        .calc-history-result{font-size:14.5px;font-weight:700;color:var(--ink);font-family:'IBM Plex Mono',monospace;}
        .calc-history-clear{align-self:center;margin-top:4px;background:none;border:none;color:var(--brick);font-size:11.5px;font-weight:600;cursor:pointer;padding:4px 8px;}
        .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
        .calc-key{aspect-ratio:1;border-radius:10px;border:1px solid var(--paper-line);background:var(--surface);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .06s,background .12s;font-family:'IBM Plex Mono',monospace;}
        .calc-key:hover{background:var(--surface-2);}
        .calc-key:active{transform:scale(0.94);}
        .calc-key-func{background:var(--surface-2);color:var(--ink-soft);font-size:14px;}
        .calc-key-op{background:var(--paper);color:var(--ink);font-size:20px;font-weight:700;}
        .calc-key-equals{background:var(--ink);color:#fff;font-size:20px;}
        .calc-key-equals:hover{opacity:0.9;background:var(--ink);}
      `}</style>
      <div className="calc-display-wrap">
        {memory !== 0 && <span className="calc-mem-badge">M</span>}
        <div className="calc-expr">{operator && prevValue !== null ? `${withCommas(fmt(prevValue))} ${operator}` : '\u00A0'}</div>
        <div className="calc-display">{withCommas(display)}</div>
      </div>
      <div className="calc-mem-row">
        <button type="button" className="calc-mem-btn" onClick={memClear} title="Memory clear">MC</button>
        <button type="button" className="calc-mem-btn" onClick={memRecall} title="Memory recall">MR</button>
        <button type="button" className={`calc-mem-btn${flash ? ' calc-mem-flash' : ''}`} onClick={memAdd} title="Memory add">M+</button>
        <button type="button" className={`calc-mem-btn${flash ? ' calc-mem-flash' : ''}`} onClick={memSub} title="Memory subtract">M−</button>
        <button type="button" className={`calc-mem-btn${historyOpen ? ' calc-mem-btn-active' : ''}`} onClick={() => setHistoryOpen((v) => !v)} title="History"><Clock size={13} /></button>
      </div>
      {historyOpen && (
        <div className="calc-history">
          {history.length === 0 && <div className="calc-history-empty">No calculations yet.</div>}
          {history.map((h, i) => (
            <button type="button" key={i} className="calc-history-row" onClick={() => useHistoryEntry(h)} title="Reuse this result">
              <span className="calc-history-expr">{h.expr} =</span>
              <span className="calc-history-result">{withCommas(h.result)}</span>
            </button>
          ))}
          {history.length > 0 && <button type="button" className="calc-history-clear" onClick={() => setHistory([])}>Clear history</button>}
        </div>
      )}
      <div className="calc-grid">
        <Key label="C" variant="func" onClick={clearAll} />
        <Key label={<Delete size={16} />} variant="func" onClick={backspace} />
        <Key label="%" variant="func" onClick={inputPercent} />
        <Key label="÷" variant="op" onClick={() => applyOperator('÷')} />
        <Key label="7" onClick={() => inputDigit('7')} />
        <Key label="8" onClick={() => inputDigit('8')} />
        <Key label="9" onClick={() => inputDigit('9')} />
        <Key label="×" variant="op" onClick={() => applyOperator('×')} />
        <Key label="4" onClick={() => inputDigit('4')} />
        <Key label="5" onClick={() => inputDigit('5')} />
        <Key label="6" onClick={() => inputDigit('6')} />
        <Key label="−" variant="op" onClick={() => applyOperator('−')} />
        <Key label="1" onClick={() => inputDigit('1')} />
        <Key label="2" onClick={() => inputDigit('2')} />
        <Key label="3" onClick={() => inputDigit('3')} />
        <Key label="+" variant="op" onClick={() => applyOperator('+')} />
        <Key label="+/−" variant="func" onClick={toggleSign} />
        <Key label="0" onClick={() => inputDigit('0')} />
        <Key label="." onClick={() => inputDigit('.')} />
        <Key label="=" variant="equals" onClick={equals} />
      </div>
    </div>
  );
}

// Canvas signature pad — draw with mouse or finger; each completed stroke is saved as a PNG data URL.
function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const lastRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !value) return;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = value;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const posFromEvent = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const clientX = t ? t.clientX : e.clientX;
    const clientY = t ? t.clientY : e.clientY;
    return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
  };
  const start = (e) => { e.preventDefault(); drawingRef.current = true; lastRef.current = posFromEvent(e); };
  const move = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const pos = posFromEvent(e);
    ctx.strokeStyle = '#1B2A4A'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lastRef.current.x, lastRef.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    lastRef.current = pos;
  };
  const end = () => {
    if (!drawingRef.current) return;
    drawingRef.current = false;
    onChange(canvasRef.current.toDataURL('image/png'));
  };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    onChange('');
  };

  return (
    <div>
      <canvas
        ref={canvasRef} width={340} height={120} className="signature-canvas"
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <button type="button" className="btn btn-ghost btn-small" style={{ marginTop: 6 }} onClick={clear}>Clear</button>
    </div>
  );
}

function ReceiptModal({ receipt, onClose, fmt, settings, planById, memberById, shareToWhatsApp, shareImageToWhatsApp }) {

    lines = [
      ['Payment date', new Date(payment.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['This payment', fmt(payment.amount)],
      ['divider', ''],
      ['Original principal', fmt(loan.principal)],
      ...(accrued > 0 ? [['Accrued interest', fmt(accrued)]] : []),
      ['Total paid to date', fmt(paidTotal)],
      ['Outstanding balance', fmt(outstanding)],
    ];
    waText = [
      `*${settings.businessName}* — ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `${billedLabel}: ${personName}`,
      `Amount: ${fmt(payment.amount)} on ${new Date(payment.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
      `Outstanding balance: ${fmt(outstanding)}`,
    ].join('\n');
  } else if (isCycle) {
    const { plan, payout } = receipt;
    const recipient = memberById(payout.memberId);
    personName = recipient ? recipient.name : 'Member';
    personPhone = recipient ? recipient.phone : '';
    title = 'Thrift Cycle Payout Receipt';
    billedLabel = 'Paid to';
    lines = [
      ['Plan', plan.name],
      ['Round', `${(plan.payouts || []).findIndex((p) => p.id === payout.id) + 1} of ${plan.memberIds.length}`],
      ['Payout date', new Date(payout.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['Amount paid out', fmt(payout.amount)],
    ];
    waText = [
      `*${settings.businessName}* — ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `Paid out to: ${personName}`,
      `Plan: ${plan.name}`,
      `Amount: ${fmt(payout.amount)} on ${new Date(payout.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
    ].join('\n');
  } else {
    const { member, contribution } = receipt;
    const plan = planById(contribution.planId);
    personName = member.name;
    personPhone = member.phone;
    title = 'Thrift Contribution Receipt';
    billedLabel = 'Contributor';
    lines = [
      ['Plan', plan ? plan.name : 'N/A'],
      ['Category', plan ? plan.category : ''],
      ['Payment date', new Date(contribution.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })],
      ['Amount', fmt(contribution.amount)],
    ];
    waText = [
      `*${settings.businessName}* — ${title}`, '',
      `Receipt No: ${receiptNo}`,
      `Contributor: ${personName}`,
      `Plan: ${plan ? plan.name : 'N/A'}`,
      `Amount: ${fmt(contribution.amount)} on ${new Date(contribution.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`,
    ].join('\n');
  }

  const downloadImage = () => {
    const node = document.getElementById('receipt-print-area');
    if (!node || !window.html2canvas) return;
    window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 16 }).then((canvas) => {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `receipt-${receiptNo}.png`; a.click();
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card receipt-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3 className="kb-display">{title}</h3>

        </div>

            <DocHeader settings={settings} />
            <div className="doc-title-row">

                <div className="doc-title-meta">Receipt No. {receiptNo} · {issuedOn}</div>
              </div>
              <div>
                <div className="doc-billed-label">{billedLabel}</div>
                <div className="doc-billed-name">{personName}</div>

            </div>
            <div>
              {lines.map(([label, value], i) => label === 'divider'
                ? <div key={i} className="doc-totals" />

function InvoiceDocModal({ invoice, client, settings, fmt, onClose, onMarkPaid, shareToWhatsApp, shareImageToWhatsApp, message, receipts, creditNotes, onIssueCreditNote, onOpenCreditNote, onEditInvoice, onIssueInvoice, onVoidInvoice, onRestoreInvoice }) {
  useEscClose(onClose);
  const status = invoiceStatusOf(invoice);
  const voided = status === 'void';
  const subtotal = invoiceSubtotal(invoice);
  const discountAmt = invoiceDiscountAmount(invoice);
  const vatAmt = invoiceVatAmount(invoice);
  const total = invoiceTotal(invoice);
  const issuedOn = new Date(invoice.issueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const dueOn = new Date(invoice.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const invoiceCreditNotes = (creditNotes || []).filter((cn) => cn.invoiceId === invoice.id);
  const credited = invoiceCreditNotes.filter((cn) => !cn.voided).reduce((s, cn) => s + Number(cn.amount || 0), 0);
  const netTotal = Math.max(0, total - credited);
  const paid = status === 'paid' ? netTotal : (receipts || []).filter((r) => r.invoiceId === invoice.id && !r.voided).reduce((s, r) => s + r.amount, 0);
  const balance = Math.max(0, netTotal - paid);
  const creditSettled = invoiceSettledByCreditOnly(invoice, receipts, creditNotes);

  const downloadImage = () => {
    const node = document.getElementById('receipt-print-area');
    if (!node || !window.html2canvas) return;
    window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 16 }).then((canvas) => {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `${invoice.number}.png`; a.click();
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card receipt-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3 className="kb-display">Invoice {invoice.number}</h3>
          <button className="icon-btn" onClick={onClose} title="Close" aria-label="Close"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="receipt-sheet" id="receipt-print-area" style={voided ? { position: 'relative' } : undefined}>
            {voided && <div className="doc-void-watermark">VOID</div>}
            <DocHeader settings={settings} />
            <div className="doc-title-row">
              <div>
                <div className="doc-title">Invoice</div>
                <div className="doc-title-meta">{invoice.number} · {issuedOn}</div>
              </div>
              <div>
                <div className="doc-billed-label">Billed to</div>
                <div className="doc-billed-name">{client ? client.name : ''}</div>
                {client?.address && <div className="doc-title-meta" style={{ textAlign: 'right' }}>{client.address}</div>}
              </div>
            </div>
            {(status === 'draft' || voided || status === 'paid') && (
              <div className="doc-line" style={{ marginBottom: 4 }}>
                <span><Stamp status={voided ? 'overdue' : status === 'paid' ? (creditSettled ? 'settled' : 'completed') : 'due-soon'} label={voided ? 'Void' : status === 'paid' ? (creditSettled ? 'Settled' : 'Paid') : 'Draft'} /></span>
                {voided && <span className="kb-mono">{invoice.voidedAt ? new Date(invoice.voidedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''}</span>}
              </div>
            )}
            <div>
              {invoice.items.map((it) => (
                <div key={it.id} className="doc-line"><span>{it.desc || 'Item'} ({it.qty} &times; {fmt(it.price)})</span><span className="kb-mono">{fmt(it.qty * it.price)}</span></div>
              ))}
            </div>
            {invoiceCreditNotes.length > 0 && (
              <div className="doc-items">
                {invoiceCreditNotes.map((cn) => (
                  <div key={cn.id} className="doc-line"><span>Credit note {cn.number}{cn.reason ? ` — ${cn.reason}` : ''}</span><span className="kb-mono">−{fmt(cn.amount)}</span></div>
                ))}
              </div>
            )}
            <div className="doc-totals">
              {(discountAmt > 0 || vatAmt > 0) && <div className="doc-total-row"><span>Subtotal</span><span className="kb-mono">{fmt(subtotal)}</span></div>}
              {discountAmt > 0 && <div className="doc-total-row"><span>Discount ({invoice.discountPercent}%)</span><span className="kb-mono">−{fmt(discountAmt)}</span></div>}
              {vatAmt > 0 && <div className="doc-total-row"><span>VAT ({invoice.vatPercent}%)</span><span className="kb-mono">+{fmt(vatAmt)}</span></div>}
              <div className="doc-total-row"><span>{(discountAmt > 0 || vatAmt > 0) ? 'Total' : 'Subtotal'}</span><span className="kb-mono">{fmt(total)}</span></div>
              {credited > 0 && <div className="doc-total-row"><span>Credited</span><span className="kb-mono">−{fmt(credited)}</span></div>}
              <div className="doc-total-row"><span>{creditSettled ? 'Settled (via credit)' : 'Paid'}</span><span className="kb-mono">{fmt(paid)}</span></div>
              <div className="doc-total-row balance"><span>Balance</span><span className="kb-mono">{fmt(balance)}</span></div>
            </div>
            <div className="doc-due">Due date: {dueOn}</div>
            <DocPayBox settings={settings} />
            {invoice.notes && <div className="receipt-footer">{invoice.notes}</div>}
            <DocSignature settings={settings} />
            <div className="doc-thanks">Thank you for your patronage!</div>
            <DocFooter settings={settings} />
          </div>
          {invoiceCreditNotes.length > 0 && (
            <div className="doc-credit-note-list">
              <div className="client-card-section-label">Credit notes issued</div>
              {invoiceCreditNotes.map((cn) => (
                <div key={cn.id} className="doc-credit-note-row" onClick={() => onOpenCreditNote(cn)} style={cn.voided ? { opacity: .55 } : undefined}>
                  <span>{cn.number}{cn.voided ? ' (voided)' : ''}</span>
                  <span className="kb-mono">{cn.voided ? '' : `−${fmt(cn.amount)}`}</span>
                  <ChevronRight size={14} className="chev" />
                </div>
              ))}
            </div>
          )}
          <div className="receipt-actions">
            {status === 'draft' && <button className="btn btn-outline btn-small" onClick={() => onEditInvoice(invoice)}><Edit3 size={14} /> Edit</button>}
            {status === 'draft' && <button className="btn btn-secondary btn-small" onClick={() => onIssueInvoice(invoice.id)}><Send size={14} /> Issue invoice</button>}
            {status !== 'paid' && status !== 'draft' && status !== 'void' && <button className="btn btn-secondary btn-small" onClick={() => onMarkPaid(invoice.id)}><CheckCircle2 size={14} /> Mark as paid</button>}
            {(status === 'sent' || status === 'overdue') && <button className="btn btn-outline btn-small" onClick={() => onVoidInvoice(invoice.id)}><Ban size={14} /> Void invoice</button>}
            {status === 'void' && <button className="btn btn-secondary btn-small" onClick={() => onRestoreInvoice(invoice.id)}><RotateCcw size={14} /> Restore</button>}
            {status !== 'draft' && status !== 'void' && <button className="btn btn-outline btn-small" onClick={() => onIssueCreditNote(invoice)}><FileMinus size={14} /> Issue credit note</button>}
            <button className="btn btn-outline btn-small" onClick={downloadImage}><ImageIcon size={14} /> Download image</button>
            <button className="btn btn-outline btn-small" onClick={() => window.print()}><Printer size={14} /> Print / Save PDF</button>
            <button className="btn btn-ghost btn-small" onClick={() => shareImageToWhatsApp(client?.phone, message, `${invoice.number}.png`)}><MessageCircle size={14} /> Share image on WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ClientStatementModal({ client, invoices, receipts, creditNotes, settings, fmt, onClose, shareImageToWhatsApp }) {
  useEscClose(onClose);
  const clientInvoices = invoices.filter((i) => i.clientId === client.id && i.status !== 'draft' && i.status !== 'void');
  const clientReceipts = receipts.filter((r) => r.clientId === client.id && !r.voided && r.status !== 'draft');
  const clientCreditNotes = creditNotes.filter((cn) => cn.invoiceId && clientInvoices.some((i) => i.id === cn.invoiceId) && !cn.voided);
  // One combined, chronological ledger — invoices raise the balance owed, receipts and
  // credit notes bring it down — so the running total always reflects what's actually
  // outstanding at each point, not just a tally of invoices in isolation.
  const events = [
    ...clientInvoices.map((i) => ({ date: i.issueDate, label: `Invoice ${i.number}`, amount: invoiceTotal(i) })),
    ...clientReceipts.map((r) => ({ date: r.date, label: `Receipt ${r.receiptNo}`, amount: -Number(r.amount || 0) })),
    ...clientCreditNotes.map((cn) => ({ date: cn.date, label: `Credit note ${cn.number}`, amount: -Number(cn.amount || 0) })),
  ].sort((a, b) => new Date(a.date) - new Date(b.date));
  let running = 0;
  const rows = events.map((e) => { running += e.amount; return { ...e, running }; });
  const totalInvoiced = clientInvoices.reduce((s, i) => s + invoiceTotal(i), 0);
  const totalReceived = clientReceipts.reduce((s, r) => s + Number(r.amount || 0), 0);
  const totalCredited = clientCreditNotes.reduce((s, cn) => s + Number(cn.amount || 0), 0);
  const balance = Math.max(0, totalInvoiced - totalReceived - totalCredited);
  const issuedOn = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  const downloadImage = () => {
    const node = document.getElementById('receipt-print-area');
    if (!node || !window.html2canvas) return;
    window.html2canvas(node, { backgroundColor: '#F7F3EA', scale: 16 }).then((canvas) => {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `statement-${client.name.replace(/\s+/g, '-').toLowerCase()}.png`; a.click();
    });
  };
  const waText = [
    `*${settings.businessName}* — Client Statement`, '',
    `Client: ${client.name}`, `As of: ${issuedOn}`, '',
    ...rows.map((r) => `${new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} — ${r.label}: ${r.amount < 0 ? '-' : ''}${fmt(Math.abs(r.amount))} (bal ${fmt(r.running)})`),
    '', `Balance outstanding: ${fmt(balance)}`,
  ].join('\n');

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card receipt-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3 className="kb-display">Statement — {client.name}</h3>
          <button className="icon-btn" onClick={onClose} title="Close" aria-label="Close"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div id="receipt-print-area" className="receipt-sheet">
            <DocHeader settings={settings} />
            <div className="doc-title-row">
              <div>
                <div className="doc-title">Client Statement</div>
                <div className="doc-title-meta">As of {issuedOn}</div>
              </div>
              <div>
                <div className="doc-billed-label">Client</div>
                <div className="doc-billed-name">{client.name}</div>
                {client.address && <div className="doc-title-meta" style={{ textAlign: 'right' }}>{client.address}</div>}
              </div>
            </div>
            {rows.length === 0 ? (
              <div className="panel-sub" style={{ marginTop: 10 }}>No invoices, receipts or credit notes on record for this client yet.</div>
            ) : (
              <div>
                {rows.map((r, i) => (
                  <div key={i} className="doc-line">
                    <span>{new Date(r.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} — {r.label}</span>
                    <span className="kb-mono">{r.amount < 0 ? '−' : ''}{fmt(Math.abs(r.amount))} · bal {fmt(r.running)}</span>
                  </div>
                ))}
              </div>
            )}
            <div className="doc-totals">
              <div className="doc-total-row"><span>Total invoiced</span><span className="kb-mono">{fmt(totalInvoiced)}</span></div>
              {totalCredited > 0 && <div className="doc-total-row"><span>Total credited</span><span className="kb-mono">−{fmt(totalCredited)}</span></div>}
              <div className="doc-total-row"><span>Total received</span><span className="kb-mono">−{fmt(totalReceived)}</span></div>
              <div className="doc-total-row balance"><span>Balance outstanding</span><span className="kb-mono">{fmt(balance)}</span></div>
            </div>
            <DocSignature settings={settings} />
            <DocFooter settings={settings} />
          </div>
          <div className="receipt-actions">
            <button className="btn btn-outline btn-small" onClick={downloadImage}><ImageIcon size={14} /> Download image</button>

            <button className="btn btn-ghost btn-small" onClick={() => shareImageToWhatsApp(client.phone, waText, `statement-${client.name.replace(/\s+/g, '-').toLowerCase()}.png`)}><MessageCircle size={14} /> Share image on WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ContributorStatementModal({ member, plans, contributions, settings, fmt, onClose, downloadNodeAsPdf, shareImageToWhatsApp }) {
  useEscClose(onClose);
  const memberContributions = contributions.filter((c) => c.memberId === member.id);
  const memberWithdrawals = plans.flatMap((p) => (p.withdrawals || [])
    .filter((w) => w.memberId === member.id)
    .map((w) => ({ ...w, planName: p.name })));
  const planName = (planId) => (plans.find((p) => p.id === planId) || {}).name || 'Thrift plan';
  // One combined, chronological ledger — contributions build the balance up, take-outs bring
  // it down — so the running total always reflects the member's actual savings at each point.
  const events = [
    ...memberContributions.map((c) => ({ date: c.date, label: `Contribution — ${planName(c.planId)}`, amount: Number(c.amount || 0) })),
    ...memberWithdrawals.map((w) => ({ date: w.date, label: `Take-out — ${w.planName}${w.note ? ` (${w.note})` : ''}`, amount: -Number(w.amount || 0) })),

  const totalContributed = memberContributions.reduce((s, c) => s + Number(c.amount || 0), 0);
  const totalWithdrawn = memberWithdrawals.reduce((s, w) => s + Number(w.amount || 0), 0);

}

function TourOverlay({ step, onNext, onBack, onClose }) {
  const info = TOUR_STEPS[step];
  const [rect, setRect] = useState(null);
  const lastRef = useRef(null);
  const scrolledRef = useRef(false);
  useEffect(() => {
    let raf = null;
    lastRef.current = null;
    // Reset per step for a fresh scroll-into-view check.
    scrolledRef.current = false;
    const measure = () => {
      // Re-queried every time; shows no box if the target isn't in the DOM yet.
      const el = document.querySelector(`[data-tour="${info.target}"]`);
      // Bring a scrolled-away target into view once per step.
      if (el && !scrolledRef.current) {
        scrolledRef.current = true;
        const r0 = el.getBoundingClientRect();
        const inView = r0.top >= 70 && r0.bottom <= window.innerHeight - 70 && r0.left >= 0 && r0.right <= window.innerWidth;
        if (!inView) el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      }
      const r = el ? el.getBoundingClientRect() : null;
      const last = lastRef.current;
      const changed = (!!r) !== (!!last) || (r && last && (
        r.top !== last.top || r.left !== last.left || r.width !== last.width || r.height !== last.height
      ));
      if (changed) {
        lastRef.current = r ? { top: r.top, left: r.left, width: r.width, height: r.height } : null;
        setRect(r);
      }
      raf = requestAnimationFrame(measure);
    };
    measure();
    window.addEventListener('resize', measure);
    window.addEventListener('scroll', measure, true);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', measure);
      window.removeEventListener('scroll', measure, true);
    };
  }, [step, info.target]);

  const pad = 8;
  const box = rect ? { top: rect.top - pad, left: rect.left - pad, width: rect.width + pad * 2, height: rect.height + pad * 2 } : null;
  const vh = window.innerHeight, vw = window.innerWidth;
  const cardTop = box ? (box.top + box.height + 168 < vh ? box.top + box.height + 14 : Math.max(14, box.top - 178)) : vh / 2 - 90;
  const cardLeft = box ? Math.min(Math.max(box.left, 16), vw - 296) : vw / 2 - 140;

  return (
    <div className="tour-overlay" onClick={onClose}>
      {box && <div className="tour-highlight" style={{ top: box.top, left: box.left, width: box.width, height: box.height }} />}
      <div className="tour-card" style={{ top: cardTop, left: cardLeft }} onClick={(e) => e.stopPropagation()}>
        <div className="tour-card-head">
          <span className="tour-step-count">{step + 1} / {TOUR_STEPS.length}</span>
          <button className="icon-btn" onClick={onClose} title="Close" aria-label="Close"><X size={16} /></button>
        </div>
        <div className="tour-card-title kb-display">{info.title}</div>
        <div className="tour-card-body">{info.body}</div>
        <div className="tour-card-actions">
          {step > 0 && <button className="btn btn-outline btn-small" onClick={onBack}>Back</button>}
          <button className="btn btn-primary btn-small" onClick={onNext}>{step === TOUR_STEPS.length - 1 ? 'Done' : 'Next'}</button>
        </div>
      </div>
    </div>
  );
}

function AuthScreen({ users, onLogin, onSignup, onImportBackup, flash }) {
  const [mode, setMode] = useState('login');
  const [showPw, setShowPw] = useState(false);
  const [showContact, setShowContact] = useState(false);
  const [fields, setFields] = useState({ name: '', businessName: '', email: '', password: '', accessKey: '' });
  const [fpBusy, setFpBusy] = useState(false);
  const [authError, setAuthError] = useState('');
  const autoFpTried = useRef(false);
  // ---------- import account on a new device (from an exported backup file) ----------
  const newDeviceInputRef = useRef(null);
  const [importFound, setImportFound] = useState(null); // { user, data }
  const [importPassword, setImportPassword] = useState('');
  const [showImportPw, setShowImportPw] = useState(false);
  const [importError, setImportError] = useState('');
  const triggerNewDeviceImport = () => newDeviceInputRef.current && newDeviceInputRef.current.click();
  const handleNewDeviceFile = (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.users || !data.users.length) throw new Error('no users in file');
        const user = data.users.find((u) => !u.isDemo) || data.users[0];
        setImportFound({ user, data });
        setImportPassword('');
        setImportError('');
      } catch (err) {
        flash('Could not read that file — is it a PocketLedger backup?');
      }
    };
    reader.readAsText(file);
  };
  const cancelImport = () => { setImportFound(null); setImportPassword(''); setImportError(''); };
  const confirmImport = async () => {
    if (!importPassword) { setImportError('Enter your password to confirm it\u2019s your account.'); return; }
    const hash = await hashPassword(importPassword);
    if (hash !== importFound.user.password) { setImportError('That password doesn\u2019t match this account.'); return; }
    onImportBackup(importFound.data, importFound.user);
  };
  const set = (k, v) => { setAuthError(''); setFields((f) => ({ ...f, [k]: v })); };
  const demoAvailable = users.some((u) => u.isDemo);
  const fingerprintAvailable = webauthnSupported() && users.some((u) => u.webauthnCredentialId);

  const handleFingerprintLogin = async () => {
    setFpBusy(true);
    const match = await verifyFingerprintCredential(users);
    setFpBusy(false);
    if (!match) { flash('Fingerprint sign-in didn\u2019t match any account on this device.'); return; }
    onLogin(match);
  };

  // As soon as the sign-in screen opens, prompt for a fingerprint automatically
  // (if this device has one enrolled) so the person can unlock without touching
  // the keyboard at all. Only tried once per screen visit — cancelling or failing
  // just leaves the normal email/password form and the button below available.
  // WebAuthn is rejected outright if the document isn't focused yet, which is
  // common right after opening a fresh tab/PWA — so wait for focus first instead
  // of firing immediately (that's what made the prompt seem to vanish).
  useEffect(() => {
    if (autoFpTried.current || mode !== 'login' || !fingerprintAvailable) return;
    const tryNow = () => { if (!autoFpTried.current) { autoFpTried.current = true; handleFingerprintLogin(); } };
    if (document.hasFocus()) { tryNow(); return; }
    window.addEventListener('focus', tryNow, { once: true });
    return () => window.removeEventListener('focus', tryNow);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mode, fingerprintAvailable]);

  const submit = async () => {
    if (mode === 'signup') {
      if (!fields.name || !fields.email || !fields.password) {
        flash('Please fill in your name, email and password to create your account.');
        return;
      }
      if (fields.password.length < 8) {
        flash('Password must be at least 8 characters.');
        return;
      }
      if (!fields.accessKey) {
        flash('Enter the access key to create a new account. Contact the developer if you don\u2019t have one.');
        return;
      }
      if (fields.accessKey !== SIGNUP_ACCESS_KEY) {
        flash('That access key isn\u2019t correct. Contact the developer for the right key.');
        return;
      }
      if (users.some((u) => u.email.toLowerCase() === fields.email.toLowerCase())) {
        flash('An account with that email already exists — try logging in.');
        return;
      }
      // Password is hashed before it ever leaves this screen, and a random account key is
      // generated and tied to this email + password — both travel with the account from
      // here on (into exported backups, and shown/hidden from Settings).
      const passwordHash = await hashPassword(fields.password);
      const accountKey = generateAccountKey();
      onSignup({ id: uid(), name: fields.name, businessName: fields.businessName || '', email: fields.email, password: passwordHash, accountKey });
    } else {
      const enteredHash = await hashPassword(fields.password);
      const match = users.find((u) => u.email.toLowerCase() === fields.email.toLowerCase() && u.password === enteredHash);
      if (!match) { setAuthError('No account matches that email and password.'); return; }
      onLogin(match);
    }
  };

function Carousel({ slides }) {
  const [index, setIndex] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => setIndex((i) => (i + 1) % slides.length), 5000);
    return () => clearInterval(timerRef.current);
  }, [slides.length]);

  const go = (i) => {
    clearInterval(timerRef.current);
    setIndex((i + slides.length) % slides.length);
    timerRef.current = setInterval(() => setIndex((x) => (x + 1) % slides.length), 5000);
  };

  const s = slides[index];
  return (
    <div className={`carousel tone-${s.tone}`}>
      <div className="carousel-slide">
        <div className="carousel-icon"><s.icon size={26} /></div>
        <div className="carousel-body">
          <div className="carousel-title kb-display">{s.title}</div>
          <div className="carousel-desc">{s.desc}</div>
        </div>
      </div>
      <div className="carousel-dots">
        {slides.map((_, i) => <button key={i} className={`carousel-dot ${i === index ? 'carousel-dot-active' : ''}`} onClick={() => go(i)} />)}
      </div>
    </div>
  );
}

function AutoSlider({ items, renderItem, interval = 2000 }) {
  const [index, setIndex] = useState(0);
  useEffect(() => { if (index >= items.length) setIndex(0); }, [items.length, index]);
  useEffect(() => {
    if (items.length <= 1) return;
    const t = setInterval(() => setIndex((i) => (i + 1) % items.length), interval);
    return () => clearInterval(t);
  }, [items.length, interval]);
  const safeIndex = index % items.length;
  return (
    <div className="auto-slider">
      <div key={safeIndex} className="auto-slider-item">{renderItem(items[safeIndex], safeIndex)}</div>
      {items.length > 1 && (
        <div className="auto-slider-dots">
          {items.map((_, i) => <span key={i} className={`auto-slider-dot ${i === safeIndex ? 'auto-slider-dot-active' : ''}`} />)}
        </div>
      )}
    </div>
  );
}

  // Generic, works across every data type: each guarded setter below records the value it's

  const [undoStack, setUndoStack] = useState([]);
  const [historyOpen, setHistoryOpen] = useState(false);

    if (!undoBatchRef.current) {
      const batch = { id: uid(), ts: Date.now(), keys: {}, labels: [] };
      undoBatchRef.current = batch;
      setTimeout(() => {
        undoBatchRef.current = null;
        const finalLabel = batch.labels.length
          ? batch.labels.join(' · ')
          : Object.keys(batch.keys).map((k) => `Updated ${UNDO_DATA_LABELS[k] || k}`).join(' · ');
        setUndoStack((prev) => [...prev.slice(-29), { id: batch.id, ts: batch.ts, label: finalLabel, keys: batch.keys }]);
      }, 0);
    }
    const batch = undoBatchRef.current;
    if (!(key in batch.keys)) batch.keys[key] = prevValue;
    if (label && !batch.labels.includes(label)) batch.labels.push(label);

  const undoRawSetters = {

  const undoAction = (entryId) => {
    const idx = undoStack.findIndex((e) => e.id === entryId);
    if (idx === -1) return;
    // Undoing an older entry also undoes everything newer than it (in reverse order), since
    // those later actions may depend on the state this restores.
    [...undoStack].slice(idx).reverse().forEach((entry) => {
      Object.entries(entry.keys).forEach(([key, prevValue]) => { undoRawSetters[key] && undoRawSetters[key](prevValue); });
    });
    setUndoStack((prev) => prev.slice(0, idx));

  useEffect(() => {

      const key = e.recurringId || e.id;
      (groups[key] = groups[key] || []).push(e);

    const additions = [];
    Object.values(groups).forEach((entries) => {
      const latest = entries.slice().sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      if (latest.date.slice(0, 7) === thisMonth) return; // already logged this month
      const originalDay = new Date(latest.date).getDate();
      const [yy, mm] = thisMonth.split('-').map(Number);

  useEffect(() => {

    const thisMonth = todayISO().slice(0, 7);
    const groups = {};
    invoices.forEach((inv) => {
      if (!inv.recurring || inv.status === 'void') return;
