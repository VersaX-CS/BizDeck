<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (safe zone for adaptive icons) -->
  <circle cx="256" cy="256" r="256" fill="#0052CC"/>
  
  <!-- Main "B" shape background -->
  <path d="M 150 100 L 300 100 Q 350 100 350 150 L 350 200 Q 350 230 320 240 Q 360 255 360 290 L 360 360 Q 360 410 310 410 L 150 410 Z" fill="#0052CC"/>
  
  <!-- Left vertical bar (white) -->
  <rect x="170" y="120" width="40" height="270" fill="white" rx="8"/>
  
  <!-- Top curve (white) -->
  <path d="M 210 120 Q 310 120 310 165 Q 310 200 280 210 L 210 210 Z" fill="white"/>
  
  <!-- Middle horizontal connector (white) -->
  <path d="M 210 205 L 280 205 Q 310 215 310 245 L 210 245 Z" fill="white"/>
  
  <!-- Bottom curve (white) -->
  <path d="M 210 245 Q 310 245 310 300 Q 310 340 270 360 L 210 360 Z" fill="white"/>
  
  <!-- Chart bars group -->
  <g transform="translate(200, 200)">
    <!-- Bar 1 - Blue -->
    <rect x="50" y="80" width="25" height="70" fill="#0052CC" rx="4"/>
    
    <!-- Bar 2 - Teal -->
    <rect x="90" y="50" width="25" height="100" fill="#00C7B7" rx="4"/>
    
    <!-- Bar 3 - Green -->
    <rect x="130" y="20" width="25" height="130" fill="#00D084" rx="4"/>
    
    <!-- Upward arrow curved -->
    <path d="M 180 120 Q 190 80 210 40" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="210,40 225,45 215,60" fill="white"/>
  </g>
</svg>
